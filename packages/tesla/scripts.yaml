tesla_precondition:
  alias: "Precondition Tesla"
  description: "Start cabin climate and set temperature to 22 C"
  icon: mdi:fan
  sequence:
    - action: climate.turn_on
      target:
        entity_id: "{{ 'climate.' + states('input_text.tesla_car_name') + '_climate' }}"
    - action: climate.set_temperature
      target:
        entity_id: "{{ 'climate.' + states('input_text.tesla_car_name') + '_climate' }}"
      data:
        temperature: 22
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Preconditioning started."

tesla_charge_to_80:
  alias: "Tesla Charge Limit 80"
  description: "Set the Tesla charge limit to 80 percent"
  icon: mdi:battery-charging-80
  sequence:
    - action: number.set_value
      target:
        entity_id: "{{ 'number.' + states('input_text.tesla_car_name') + '_charge_limit' }}"
      data:
        value: 80
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Charge limit set to 80 percent."

tesla_climate_off:
  alias: "Tesla Climate Off"
  description: "Turn off cabin climate"
  icon: mdi:air-conditioner-off
  sequence:
    - action: climate.turn_off
      target:
        entity_id: "{{ 'climate.' + states('input_text.tesla_car_name') + '_climate' }}"

tesla_smart_charge_to_target:
  alias: "Tesla - Smart Charge to Target"
  description: "Set the charge limit to the value in input_number.tesla_target_charge_limit"
  icon: mdi:battery-charging
  sequence:
    - action: number.set_value
      target:
        entity_id: "{{ 'number.' + states('input_text.tesla_car_name') + '_charge_limit' }}"
      data:
        value: "{{ states('input_number.tesla_target_charge_limit') | int(80) }}"
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Charge limit set to {{ states('input_number.tesla_target_charge_limit') }}%"

tesla_set_departure_now_plus_2h:
  alias: "Tesla - Set Departure +2 Hours"
  description: "Quickly set next departure time to now + 2 hours"
  icon: mdi:clock-outline
  sequence:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tesla_next_departure
      data:
        datetime: "{{ (now() + timedelta(hours=2)).strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Departure time set to +2 hours"

# ─────────────────────────────────────────────────────────────
# UNIVERSAL SCRIPTS — entity_id built from input_text.tesla_car_name
# Change that helper → all scripts auto-route to the new vehicle
# ─────────────────────────────────────────────────────────────

tesla_lock_toggle:
  alias: "Tesla Lock Toggle"
  icon: mdi:lock
  # Tesla Fleet does not implement lock.toggle (HA reports
  # "action lock.toggle which was not found"). Toggle via lock/unlock.
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('lock.' + states('input_text.tesla_car_name') + '_lock', 'locked') }}
          sequence:
            - action: lock.unlock
              target:
                entity_id: "{{ 'lock.' + states('input_text.tesla_car_name') + '_lock' }}"
      default:
        - action: lock.lock
          target:
            entity_id: "{{ 'lock.' + states('input_text.tesla_car_name') + '_lock' }}"

tesla_climate_toggle:
  alias: "Tesla Climate Toggle"
