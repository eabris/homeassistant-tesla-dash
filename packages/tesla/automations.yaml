- id: tesla_reserved_car_name_guard
  alias: "Tesla - Warn if car name collides with reserved alias prefix"
  description: >
    The dashboard's "Fleet Sensor Aliases" (sensor.vehicle_*, binary_sensor.vehicle_*)
    read from sensor.<car>_* / binary_sensor.<car>_* using input_text.tesla_car_name.
    This only works if the car name is never literally "vehicle" — otherwise the
    aliases would try to read their own state and get stuck on "unknown" (the
    same bug that happened when the car was named "tesla" against a tesla_*
    alias prefix). This automation fires a persistent notification if that
    reserved word is ever used, so you get an immediate warning instead of a
    silent breakage.
  trigger:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_text.tesla_car_name
  condition:
    - condition: template
      value_template: "{{ states('input_text.tesla_car_name') | lower == 'vehicle' }}"
  action:
    - action: persistent_notification.create
      data:
        title: "⚠️ Tesla Dashboard Configuration Conflict"
        message: >
          input_text.tesla_car_name is set to "vehicle", which collides with
          this project's reserved "vehicle_" alias prefix (sensor.vehicle_odometer,
          etc.). This will cause those sensors to read their own state and get
          stuck on "unknown". Please rename your vehicle to anything else
          (e.g. "tesla", "car1", "myev") and update input_text.tesla_car_name
          to match your Tesla Fleet integration's real entity prefix.

- id: tesla_drive_energy_session_start
  alias: "Tesla - Capture drive session start (battery/odometer)"
  description: >
    Snapshots battery % and odometer the moment a drive starts, so the real
    energy consumed during the drive can be computed when it ends.
  trigger:
    - trigger: state
      entity_id: binary_sensor.tesla_driving_active
      to: "on"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_start_battery_pct
      data:
        value: "{{ states('sensor.vehicle_battery_level') | float(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_start_odometer
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"

- id: tesla_drive_energy_session_end
  alias: "Tesla - Log real energy consumed for completed drive"
  description: >
    When a drive ends, computes the energy actually consumed from the battery
    (% drop x pack capacity) and adds it to the running total used to power
    the real efficiency/energy-used analytics (see sensor.tesla_efficiency_kwh_km
    and sensor.tesla_drive_energy_consumed_total).
  trigger:
    - trigger: state
      entity_id: binary_sensor.tesla_driving_active
      to: "off"
  condition:
    # Ignore tiny/noisy blips - only log real drives of at least 300 meters.
    - condition: template
      value_template: >
        {% set start_odo = states('input_number.tesla_drive_start_odometer') | float(0) %}
        {% set end_odo = states('sensor.vehicle_odometer') | float(0) %}
        {{ (end_odo - start_odo) >= 0.3 }}
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_energy_consumed_total_kwh
      data:
        value: >
          {% set start_pct = states('input_number.tesla_drive_start_battery_pct') | float(0) %}
          {% set end_pct = states('sensor.vehicle_battery_level') | float(0) %}
          {% set capacity = states('input_number.tesla_battery_capacity_kwh') | float(100) %}
          {% set dropped_pct = start_pct - end_pct %}
          {# Only count it if the battery actually dropped (ignore drives where it
             charged/preconditioned and net gained %, to avoid negative energy). #}
          {% set session_kwh = (dropped_pct / 100 * capacity) if dropped_pct > 0 else 0 %}
          {{ (states('input_number.tesla_drive_energy_consumed_total_kwh') | float(0) + session_kwh) | round(3) }}

- id: tesla_odometer_daily_baseline_midnight
  alias: Tesla - Reset daily odometer baseline
  description: Snapshot odometer at midnight so daily distance resets
  trigger:
    - trigger: time
      at: "00:00:05"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_odometer_daily_baseline
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"

- id: tesla_odometer_monthly_baseline
  alias: Tesla - Reset monthly odometer baseline
  description: Snapshot odometer on the 1st of each month
  trigger:
    - trigger: time
      at: "00:00:10"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_odometer_monthly_baseline
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"

- id: tesla_odometer_baseline_startup
  alias: Tesla - Init odometer baselines on startup
  description: Initialize distance baselines after HA restart
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.tesla_odometer_daily_baseline') | float(0) == 0 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.tesla_odometer_daily_baseline
              data:
                value: "{{ states('sensor.vehicle_odometer') | float(0) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.tesla_odometer_monthly_baseline') | float(0) == 0 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.tesla_odometer_monthly_baseline
              data:
                value: "{{ states('sensor.vehicle_odometer') | float(0) }}"


- id: tesla_precondition_before_departure
  alias: "Tesla - Precondition before departure"
  description: "Automatically start preconditioning ~40 minutes before the set departure time"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: template
      value_template: >
        {% set departure = states('input_datetime.tesla_next_departure') %}
        {% if departure in ['unknown', 'unavailable', None] %}
          false
        {% else %}
          {% set dep_time = as_local(strptime(departure, '%Y-%m-%d %H:%M:%S')) %}
          {% set precondition_time = dep_time - timedelta(minutes=40) %}
          {{ now() >= precondition_time and now() < dep_time }}
        {% endif %}
  action:
    - action: script.tesla_precondition
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Preconditioning started (40 min before departure)"

- id: tesla___close_windows_before_rain
  alias: Tesla - Close windows before rain
  description: Automatically close windows if rain is predicted in the next 2 hours.
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.tesla_front_driver_window
        - binary_sensor.tesla_rear_driver_window
        - binary_sensor.tesla_front_passenger_window
        - binary_sensor.tesla_rear_passenger_window
      to: "on"
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: template
      value_template: >-
        {{ is_state('binary_sensor.tesla_front_driver_window', 'on') or
           is_state('binary_sensor.tesla_rear_driver_window', 'on') or
           is_state('binary_sensor.tesla_front_passenger_window', 'on') or
           is_state('binary_sensor.tesla_rear_passenger_window', 'on') }}
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           now() - this.attributes.last_triggered > timedelta(hours=3) }}
  action:
    - service: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: hourly
      response_variable: tesla_hourly_forecast
    - condition: template
      value_template: >-
        {% set forecast = tesla_hourly_forecast.get('weather.forecast_home', {}).get('forecast', []) %}
        {% set rainy = ['rainy', 'pouring', 'lightning-rainy', 'hail'] %}
        {% set ns = namespace(rain=false) %}
        {% for hour in forecast[:2] %}
          {% if hour.precipitation|default(0)|float > 0 or hour.precipitation_probability|default(0)|int >= 50 or hour.condition in rainy %}
            {% set ns.rain = true %}
          {% endif %}
        {% endfor %}
        {{ ns.rain }}
    - service: persistent_notification.create
      data:
        title: Tesla windows open before rain
        message: Rain is forecast within the next 2 hours. Waking the Tesla and closing windows.
    - service: script.tesla_wake_vehicle
    - delay: "00:00:20"
    - service: cover.close_cover
      target:
        entity_id: cover.tesla_windows
  mode: single
  initial_state: true