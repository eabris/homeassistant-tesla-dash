- id: tesla_refresh_fleet_token
  alias: "Tesla - Refresh Fleet API token (periodic)"
  description: >
    Runs script.tesla_refresh_fleet_token every hour (at :17), quietly. The
    script makes the Tesla Fleet integration refresh its own token if it has
    expired, copies it into secrets.yaml (via shell_command +
    scripts/refresh_tesla_token.sh), and reloads scripts so
    script.tesla_windows_close / rest_command.tesla_window_close_gps uses it
    immediately. No restart needed. Runs hourly (it used to be every 6h)
    because the token lasts ~8h: with a 6h copy, the copy in secrets.yaml
    could be expired for hours. Idempotent: an unchanged token causes no
    write, no backup and no reload. Only notifies on failure. Close Windows
    also triggers the same refresh itself when it gets a 401.
  trigger:
    - trigger: time_pattern
      minutes: 17
  action:
    - action: script.tesla_refresh_fleet_token
      data:
        quiet: true
  mode: single
  initial_state: true

- id: tesla_reserved_car_name_guard
  alias: "Tesla - Warn if car name is invalid or reserved"
  description: >
    The dashboard's "Fleet Sensor Aliases" (sensor.vehicle_*, binary_sensor.vehicle_*)
    and every "universal" script/automation read from sensor.<car>_* /
    binary_sensor.<car>_* by dynamically building the entity_id from
    input_text.tesla_car_name. This breaks two ways: (1) if the car name is
    ever literally "vehicle", it collides with this project's reserved
    "vehicle_" alias prefix and those sensors read their own state, getting
    stuck on "unknown" (the same bug that happened when the car was named
    "tesla" against a tesla_* alias prefix); (2) if the helper is ever blank/
    unknown/unavailable (e.g. right after a fresh install, before it's been
    set), every dynamically-built entity_id becomes garbage like
    "climate.unknown_climate" and silently does nothing. This automation
    fires a persistent notification for either case, so it fails loudly
    instead of silently.
  trigger:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_text.tesla_car_name
  condition:
    - condition: template
      value_template: >
        {{ states('input_text.tesla_car_name') | lower in ['vehicle', 'unknown', 'unavailable', ''] }}
  action:
    - action: persistent_notification.create
      data:
        title: "⚠️ Tesla Dashboard Configuration Conflict"
        message: >
          {% if states('input_text.tesla_car_name') | lower == 'vehicle' %}
            input_text.tesla_car_name is set to "vehicle", which collides with
            this project's reserved "vehicle_" alias prefix (sensor.vehicle_odometer,
            etc.). This will cause those sensors to read their own state and get
            stuck on "unknown". Please rename your vehicle to anything else
            (e.g. "tesla", "car1", "myev") and update input_text.tesla_car_name
            to match your Tesla Fleet integration's real entity prefix.
          {% else %}
            input_text.tesla_car_name is blank/unknown/unavailable. Every
            script, automation, and dashboard card in this project needs this
            set to your Tesla Fleet integration's real entity prefix (e.g. if
            your entities look like sensor.tesla_battery_level, set this to
            "tesla") or nothing will work. Go to Settings → Devices & Services
            → Helpers → "Tesla Car Name (entity prefix)" and set it now.
          {% endif %}

- id: tesla_drive_energy_session_start
  alias: "Tesla - Capture drive session start (battery/odometer)"
  description: >
    Snapshots battery % and odometer the moment a drive starts, so the real
    energy consumed during the drive can be computed when it ends.
  trigger:
    - trigger: state
      entity_id: binary_sensor.tesla_driving_active
      to: "on"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_start_battery_pct
      data:
        value: "{{ states('sensor.vehicle_battery_level') | float(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_start_odometer
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"

- id: tesla_drive_energy_session_end
  alias: "Tesla - Log real energy consumed for completed drive"
  description: >
    When a drive ends, computes the energy actually consumed from the battery
    (% drop x pack capacity) and adds it to the running total used to power
    the real efficiency/energy-used analytics (see sensor.tesla_efficiency_kwh_km
    and sensor.tesla_drive_energy_consumed_total).
  trigger:
    - trigger: state
      entity_id: binary_sensor.tesla_driving_active
      to: "off"
  condition:
    # Ignore tiny/noisy blips - only log real drives of at least 300 meters.
    - condition: template
      value_template: >
        {% set start_odo = states('input_number.tesla_drive_start_odometer') | float(0) %}
        {% set end_odo = states('sensor.vehicle_odometer') | float(0) %}
        {{ (end_odo - start_odo) >= 0.3 }}
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_drive_energy_consumed_total_kwh
      data:
        value: >
          {% set start_pct = states('input_number.tesla_drive_start_battery_pct') | float(0) %}
          {% set end_pct = states('sensor.vehicle_battery_level') | float(0) %}
          {% set capacity = states('input_number.tesla_battery_capacity_kwh') | float(100) %}
          {% set dropped_pct = start_pct - end_pct %}
          {# Only count it if the battery actually dropped (ignore drives where it
             charged/preconditioned and net gained %, to avoid negative energy). #}
          {% set session_kwh = (dropped_pct / 100 * capacity) if dropped_pct > 0 else 0 %}
          {{ (states('input_number.tesla_drive_energy_consumed_total_kwh') | float(0) + session_kwh) | round(3) }}

- id: tesla_odometer_monthly_baseline
  alias: Tesla - Reset monthly odometer baseline
  description: Snapshot odometer on the 1st of each month
  trigger:
    - trigger: time
      at: "00:00:10"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
    - condition: template
      value_template: "{{ states('sensor.vehicle_odometer') not in ['unknown', 'unavailable', 'none', none] }}"
  action:
    # Capture the just-ended month's total distance BEFORE overwriting the
    # baseline below -- powers the History tab's "Previous Month" card
    # (sensor.tesla_previous_month_distance). Order matters: this must run
    # first, while the baseline still reflects the month that's ending.
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_previous_month_distance
      data:
        value: >
          {% set odo = states('sensor.vehicle_odometer') | float(0) %}
          {% set baseline = states('input_number.tesla_odometer_monthly_baseline') | float(0) %}
          {{ ((odo - baseline) if odo >= baseline else 0) | round(2) }}
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_odometer_monthly_baseline
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"

- id: tesla_odometer_baseline_startup
  alias: Tesla - Init odometer baseline on startup
  description: Initialize the monthly distance baseline after a HA restart, if it was never set
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: template
      value_template: "{{ states('input_number.tesla_odometer_monthly_baseline') | float(0) == 0 }}"
    - condition: template
      value_template: "{{ states('sensor.vehicle_odometer') not in ['unknown', 'unavailable', 'none', none] }}"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_odometer_monthly_baseline
      data:
        value: "{{ states('sensor.vehicle_odometer') | float(0) }}"


- id: tesla_precondition_before_departure
  alias: "Tesla - Precondition before departure"
  description: "Automatically start preconditioning ~40 minutes before the set departure time"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition:
    - condition: template
      value_template: >
        {% set departure = states('input_datetime.tesla_next_departure') %}
        {% if departure in ['unknown', 'unavailable', None] %}
          false
        {% else %}
          {% set dep_time = as_local(strptime(departure, '%Y-%m-%d %H:%M:%S')) %}
          {% set precondition_time = dep_time - timedelta(minutes=40) %}
          {{ now() >= precondition_time and (now() - precondition_time).total_seconds() < 300 }}
        {% endif %}
  action:
    - action: script.tesla_precondition
    - action: persistent_notification.create
      data:
        title: "Tesla"
        message: "Preconditioning started (40 min before departure)"

- id: tesla_close_windows_before_rain
  alias: Tesla - Close windows before rain
  description: Automatically close windows if rain is predicted in the next 2 hours.
  trigger:
    - platform: state
      entity_id: binary_sensor.vehicle_any_window_open
      to: "on"
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: state
      entity_id: binary_sensor.vehicle_any_window_open
      state: "on"
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none or
           now() - this.attributes.last_triggered > timedelta(hours=3) }}
  action:
    - service: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: hourly
      response_variable: tesla_hourly_forecast
    - condition: template
      value_template: >-
        {% set forecast = tesla_hourly_forecast.get('weather.forecast_home', {}).get('forecast', []) %}
        {% set rainy = ['rainy', 'pouring', 'lightning-rainy', 'hail'] %}
        {% set ns = namespace(rain=false) %}
        {% for hour in forecast[:2] %}
          {% if hour.precipitation|default(0)|float > 0 or hour.precipitation_probability|default(0)|int >= 50 or hour.condition in rainy %}
            {% set ns.rain = true %}
          {% endif %}
        {% endfor %}
        {{ ns.rain }}
    - service: persistent_notification.create
      data:
        title: Tesla windows open before rain
        message: Rain is forecast within the next 2 hours. Waking the Tesla and closing windows.
    - service: script.tesla_wake
    - delay: "00:00:20"
    - service: script.tesla_windows_close
  mode: single
  initial_state: true

- id: tesla_smart_charge_start
  alias: "Tesla - Smart Charging: Start (off-peak window)"
  description: >
    Starts charging once per day, only during the configured off-peak window
    (input_datetime.tesla_smart_charge_window_start/_end), and only when
    plugged in and below the target charge % (input_number.tesla_target_charge_limit).
    Deliberately fires at most once per day via a fixed `time` trigger (plus
    one extra trigger for "just plugged in during the window") rather than
    polling — frequent on/off toggling is harder on the charging contactor/
    relay hardware and provides no real benefit over one continuous session.
    Also syncs the vehicle's own charge limit to the target first, so the
    car's onboard charge controller — not this automation — is what actually
    stops charging once the target is reached (defense in depth: charging
    stays capped even if HA is restarted mid-window).
    Charges at full power: the highest current the car accepts (the max of
    number.<car>_charge_current, usually 16 A), capped at
    input_number.tesla_home_charger_max_amps.
    Inactive while input_boolean.tesla_full_auto_charging is on (the
    tesla_auto_charge_* planner automations take over then).
  trigger:
    - trigger: time
      at: input_datetime.tesla_smart_charge_window_start
    - trigger: state
      entity_id: binary_sensor.vehicle_charge_cable
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.tesla_enable_smart_charging
      state: "on"
    - condition: state
      entity_id: input_boolean.tesla_full_auto_charging
      state: "off"
    - condition: state
      entity_id: binary_sensor.vehicle_charge_cable
      state: "on"
    - condition: state
      entity_id: binary_sensor.tesla_charging_active
      state: "off"
    - condition: template
      value_template: >
        {{ states('sensor.vehicle_battery_level') | float(100) <
           states('input_number.tesla_target_charge_limit') | float(80) }}
    - condition: template
      value_template: >
        {% set now_t = now().time() %}
        {% set start_t = strptime(states('input_datetime.tesla_smart_charge_window_start'), '%H:%M:%S').time() %}
        {% set end_t = strptime(states('input_datetime.tesla_smart_charge_window_end'), '%H:%M:%S').time() %}
        {% if start_t <= end_t %}
          {{ start_t <= now_t < end_t }}
        {% else %}
          {{ now_t >= start_t or now_t < end_t }}
        {% endif %}
  action:
    - action: number.set_value
      target:
        entity_id: "{{ 'number.' + states('input_text.tesla_car_name') + '_charge_limit' }}"
      data:
        value: "{{ states('input_number.tesla_target_charge_limit') | int(80) }}"
    # Full power. A lower current left over from Full auto following the
    # sun, or set by hand, would slow down the off-peak window.
    - variables:
        car_max_amps: >
          {{ state_attr('number.' ~ states('input_text.tesla_car_name') ~ '_charge_current', 'max') | int(16) }}
        max_amps: >
          {{ [[car_max_amps, [states('input_number.tesla_home_charger_max_amps') | int(16), 5] | max] | min, 5] | max }}
    - if: "{{ states('number.vehicle_charge_current') | int(0) != max_amps }}"
      then:
        - action: number.set_value
          target:
            entity_id: "{{ 'number.' + states('input_text.tesla_car_name') + '_charge_current' }}"
          data:
            value: "{{ max_amps }}"
    - action: script.tesla_charge_start
    - action: persistent_notification.create
      data:
        title: "Tesla Smart Charging"
        message: >
          Started charging during your off-peak window at {{ max_amps }} A
          (target {{ states('input_number.tesla_target_charge_limit') }}%). It will
          stop automatically once the target is reached, or when the window
          ends.
  mode: single

- id: tesla_smart_charge_stop
  alias: "Tesla - Smart Charging: Stop (window ended)"
  description: >
    Companion to tesla_smart_charge_start. If the off-peak window ends and
    the car is still charging (i.e. it didn't reach the target in time),
    stop charging so the remainder isn't paid for at a peak rate. Fires at
    most once per day, at a fixed time — no polling, no repeated toggling.
    If charging already stopped on its own (target reached), this is a
    harmless no-op (gated on binary_sensor.tesla_charging_active being on).
    Inactive while Full auto charging is on, like tesla_smart_charge_start.
  trigger:
    - trigger: time
      at: input_datetime.tesla_smart_charge_window_end
  condition:
    - condition: state
      entity_id: input_boolean.tesla_enable_smart_charging
      state: "on"
    - condition: state
      entity_id: input_boolean.tesla_full_auto_charging
      state: "off"
    - condition: state
      entity_id: binary_sensor.tesla_charging_active
      state: "on"
  action:
    - action: script.tesla_charge_stop
    - action: persistent_notification.create
      data:
        title: "Tesla Smart Charging"
        message: >
          Off-peak window ended; charging paused before reaching your
          {{ states('input_number.tesla_target_charge_limit') }}% target.
          It'll resume automatically tomorrow if still plugged in.
  mode: single

- id: tesla_wheel_size_auto_adjust
  alias: "Tesla - Auto-set Tire Pressure & Range Adjustment for Wheel Size"
  description: >
    When you change input_select.tesla_wheel_size (Settings tab), automatically
    updates input_number.tesla_recommended_tire_pressure and
    input_number.tesla_wheel_range_adjustment_pct to Tesla community-typical
    defaults for that size. These are starting estimates only, not pulled
    from any Tesla API — after switching sizes, feel free to edit either
    slider by hand if you know your own vehicle's exact placard pressure or
    have observed a different real-world range impact.
  trigger:
    - trigger: state
      entity_id: input_select.tesla_wheel_size
  action:
    - variables:
        size: "{{ trigger.to_state.state }}"
        pressure_map:
          '18"': 2.9
          '19"': 2.9
          '20"': 2.9
          '21"': 3.1
          '22"': 2.9
        adjustment_map:
          '18"': 0
          '19"': 3
          '20"': 6
          '21"': 10
          '22"': 14
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_recommended_tire_pressure
      data:
        value: "{{ pressure_map.get(size, 2.9) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_wheel_range_adjustment_pct
      data:
        value: "{{ adjustment_map.get(size, 0) }}"
  mode: single

# --- Hungarian tariffs (agents.md Section 21) ---
- id: tesla_quota_usage_set
  alias: "Tesla - Quota: Set Used This Month"
  description: >
    When you type your home's real grid use so far this month into "Used
    This Month So Far" (Analytics > Settings), corrects this month's
    discounted-quota count to that value. It then keeps counting up from
    there (meter or estimate). The correction ends with the month.
  triggers:
    - trigger: state
      entity_id: input_number.tesla_quota_used_this_month
  conditions:
    # Only a value you typed (not a restore after a restart).
    - condition: template
      value_template: >
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable']
           and trigger.to_state.state | is_number
           and trigger.to_state.context.user_id is not none }}
  actions:
    - variables:
        raw: >
          {{ state_attr('sensor.tesla_quota_usage_monthly', 'uncorrected_kwh') | float(0) }}
    - action: input_number.set_value
      target:
        entity_id: input_number.tesla_quota_usage_correction
      data:
        value: "{{ ([[trigger.to_state.state | float - raw, -3000] | max, 3000] | min) | round(2) }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tesla_quota_correction_set
      data:
        timestamp: "{{ now().timestamp() }}"
  mode: queued

# --- Full auto charging (agents.md Section 22) ---
# sensor.tesla_auto_charge_plan (configuration.yaml) decides; these act on it.
# Only active while input_boolean.tesla_full_auto_charging is on (the fixed
# off-peak window automations above step aside then). Works with every
# tariff mode.
# Ownership: input_boolean.tesla_auto_charge_owned is on while Full auto is
# managing the session (it started it, or adopted the car's own plug-in
# auto-start). It only ever stops sessions it owns, never a charge you
# started by hand later.
# Anti-flapping (agents.md Section 7): every start/stop records
# input_datetime.tesla_auto_charge_last_switch and nothing switches again
# within 30 minutes; amps are adjusted at most every 5 min and only by 2 A+.
- id: tesla_auto_charge_control
  alias: "Tesla - Full Auto Charging: Start / Stop"
  description: >
    Starts or stops home charging when sensor.tesla_auto_charge_plan says so
    (attribute should_charge). On start it sets the car's charge limit to the
    Target Charge Limit (not for "Charge now") and its amps to the plan's
    amps, and remembers until when it committed to charging. On stop it puts
    the amps back to the Home Charger Max Current. At least 30 minutes
    between its own switches.
  triggers:
    - trigger: state
      entity_id: sensor.tesla_auto_charge_plan
    - trigger: time_pattern
      minutes: "/5"
      seconds: 15
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_full_auto_charging
      state: "on"
  actions:
    - variables:
        car: "{{ states('input_text.tesla_car_name') }}"
        reason: "{{ states('sensor.tesla_auto_charge_plan') }}"
        should: "{{ state_attr('sensor.tesla_auto_charge_plan', 'should_charge') == true }}"
        amps: "{{ state_attr('sensor.tesla_auto_charge_plan', 'amps') | int(16) }}"
        max_amps: "{{ [states('input_number.tesla_home_charger_max_amps') | int(16), 5] | max }}"
        since_switch: >
          {{ now().timestamp()
             - state_attr('input_datetime.tesla_auto_charge_last_switch', 'timestamp') | float(0) }}
        summary: "{{ state_attr('sensor.tesla_auto_charge_plan', 'summary') }}"
    - choose:
        - conditions:
            - "{{ should and reason not in ['off', 'away', 'unplugged', 'no_data'] }}"
            - condition: state
              entity_id: input_boolean.tesla_auto_charge_owned
              state: "off"
            - condition: state
              entity_id: binary_sensor.tesla_charging_active
              state: "off"
            - "{{ since_switch >= 1800 }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.tesla_auto_charge_owned
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_auto_charge_last_switch
              data:
                timestamp: "{{ now().timestamp() }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_auto_charge_block_end
              data:
                timestamp: >
                  {{ state_attr('sensor.tesla_auto_charge_plan', 'commit_until_ts') | float(now().timestamp()) }}
            - if: "{{ reason != 'override' }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "number.{{ car }}_charge_limit"
                  data:
                    value: "{{ states('input_number.tesla_target_charge_limit') | int(80) }}"
                  continue_on_error: true
            - action: number.set_value
              target:
                entity_id: "number.{{ car }}_charge_current"
              data:
                value: "{{ amps }}"
              continue_on_error: true
            - action: script.tesla_charge_start
              continue_on_error: true
            - action: persistent_notification.create
              data:
                notification_id: tesla_auto_charging
                title: "Tesla Full Auto Charging"
                message: "Started charging. {{ summary }}"
        - conditions:
            - "{{ not should and reason not in ['off', 'away', 'unplugged', 'no_data'] }}"
            - condition: state
              entity_id: input_boolean.tesla_auto_charge_owned
              state: "on"
            - "{{ since_switch >= 1800 }}"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.tesla_auto_charge_owned
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_auto_charge_last_switch
              data:
                timestamp: "{{ now().timestamp() }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_auto_charge_block_end
              data:
                timestamp: "{{ now().timestamp() }}"
            - action: script.tesla_charge_stop
              continue_on_error: true
            - if: "{{ states('number.vehicle_charge_current') | int(max_amps) < max_amps }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "number.{{ car }}_charge_current"
                  data:
                    value: "{{ max_amps }}"
                  continue_on_error: true
            - action: persistent_notification.create
              data:
                notification_id: tesla_auto_charging
                title: "Tesla Full Auto Charging"
                message: >
                  {% if reason == 'full' %}Target reached, charging stopped.
                  {% else %}Paused charging. {{ summary }}{% endif %}
        # Already charging (e.g. following the sun at 5 A) when the planned
        # grid block begins: commit to the block from now on. The amps
        # automation below raises the current to the plan's amps.
        - conditions:
            - "{{ should and reason in ['planned', 'deadline'] }}"
            - condition: state
              entity_id: input_boolean.tesla_auto_charge_owned
              state: "on"
            - >
              {{ state_attr('sensor.tesla_auto_charge_plan', 'commit_until_ts') | float(0)
                 > state_attr('input_datetime.tesla_auto_charge_block_end', 'timestamp') | float(0) + 60 }}
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.tesla_auto_charge_block_end
              data:
                timestamp: "{{ state_attr('sensor.tesla_auto_charge_plan', 'commit_until_ts') | float }}"
  mode: single
  max_exceeded: silent

- id: tesla_auto_charge_amps
  alias: "Tesla - Full Auto Charging: Follow Solar (amps)"
  description: >
    While Full auto is charging, sets the car's charging current to the
    plan's amps (lower when following solar surplus, the Home Charger Max
    Current otherwise). At most every 5 minutes and only for a change of 2 A
    or more, so the car isn't sent a command for every passing cloud.
  triggers:
    - trigger: time_pattern
      minutes: "/5"
      seconds: 45
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_full_auto_charging
      state: "on"
    - condition: state
      entity_id: input_boolean.tesla_auto_charge_owned
      state: "on"
    - condition: state
      entity_id: binary_sensor.tesla_charging_active
      state: "on"
    - condition: template
      value_template: >
        {% set want = state_attr('sensor.tesla_auto_charge_plan', 'amps') | int(0) %}
        {% set have = states('number.vehicle_charge_current') | int(0) %}
        {{ want >= 5 and have > 0 and (want - have) | abs >= 2 }}
  actions:
    - action: number.set_value
      target:
        entity_id: "number.{{ states('input_text.tesla_car_name') }}_charge_current"
      data:
        value: "{{ state_attr('sensor.tesla_auto_charge_plan', 'amps') | int }}"
      continue_on_error: true
  mode: single

- id: tesla_auto_charge_adopt
  alias: "Tesla - Full Auto Charging: Take Over Plug-in Auto-start"
  description: >
    The car starts charging by itself as soon as it's plugged in. When that
    happens (charging begins within 20 minutes of plugging in) and Full auto
    is on, Full auto takes the session over, so it can pause it until the
    cheapest block if waiting is cheaper. Charges you start later by hand,
    or with "Charge now", are left alone.
  triggers:
    - trigger: state
      entity_id: binary_sensor.tesla_charging_active
      from: "off"
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.tesla_full_auto_charging
      state: "on"
    - condition: state
      entity_id: input_boolean.tesla_auto_charge_owned
      state: "off"
    - condition: state
      entity_id: input_boolean.tesla_charge_now_override
      state: "off"
    - condition: state
      entity_id: binary_sensor.vehicle_charge_cable
      state: "on"
    - condition: template
      value_template: >
        {{ is_state('device_tracker.' ~ states('input_text.tesla_car_name') ~ '_location', 'home') }}
    # Ignore "off -> on" blips from restarts/reloads: it must really have
    # been off for 2+ minutes, and the cable plugged in within 20 minutes.
    - condition: template
      value_template: >
        {{ now() - trigger.from_state.last_changed > timedelta(minutes=2)
           and now() - states.binary_sensor.vehicle_charge_cable.last_changed < timedelta(minutes=20) }}
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tesla_auto_charge_last_switch
      data:
        timestamp: "{{ now().timestamp() - 3600 }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.tesla_auto_charge_block_end
      data:
        timestamp: "{{ now().timestamp() }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.tesla_auto_charge_owned
  mode: single

- id: tesla_auto_charge_reset
  alias: "Tesla - Full Auto Charging: Release Session"
  description: >
    Ends Full auto's ownership of a session once it's over: charging stopped
    by itself (e.g. target reached), the cable was unplugged, Full auto was
    switched off, or a start command never resulted in charging within 20
    minutes. Unplugging also ends "Charge now" and a "Stop charging" pause;
    switching Full auto off ends the pause too. When charging finished on its
    own, puts the amps back to the Home Charger Max Current.
  triggers:
    - trigger: state
      entity_id: binary_sensor.tesla_charging_active
      to: "off"
      for: "00:05:00"
      id: charging_off
    - trigger: state
      entity_id: binary_sensor.vehicle_charge_cable
      to: "off"
      id: unplugged
    - trigger: state
      entity_id: input_boolean.tesla_full_auto_charging
      to: "off"
    - trigger: time_pattern
      minutes: "/15"
  actions:
    - if:
        - condition: state
          entity_id: binary_sensor.vehicle_charge_cable
          state: "off"
        - condition: template
          value_template: >
            {{ is_state('input_boolean.tesla_charge_now_override', 'on')
               or is_state('input_boolean.tesla_auto_charge_paused', 'on') }}
      then:
        - action: input_boolean.turn_off
          target:
            entity_id:
              - input_boolean.tesla_charge_now_override
              - input_boolean.tesla_auto_charge_paused
    - if:
        - condition: state
          entity_id: input_boolean.tesla_full_auto_charging
          state: "off"
        - condition: state
          entity_id: input_boolean.tesla_auto_charge_paused
          state: "on"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.tesla_auto_charge_paused
    - if:
        - condition: state
          entity_id: input_boolean.tesla_auto_charge_owned
          state: "on"
        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.vehicle_charge_cable
              state: "off"
            - condition: state
              entity_id: input_boolean.tesla_full_auto_charging
              state: "off"
            - condition: template
              value_template: >
                {{ is_state('binary_sensor.tesla_charging_active', 'off')
                   and now().timestamp()
                       - state_attr('input_datetime.tesla_auto_charge_last_switch', 'timestamp') | float(0) >= 1200 }}
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.tesla_auto_charge_owned
        - if:
            - condition: trigger
              id: charging_off
            - condition: state
              entity_id: binary_sensor.vehicle_charge_cable
              state: "on"
            - condition: template
              value_template: >
                {% set max_a = [states('input_number.tesla_home_charger_max_amps') | int(16), 5] | max %}
                {{ states('number.vehicle_charge_current') | int(max_a) < max_a }}
          then:
            - action: number.set_value
              target:
                entity_id: "number.{{ states('input_text.tesla_car_name') }}_charge_current"
              data:
                value: "{{ [states('input_number.tesla_home_charger_max_amps') | int(16), 5] | max }}"
              continue_on_error: true
  mode: queued
