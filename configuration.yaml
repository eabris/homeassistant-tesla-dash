# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include packages/tesla/automations.yaml
script: !include packages/tesla/scripts.yaml

lovelace:
  mode: storage
  dashboards:
    tesla-dashboard:
      mode: yaml
      title: Tesla Overview
      icon: mdi:car-electric
      show_in_sidebar: true
      filename: dashboards/tesla-overview.yaml
    tesla-analytics:
      mode: yaml
      title: Tesla Analytics
      icon: mdi:chart-line
      show_in_sidebar: true
      filename: dashboards/tesla-analytics.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    - 127.0.0.1
    - ::1
#    - 192.168.188.0/24

utility_meter:
  tesla_daily_distance_raw:
    source: sensor.vehicle_odometer
    cycle: daily
    name: "Tesla Daily Distance Raw"

  tesla_daily_charging_energy:
    source: sensor.vehicle_charge_energy_added
    cycle: daily
    name: "Tesla Daily Charging Energy"

  tesla_weekly_charging_energy:
    source: sensor.vehicle_charge_energy_added
    cycle: weekly
    name: "Tesla Weekly Charging Energy"

  tesla_monthly_charging_energy:
    source: sensor.vehicle_charge_energy_added
    cycle: monthly
    name: "Tesla Monthly Charging Energy"

  tesla_weekly_distance_raw:
    source: sensor.vehicle_odometer
    cycle: weekly
    name: "Tesla Weekly Distance Raw"

  # Real driving energy consumption (accumulated from actual drive sessions,
  # see automations.yaml: tesla_drive_energy_session_start/end).
  tesla_daily_drive_energy:
    source: sensor.tesla_drive_energy_consumed_total
    cycle: daily
    name: "Tesla Daily Drive Energy"

  tesla_weekly_drive_energy:
    source: sensor.tesla_drive_energy_consumed_total
    cycle: weekly
    name: "Tesla Weekly Drive Energy"

  tesla_monthly_drive_energy:
    source: sensor.tesla_drive_energy_consumed_total
    cycle: monthly
    name: "Tesla Monthly Drive Energy"

  # --- Hungarian tariffs (Tariff A / Tariff D), see agents.md Section 21 ---
  # Home charging energy this month (feeds the discounted-quota estimate when
  # no grid import sensor is configured). Source is the trigger-based
  # sensor.tesla_home_charging_energy_total below, which never resets, hence
  # periodically_resetting: false.
  tesla_monthly_home_charging_energy:
    source: sensor.tesla_home_charging_energy_total
    cycle: monthly
    periodically_resetting: false
    name: "Tesla Monthly Home Charging Energy"

  # Charging cost priced at the tariff active while charging (home charging
  # at sensor.tesla_active_charging_price, away charging at the default
  # rate). Used by the "Electric Cost" sensors whenever a tariff is selected.
  # net_consumption: true because Tariff D prices can be negative.
  tesla_daily_tariff_charging_cost:
    source: sensor.tesla_tariff_charging_cost_total
    cycle: daily
    net_consumption: true
    periodically_resetting: false
    name: "Tesla Daily Tariff Charging Cost"

  tesla_weekly_tariff_charging_cost:
    source: sensor.tesla_tariff_charging_cost_total
    cycle: weekly
    net_consumption: true
    periodically_resetting: false
    name: "Tesla Weekly Tariff Charging Cost"

  tesla_monthly_tariff_charging_cost:
    source: sensor.tesla_tariff_charging_cost_total
    cycle: monthly
    net_consumption: true
    periodically_resetting: false
    name: "Tesla Monthly Tariff Charging Cost"

sensor:
  - platform: history_stats
    name: "Tesla Driving Time Today Raw"
    unique_id: tesla_driving_time_today_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Driving Time 7d Raw"
    unique_id: tesla_driving_time_7d_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Charging Time Today Raw"
    unique_id: tesla_charging_time_today_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_charging_active
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Charging Time 7d Raw"
    unique_id: tesla_charging_time_7d_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_charging_active
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Drive Sessions Today"
    unique_id: tesla_drive_sessions_today_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Drive Sessions 7d"
    unique_id: tesla_drive_sessions_7d_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: count
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Charge Sessions Today"
    unique_id: tesla_charge_sessions_today_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_charging_active
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Charge Sessions 7d"
    unique_id: tesla_charge_sessions_7d_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_charging_active
    state: "on"
    type: count
    start: "{{ now() - timedelta(days=7) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Charging Time 3d Raw"
    unique_id: tesla_charging_time_3d_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_charging_active
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=3) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Driving Time 30d Raw"
    unique_id: tesla_driving_time_30d_raw_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: time
    start: "{{ now() - timedelta(days=30) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Tesla Drive Sessions 30d"
    unique_id: tesla_drive_sessions_30d_v1
    state_class: measurement
    entity_id: binary_sensor.tesla_driving_active
    state: "on"
    type: count
    start: "{{ now() - timedelta(days=30) }}"
    end: "{{ now() }}"

  # Rolling (trailing 7x24h) distance/energy for the History tab's "Last 7
  # Days" card, distinct from THIS WEEK's calendar-week (Mon-reset) figures.
  # "change" = newest minus oldest sample of the source within max_age -- both
  # sources are state_class: total_increasing lifetime counters, so this is
  # exactly "how much did this counter grow in the last 7 days". Recorder
  # history backfills this immediately on restart (no history_stats-style
  # cold-start gap), per the statistics integration's own docs.
  - platform: statistics
    name: "Tesla Distance 7d Rolling"
    unique_id: tesla_distance_7d_rolling_v1
    entity_id: sensor.vehicle_odometer
    state_characteristic: change
    max_age:
      days: 7
    precision: 2

  - platform: statistics
    name: "Tesla Charging Energy 7d Rolling"
    unique_id: tesla_charging_energy_7d_rolling_v1
    entity_id: sensor.vehicle_charge_energy_added
    state_characteristic: change
    max_age:
      days: 7
    precision: 2

  # Tariff mode only: last 7x24h of charging cost, priced at the tariff
  # active while charging (see sensor.tesla_tariff_charging_cost_total).
  - platform: statistics
    name: "Tesla Tariff Charging Cost 7d Rolling"
    unique_id: tesla_tariff_charging_cost_7d_rolling_v1
    entity_id: sensor.tesla_tariff_charging_cost_total
    state_characteristic: change
    max_age:
      days: 7
    precision: 2

  # Full auto charging (agents.md Section 22): solar surplus averaged over the
  # last 10 minutes, so a passing cloud doesn't start/stop charging.
  - platform: statistics
    name: "Tesla Solar Surplus Power 10m"
    unique_id: tesla_solar_surplus_power_10m_v1
    entity_id: sensor.tesla_solar_surplus_power
    state_characteristic: average_step
    max_age:
      minutes: 10
    sampling_size: 60
    keep_last_sample: true
    precision: 2

input_select:
  tesla_currency:
    name: "Tesla Currency"
    icon: mdi:currency-usd
    options:
      - "HUF"
      - "EUR"
      - "USD"
      - "GBP"

  tesla_unit_system:
    name: "Tesla Unit System"
    icon: mdi:ruler-square-compass
    # Three presets instead of a plain Metric/Imperial toggle, because
    # real-world "Imperial" usage isn't consistent: US drivers use
    # miles + °F + psi together, while UK/Ireland drivers commonly use
    # miles + mph but *still* keep °C and bar (this mirrors the actual
    # options on a Tesla vehicle's own touchscreen, which lets you set
    # distance/speed, temperature, and pressure independently).
    options:
      - "Metric (km, °C, bar)"
      - "US Imperial (mi, °F, psi)"
      - "UK (mi, °C, bar)"

  tesla_wheel_size:
    name: "Tesla Wheel Size"
    icon: mdi:tire
    # Drives two things automatically (see automation
    # tesla_wheel_size_auto_adjust in packages/tesla/automations.yaml):
    #  1. input_number.tesla_recommended_tire_pressure — cold pressure
    #     placard value.
    #  2. input_number.tesla_wheel_range_adjustment_pct — how much larger/
    #     heavier wheels typically reduce real-world range vs the smallest
    #     stock size.
    # Both auto-set values are only starting estimates for your selected
    # size (see comments on those two input_numbers below) — after
    # switching sizes here, double-check/edit those sliders against your
    # own driver's-door placard and real-world range experience.
    options:
      - '18"'
      - '19"'
      - '20"'
      - '21"'
      - '22"'

  # Hungarian residential electricity tariff (MVM Next etc.), see agents.md
  # Section 21. "Off" (first option, so the default on a fresh install) keeps
  # the flat input_number.tesla_default_electricity_cost rate everywhere.
  # Tariff A / Tariff D price home charging at the tariff active at the time
  # of charging. Prices are Hungarian forint, gross (fees + 27% VAT included).
  tesla_tariff_mode:
    name: "Tesla Electricity Tariff"
    icon: mdi:transmission-tower
    options:
      - "Off"
      - "Tariff A"
      - "Tariff D"

  # Full auto charging (agents.md Section 22): how your home charger is wired.
  # Used to turn charging amps into kW (amps x phases x 230 V). "3-phase" is
  # first, so it is the default on a fresh install.
  tesla_home_charger_phases:
    name: "Tesla Home Charger Phases"
    icon: mdi:sine-wave
    options:
      - "3-phase"
      - "1-phase"

input_number:
  tesla_odometer_monthly_baseline:
    name: "Tesla Odometer Monthly Baseline"
    min: 0
    max: 9999999
    step: 0.01
    mode: box
    unit_of_measurement: "km"
    icon: mdi:counter

  # Snapshot of "distance driven" taken right before the monthly baseline above
  # resets each 1st of the month (see automation tesla_odometer_monthly_baseline
  # in packages/tesla/automations.yaml) -- i.e. the just-completed calendar
  # month's total distance. Powers the History tab's "Previous Month" card.
  # No `initial:` on purpose (automation-managed state, see agents.md Section 11)
  # -- will read 0/blank until the first rollover after this was added.
  tesla_previous_month_distance:
    name: "Tesla Previous Month Distance"
    min: 0
    max: 9999999
    step: 0.01
    mode: box
    unit_of_measurement: "km"
    icon: mdi:map-marker-distance

  tesla_target_charge_limit:
    name: "Tesla Target Charge Limit"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-80

  tesla_default_electricity_cost:
    name: "Default Electricity Cost"
    # Unit intentionally has no hardcoded currency prefix (e.g. "Ft/kWh") —
    # input_number's unit_of_measurement is static YAML and can't follow
    # input_select.tesla_currency dynamically. Enter this value already in
    # whatever currency you picked there; the currency symbol itself is
    # shown dynamically elsewhere (Cost Projections, History, Analytics KPIs).
    unit_of_measurement: "/kWh"
    min: 0
    max: 200
    step: 0.5
    icon: mdi:cash
    mode: slider

  comparison_ice_efficiency:
    name: "ICE Fuel Efficiency (Comparison)"
    unit_of_measurement: "L/100km"
    min: 1
    max: 25
    step: 0.1
    icon: mdi:fuel
    mode: slider

  comparison_fuel_price_per_liter:
    name: "Fuel Price per Litre"
    # See note on tesla_default_electricity_cost above re: no hardcoded currency.
    unit_of_measurement: "/L"
    min: 0
    max: 2000
    step: 1
    icon: mdi:cash
    mode: slider

  tesla_battery_capacity_kwh:
    name: "Tesla Battery Capacity"
    unit_of_measurement: "kWh"
    min: 30
    max: 200
    step: 0.5
    icon: mdi:battery-high
    mode: box

  tesla_recommended_tire_pressure:
    name: "Tesla Recommended Cold Tire Pressure"
    # Tesla's Fleet API only reports each wheel's *live* pressure — it does
    # not expose the manufacturer-recommended cold pressure at all, and that
    # value isn't universal: it's set by Tesla per vehicle+wheel-size combo
    # (20"/21"/22" wheels all differ), printed on your driver's doorjamb
    # placard. Always stored here in bar (the placard's metric figure);
    # the Tires tab banner converts to psi for display when the unit system
    # selector is set to US Imperial.
    #
    # Auto-set whenever input_select.tesla_wheel_size changes (see
    # tesla_wheel_size_auto_adjust in packages/tesla/automations.yaml) using
    # commonly-cited Tesla community values per size — 2.9 bar / 42 psi for
    # 18"/19"/20"/22", 3.1 bar / 45 psi for 21" (larger/performance wheels
    # are sometimes rated slightly higher). These are starting estimates
    # only, not pulled from any Tesla API — always verify against your own
    # driver's door placard and edit this slider if it differs.
    unit_of_measurement: "bar"
    min: 1.5
    max: 3.8
    step: 0.05
    icon: mdi:gauge
    mode: box

  tesla_wheel_range_adjustment_pct:
    name: "Tesla Wheel Range Adjustment"
    # Larger/heavier wheels increase rolling resistance and aerodynamic
    # drag, reducing real-world range below the vehicle's official rated
    # range (which reflects your car's factory/EPA configuration, not
    # necessarily the wheels currently mounted). This is the % subtracted
    # from the official rated range to estimate a more realistic figure —
    # shown in brackets next to "official" range throughout both
    # dashboards (Overview header, Info Grid, Battery tab, Controls tab).
    #
    # Auto-set whenever input_select.tesla_wheel_size changes (see
    # tesla_wheel_size_auto_adjust in packages/tesla/automations.yaml) using
    # rough Tesla-community-sourced estimates: 0% (18", baseline/most
    # efficient), 3% (19"), 6% (20"), 10% (21"), 14% (22"). These are ROUGH
    # ESTIMATES, not measured for your specific vehicle — tune this slider
    # over time based on your own observed real-world range if it doesn't
    # match.
    unit_of_measurement: "%"
    min: 0
    max: 25
    step: 0.5
    icon: mdi:speedometer
    mode: box

  tesla_drive_start_battery_pct:
    name: "Tesla Drive Start Battery %"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 0.1
    mode: box
    icon: mdi:battery-clock

  tesla_drive_start_odometer:
    name: "Tesla Drive Start Odometer"
    unit_of_measurement: "km"
    min: 0
    max: 9999999
    step: 0.01
    mode: box
    icon: mdi:counter

  tesla_drive_energy_consumed_total_kwh:
    name: "Tesla Drive Energy Consumed Total"
    unit_of_measurement: "kWh"
    min: 0
    max: 999999
    step: 0.001
    mode: box
    icon: mdi:lightning-bolt

  # --- Saved Location Rates (used by the Analytics > Settings "Saved Location
  # Rates" card). Each location has a rate + a free-text schedule description.
  # Edit these values in the Settings tab or here directly.
  tesla_rate_home_per_kwh:
    name: "Home Rate"
    unit_of_measurement: "/kWh"
    min: 0
    max: 200
    step: 0.5
    icon: mdi:home-lightning-bolt
    mode: box

  tesla_rate_solar_per_kwh:
    name: "Solar / Off-Peak Rate"
    unit_of_measurement: "/kWh"
    min: 0
    max: 200
    step: 0.5
    icon: mdi:solar-power
    mode: box

  tesla_rate_work_per_kwh:
    name: "Work Rate"
    unit_of_measurement: "/kWh"
    min: 0
    max: 200
    step: 0.5
    icon: mdi:office-building
    mode: box

  # --- Hungarian tariffs (agents.md Section 21). No `initial:` on purpose
  # (Section 11), so on a fresh install both start at their minimum. ---
  # Your household's typical monthly grid use WITHOUT the car. Only used when
  # input_text.tesla_grid_import_entity is empty, to estimate how much of the
  # discounted monthly quota is used up (estimate = this, spread evenly over
  # the month, + this month's home charging energy).
  tesla_household_monthly_kwh:
    name: "Household Monthly Use (without car)"
    unit_of_measurement: "kWh"
    min: 0
    max: 3000
    step: 1
    icon: mdi:home-lightning-bolt-outline
    mode: box

  # --- Full auto charging (agents.md Section 22). No `initial:` (Section 11):
  # each one starts at its minimum on a fresh install, so set them once in
  # Analytics > Settings > Full Auto Charging. ---
  # Full auto charges whenever the price right now is at or below this, on
  # top of its normal plan (handy for negative Tariff D prices). Can be
  # negative. The minimum (-50, the fresh-install value) means "never".
  # (Was input_number.tesla_d_tariff_charge_threshold.)
  tesla_auto_charge_cheap_price:
    name: "Always Charge Below Price"
    unit_of_measurement: "/kWh"
    min: -50
    max: 200
    step: 0.5
    icon: mdi:cash-check
    mode: box

  # Below this battery level Full auto charges straight away at full power,
  # whatever the price. 0 = off.
  tesla_auto_charge_min_soc:
    name: "Always Charge Below Battery Level"
    unit_of_measurement: "%"
    min: 0
    max: 80
    step: 1
    icon: mdi:battery-alert-variant-outline
    mode: slider

  # The highest current your home charger / circuit allows, per phase.
  # Full auto charges at this, and only lowers it to follow solar surplus.
  tesla_home_charger_max_amps:
    name: "Home Charger Max Current"
    unit_of_measurement: "A"
    min: 5
    max: 32
    step: 1
    icon: mdi:current-ac
    mode: box

  # What your utility pays you for 1 kWh fed into the grid (Hungarian bruttó
  # billing: roughly 5 Ft/kWh). Charging from solar surplus "costs" this much,
  # because that energy would otherwise have been sold.
  tesla_solar_feed_in_price:
    name: "Solar Feed-in Price"
    unit_of_measurement: "/kWh"
    min: 0
    max: 200
    step: 0.5
    icon: mdi:solar-power-variant
    mode: box

input_text:
  # ⚠️ MOST IMPORTANT SETTING IN THIS FILE ⚠️
  # This must match the entity prefix your Tesla Fleet integration actually
  # uses for THIS vehicle (Developer Tools → States → filter "battery_level"
  # to find it, e.g. if you see sensor.tesla_battery_level set this to
  # "tesla"; if you see sensor.x_battery_level set this to "x"). Every
  # dashboard/automation/script in this project reads your car's real
  # entities dynamically through this one value via the "vehicle_*" Fleet
  # Sensor Alias layer below, so you can rename your vehicle at any time by
  # only changing this field — no YAML edits needed. Any value works
  # ("tesla", "x", "0", "42", ...) EXCEPT the literal word "vehicle" (that
  # collides with the alias layer itself — see automation
  # tesla_reserved_car_name_guard in packages/tesla/automations.yaml, which
  # warns you if this ever happens).
  tesla_car_name:
    name: "Tesla Car Name (entity prefix)"
    initial: "tesla"
    min: 1
    icon: mdi:car-electric

  tesla_model:
    name: "Tesla Model"
    initial: "Tesla Model X"
    icon: mdi:car-electric
  # NOTE: VIN is no longer read from here directly (see
  # sensor.tesla_vin_live above, which pulls the real VIN straight from the
  # Tesla Fleet integration's device registry) — this is now only a manual
  # fallback used if that live lookup ever fails. No `initial:` here
  # (unlike tesla_model/tesla_car_name above) so a manually-entered value
  # actually persists across config reloads/restarts instead of resetting
  # to the placeholder every time (see agents.md Section 11 for why
  # `initial:` causes that and why it was removed here specifically).
  tesla_vin:
    name: "Tesla VIN"
    icon: mdi:identifier
  # No `initial:` here either — Plate has no Fleet API equivalent to
  # auto-pull (Tesla doesn't expose license plates), so this is the only
  # source of truth; it must persist whatever you type, not reset on
  # every reload.
  tesla_plate:
    name: "Tesla Plate"
    icon: mdi:card-text

  # --- Saved Location Rates: names + schedule descriptions ---
  tesla_rate_home_name:
    name: "Home Location Name"
    icon: mdi:map-marker
  tesla_rate_home_hours:
    name: "Home Rate Hours"
    icon: mdi:clock-outline
  tesla_rate_home_days:
    name: "Home Rate Active Days"
    icon: mdi:calendar-week
  tesla_rate_home_season:
    name: "Home Rate Season"
    icon: mdi:calendar-range

  tesla_rate_solar_name:
    name: "Solar/Off-Peak Location Name"
    icon: mdi:map-marker
  tesla_rate_solar_hours:
    name: "Solar/Off-Peak Rate Hours"
    icon: mdi:clock-outline
  tesla_rate_solar_days:
    name: "Solar/Off-Peak Active Days"
    icon: mdi:calendar-week
  tesla_rate_solar_season:
    name: "Solar/Off-Peak Season"
    icon: mdi:calendar-range

  tesla_rate_work_name:
    name: "Work Location Name"
    icon: mdi:map-marker
  tesla_rate_work_hours:
    name: "Work Rate Hours"
    icon: mdi:clock-outline
  tesla_rate_work_days:
    name: "Work Rate Active Days"
    icon: mdi:calendar-week
  tesla_rate_work_season:
    name: "Work Rate Season"
    icon: mdi:calendar-range

  # Entity ID of your home's LIFETIME grid import energy sensor in kWh (e.g.
  # a smart meter / P1 reader / energy monitor "total consumption" sensor —
  # find it in Developer Tools > States). Leave empty to estimate instead (see
  # input_number.tesla_household_monthly_kwh). Read by
  # sensor.tesla_monthly_grid_import, so it can be changed here at any time.
  tesla_grid_import_entity:
    name: "Home Grid Import Sensor (entity ID)"
    icon: mdi:meter-electric

  # --- Full auto charging sensors (agents.md Section 22). Entity IDs, typed
  # in Analytics > Settings. All optional: leave empty if you have no solar.
  # Live grid power (W or kW), POSITIVE while importing from the grid and
  # negative while exporting, e.g. sensor.inverter_grid_power.
  tesla_grid_power_entity:
    name: "Home Grid Power Sensor (entity ID)"
    icon: mdi:transmission-tower-import
  # Live solar (PV) production power (W or kW), e.g. sensor.inverter_pv_power.
  # Compared with the forecast to correct the next few hours ("nowcast"), and
  # used for the surplus when the grid power sensor above is empty.
  tesla_pv_power_entity:
    name: "Solar Power Sensor (entity ID)"
    icon: mdi:solar-power
  # Forecast.Solar "Estimated power production - now" entity, e.g.
  # sensor.power_production_now. Its "energy production today remaining" and
  # "energy production tomorrow" siblings are found from this name.
  tesla_solar_forecast_entity:
    name: "Solar Forecast Sensor (entity ID)"
    icon: mdi:weather-partly-cloudy

input_boolean:
  tesla_enable_smart_charging:
    name: "Tesla Enable Smart Charging"
    icon: mdi:lightning-bolt

  # Hungarian discounted band ("rezsicsökkentett sáv"): the first ~207 kWh of
  # each month (2,523 kWh/year, counted per day) cost the discounted rate.
  # Turn on to apply it. No `initial:` (agents.md Section 11), so it starts
  # OFF on a fresh install: switch it on once in Analytics > Settings.
  tesla_use_discounted_quota:
    name: "Tesla Use Discounted Quota"
    icon: mdi:sale

  # Full auto charging (agents.md Section 22): the master switch. While on,
  # sensor.tesla_auto_charge_plan decides when the car charges at home, and
  # the fixed Smart Charging window automations step aside.
  tesla_full_auto_charging:
    name: "Tesla Full Auto Charging"
    icon: mdi:robot-outline

  # "Charge now": set by script.tesla_charge_now, cleared automatically when
  # the cable is unplugged. Full auto then charges straight away up to the
  # car's own charge limit, whatever the price.
  tesla_charge_now_override:
    name: "Tesla Charge Now Override"
    icon: mdi:flash-alert

  # "Paused": set by script.tesla_charge_stop_manual (the dashboard's Stop
  # charging button) while Full auto is on, so Full auto doesn't start
  # charging again by itself. Cleared on unplug, by "Charge now", or by
  # turning Full auto off.
  tesla_auto_charge_paused:
    name: "Tesla Full Auto Paused"
    icon: mdi:pause-circle-outline

  # On while Full auto is managing the current charging session (it started
  # it, or adopted the car's own plug-in auto-start). Full auto only ever
  # stops sessions it owns, never a charge you started by hand later.
  # Automation-managed; not meant to be toggled manually.
  # (Was input_boolean.tesla_tariff_d_charging.)
  tesla_auto_charge_owned:
    name: "Tesla Auto Charge Session Owned"
    icon: mdi:robot

input_datetime:
  tesla_next_departure:
    name: "Tesla Next Departure"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

  # --- Smart Charging window (used by tesla_smart_charge_start/stop) ---
  # Charging is switched on/off AT MOST ONCE per day, at these two fixed
  # clock times — never polled/re-evaluated on a tight loop — specifically
  # to avoid frequent on/off cycling, which is harder on the charging
  # contactor/relay hardware and provides no real efficiency benefit over
  # a single continuous overnight session. Supports overnight wrap (e.g.
  # start 23:00, end 06:00). Defaults to a typical off-peak overnight window;
  # change these to match your actual cheap-rate hours (see Saved Location
  # Rates in the Analytics > Settings tab).
  tesla_smart_charge_window_start:
    name: "Smart Charging Window Start"
    has_date: false
    has_time: true
    icon: mdi:clock-start
  tesla_smart_charge_window_end:
    name: "Smart Charging Window End"
    has_date: false
    has_time: true
    icon: mdi:clock-end

  # --- Full auto charging (agents.md Section 22) ---
  # The car should be charged to the Target Charge Limit by this time every
  # day (an earlier Next Departure above wins). No `initial:`: it starts at
  # 00:00 on a fresh install, so set it once (e.g. 07:00).
  tesla_charge_ready_by:
    name: "Tesla Charge Ready By"
    has_date: false
    has_time: true
    icon: mdi:clock-check-outline

  # When Full auto last started or stopped charging. Keeps at least 30 min
  # between its own switches, so charging can never flap.
  # Automation-managed; no `initial:`. (Was tesla_tariff_d_last_switch.)
  tesla_auto_charge_last_switch:
    name: "Tesla Auto Charge Last Switch"
    has_date: true
    has_time: true
    icon: mdi:timer-sync-outline

  # End of the charging block Full auto committed to when it started
  # charging. It keeps charging until then, even if a later price update
  # would now pick a slightly different block. Automation-managed.
  tesla_auto_charge_block_end:
    name: "Tesla Auto Charge Block End"
    has_date: true
    has_time: true
    icon: mdi:timer-check-outline

template:
  # ===== FLEET SENSOR ALIASES ("vehicle_" namespace) =====
  # These read dynamically from input_text.tesla_car_name, so the rest of the
  # project (dashboards, cost/efficiency sensors, automations) can always use
  # a stable sensor.vehicle_* / binary_sensor.vehicle_* name no matter what
  # your actual vehicle's Tesla Fleet integration prefix is (tesla, x, 0, 42,
  # daddy_taxi, anything).
  #
  # IMPORTANT — why "vehicle_" and not "tesla_":
  # These aliases must have an entity_id that can NEVER equal the raw
  # integration entity_id they read from, no matter what input_text.tesla_car_name
  # is set to. If the alias were named e.g. "tesla_odometer" and the vehicle's
  # real prefix was also "tesla", the alias would try to read its own state
  # (sensor.vehicle_odometer -> sensor.vehicle_odometer) and get stuck on
  # "unknown" forever — this happened in this project and is why the prefix
  # was changed to "vehicle_" here. As long as you never name your vehicle's
  # HA device/prefix literally "vehicle", this can't recur. (A startup check
  # in automations.yaml warns you with a persistent_notification if you do.)
  - sensor:
      - name: "Vehicle Odometer"
        unique_id: vehicle_odometer_alias_v1
        # `none` here is intentional, not a typo: rendering the literal Jinja
        # `none` is auto-parsed back into Python None by HA's template engine
        # (single-expression templates), which correctly puts the entity into
        # the "unknown" state. Without this guard, whenever the underlying
        # Fleet sensor is unavailable/unknown (car asleep), the raw string
        # "unknown" gets validated as this sensor's numeric state and fails
        # with "Received invalid sensor state: unknown, expected a number" in
        # the log — see agents.md Section 12 for the full writeup.
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_odometer') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "km"
        device_class: distance
        state_class: total_increasing
        icon: mdi:counter

      - name: "Vehicle Charge Energy Added"
        unique_id: vehicle_charge_energy_added_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_charge_energy_added') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:ev-station

      - name: "Vehicle Battery Level"
        unique_id: vehicle_battery_level_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_usable_battery_level') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery

      - name: "Vehicle Battery Range"
        unique_id: vehicle_battery_range_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_estimate_battery_range') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "km"
        icon: mdi:map-marker-distance

      - name: "Vehicle Ideal Battery Range"
        unique_id: vehicle_ideal_battery_range_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_ideal_battery_range') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "km"
        icon: mdi:map-marker-distance

      - name: "Vehicle Charge Rate"
        unique_id: vehicle_charge_rate_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_charge_rate') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "km/h"
        icon: mdi:speedometer

      - name: "Vehicle Charger Current"
        unique_id: vehicle_charger_current_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_charger_current') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "A"
        device_class: current
        icon: mdi:sine-wave

      - name: "Vehicle Charger Power"
        unique_id: vehicle_charger_power_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_charger_power') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:flash

      - name: "Vehicle Charger Voltage"
        unique_id: vehicle_charger_voltage_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_charger_voltage') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "V"
        device_class: voltage
        icon: mdi:flash

      - name: "Vehicle Charging"
        unique_id: vehicle_charging_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ states('sensor.' + car + '_charging') }}
        icon: mdi:ev-station

      - name: "Vehicle Inside Temperature"
        unique_id: vehicle_inside_temperature_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_inside_temperature') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer

      - name: "Vehicle Outside Temperature"
        unique_id: vehicle_outside_temperature_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_outside_temperature') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer

      - name: "Vehicle Shift State"
        unique_id: vehicle_shift_state_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ states('sensor.' + car + '_shift_state') }}
        icon: mdi:car-shift-pattern

      - name: "Vehicle Speed"
        unique_id: vehicle_speed_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_speed') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "km/h"
        state_class: measurement
        icon: mdi:speedometer

      - name: "Vehicle Time To Full Charge"
        unique_id: vehicle_time_to_full_charge_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ states('sensor.' + car + '_time_to_full_charge') }}
        icon: mdi:battery-clock

      - name: "Vehicle Tyre Pressure Front Left"
        unique_id: vehicle_tyre_pressure_fl_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_tyre_pressure_front_left') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        icon: mdi:tire

      - name: "Vehicle Tyre Pressure Front Right"
        unique_id: vehicle_tyre_pressure_fr_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_tyre_pressure_front_right') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        icon: mdi:tire

      - name: "Vehicle Tyre Pressure Rear Left"
        unique_id: vehicle_tyre_pressure_rl_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_tyre_pressure_rear_left') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        icon: mdi:tire

      - name: "Vehicle Tyre Pressure Rear Right"
        unique_id: vehicle_tyre_pressure_rr_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('sensor.' + car + '_tyre_pressure_rear_right') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        icon: mdi:tire

  - binary_sensor:
      - name: "Vehicle Tyre Pressure Warning Front Left"
        unique_id: vehicle_tyre_pressure_warning_fl_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_tyre_pressure_warning_front_left', 'on') }}
        device_class: problem
        icon: mdi:tire-alert

      - name: "Vehicle Tyre Pressure Warning Front Right"
        unique_id: vehicle_tyre_pressure_warning_fr_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_tyre_pressure_warning_front_right', 'on') }}
        device_class: problem
        icon: mdi:tire-alert

      - name: "Vehicle Tyre Pressure Warning Rear Left"
        unique_id: vehicle_tyre_pressure_warning_rl_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_tyre_pressure_warning_rear_left', 'on') }}
        device_class: problem
        icon: mdi:tire-alert

      - name: "Vehicle Tyre Pressure Warning Rear Right"
        unique_id: vehicle_tyre_pressure_warning_rr_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_tyre_pressure_warning_rear_right', 'on') }}
        device_class: problem
        icon: mdi:tire-alert

      - name: "Vehicle Status"
        unique_id: vehicle_status_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_status', 'on') }}
        icon: mdi:car-connected

      - name: "Vehicle Charge Cable"
        unique_id: vehicle_charge_cable_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_charge_cable', 'on') }}
        device_class: plug
        icon: mdi:power-plug

      - name: "Vehicle Any Window Open"
        unique_id: vehicle_any_window_open_alias_v1
        # Aggregates all 4 window binary_sensors into one alias, so automations
        # (e.g. "close windows before rain") can trigger on a single vehicle-
        # name-agnostic entity instead of hardcoding 4 real Fleet entity_ids.
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ is_state('binary_sensor.' + car + '_front_driver_window', 'on') or
             is_state('binary_sensor.' + car + '_rear_driver_window', 'on') or
             is_state('binary_sensor.' + car + '_front_passenger_window', 'on') or
             is_state('binary_sensor.' + car + '_rear_passenger_window', 'on') }}
        device_class: opening
        icon: mdi:window-open-variant

  # ===== FLEET CONTROL ALIASES (writable) =====
  # Like the sensor/binary_sensor aliases above, but for controls the
  # dashboard needs to both READ and WRITE (select an option / set a value).
  # Standard Lovelace cards (mushroom-number-card, custom:button-card's
  # `entity:` key) can't template their `entity:` field with Jinja/JS, so
  # without these proxies the Charge Limit slider and Steering Wheel Heater
  # button would have to hardcode a real entity_id like number.tesla_charge_limit
  # — breaking as soon as the vehicle isn't literally named "tesla". These
  # template controls forward reads AND writes to the real dynamic entity.
  - select:
      - name: "Vehicle Steering Wheel Heater"
        unique_id: vehicle_steering_wheel_heater_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ states('select.' + car + '_steering_wheel_heater') }}
        options: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('select.' + car + '_steering_wheel_heater', 'options') or [] }}
        select_option:
          - action: select.select_option
            target:
              entity_id: >
                {% set car = states('input_text.tesla_car_name') %}
                select.{{ car }}_steering_wheel_heater
            data:
              option: "{{ option }}"
        icon: mdi:steering

  - number:
      - name: "Vehicle Charge Limit"
        unique_id: vehicle_charge_limit_alias_v1
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('number.' + car + '_charge_limit') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        min: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_limit', 'min') | default(50, true) }}
        max: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_limit', 'max') | default(100, true) }}
        step: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_limit', 'step') | default(1, true) }}
        unit_of_measurement: "%"
        set_value:
          - action: number.set_value
            target:
              entity_id: >
                {% set car = states('input_text.tesla_car_name') %}
                number.{{ car }}_charge_limit
            data:
              value: "{{ value }}"
        icon: mdi:battery-charging-100

      - name: "Vehicle Charge Current"
        unique_id: vehicle_charge_current_alias_v1
        # Max amperage the vehicle is allowed to draw (the "16" in "5/16 A").
        # Read here so the Charging Status card's Row 2 metrics line can show
        # it without hardcoding a real entity_id.
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set val = states('number.' + car + '_charge_current') %}
          {{ val if val not in ['unknown', 'unavailable', ''] else none }}
        min: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_current', 'min') | default(0, true) }}
        max: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_current', 'max') | default(32, true) }}
        step: >
          {% set car = states('input_text.tesla_car_name') %}
          {{ state_attr('number.' + car + '_charge_current', 'step') | default(1, true) }}
        unit_of_measurement: "A"
        set_value:
          - action: number.set_value
            target:
              entity_id: >
                {% set car = states('input_text.tesla_car_name') %}
                number.{{ car }}_charge_current
            data:
              value: "{{ value }}"
        icon: mdi:sine-wave

  # ===== CUSTOM SENSORS =====
  # These build on the sensor.vehicle_* / binary_sensor.vehicle_* aliases above
  # (not directly on the raw Fleet integration entities), so they work no
  # matter what your vehicle's real entity prefix is.
  - binary_sensor:
      - name: "Tesla Driving Active"
        unique_id: tesla_driving_active_v1
        icon: mdi:car
        state: >
          {% set shift = states('sensor.vehicle_shift_state') | upper %}
          {% set speed = states('sensor.vehicle_speed') | float(0) %}
          {{ shift in ['D', 'R', 'N'] or (shift in ['UNKNOWN', 'UNAVAILABLE', 'NONE', ''] and speed > 1) }}

      - name: "Tesla Charging Active"
        unique_id: tesla_charging_active_v1
        icon: mdi:ev-station
        state: >
          {{ states('sensor.vehicle_charging') | lower in ['charging', 'preconditioning'] }}

      - name: "Tesla Anomaly No Charge 3d"
        unique_id: tesla_anomaly_no_charge_3d_v1
        icon: mdi:alert-outline
        state: >
          {% set charge_h = states('sensor.tesla_charging_time_3d_raw') | float(0) %}
          {% set dist_7d = states('sensor.tesla_weekly_distance') | float(0) %}
          {{ charge_h < 0.1 and dist_7d > 30 }}

      - name: "Tesla Anomaly High Daily Cost"
        unique_id: tesla_anomaly_high_daily_cost_v1
        icon: mdi:cash-alert
        state: >
          {% set daily_cost = states('sensor.tesla_daily_electric_cost') | float(0) %}
          {% set weekly_energy = states('sensor.tesla_weekly_charging_energy') | float(0) %}
          {% set weekly_avg = (weekly_energy * 60) / 7 %}
          {{ daily_cost > (weekly_avg * 1.8) and daily_cost > 800 }}

  - sensor:
      # === Vehicle Identity (auto-pulled from Tesla Fleet) ===
      # The Tesla Fleet integration's own __init__.py builds each vehicle's
      # HA device registry entry with `serial_number=vin` and
      # `model=api_vehicle.model` (confirmed against HA core source) — so
      # the real VIN and model name are already sitting in HA's device
      # registry, just not exposed as an entity attribute anywhere. Read
      # them via the `device_attr()` Jinja function (needs a device_id,
      # which `device_id()` resolves from any entity belonging to that
      # device — sensor.<car>_battery_level is used here as a stable
      # anchor entity). Falls back to the manually-entered
      # input_text.tesla_vin if the Fleet device lookup ever comes back
      # empty (e.g. integration not yet set up), so the footer never goes
      # fully blank.
      - name: "Tesla Vin Live"
        unique_id: tesla_vin_live_v1
        icon: mdi:identifier
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set dev = device_id('sensor.' + car + '_battery_level') %}
          {% set vin = device_attr(dev, 'serial_number') if dev else none %}
          {% set fallback = states('input_text.tesla_vin') %}
          {{ vin if vin not in [none, 'unknown', 'unavailable', ''] else (fallback if fallback not in ['unknown', 'unavailable', ''] else 'Unknown') }}

      # === Currency ===
      - name: "Tesla Currency Symbol"
        unique_id: tesla_currency_symbol_v1
        icon: mdi:currency-usd
        state: >
          {% set c = states('input_select.tesla_currency') %}
          {% set symbols = {'HUF': 'Ft', 'EUR': '€', 'USD': '$', 'GBP': '£'} %}
          {{ symbols.get(c, 'Ft') }}

      - name: "Tesla Currency Locale"
        unique_id: tesla_currency_locale_v1
        icon: mdi:earth
        state: >
          {% set c = states('input_select.tesla_currency') %}
          {% set locales = {'HUF': 'hu-HU', 'EUR': 'de-DE', 'USD': 'en-US', 'GBP': 'en-GB'} %}
          {{ locales.get(c, 'hu-HU') }}

      # === Unit System ===
      # Label-only sensors (no math) so dashboard cards/scripts have one
      # place to read the current unit strings from. The actual km->mi /
      # bar->psi / °C->°F math is done inline in each dashboard card (JS in
      # button-card, Jinja in markdown, transform: in apexcharts-card),
      # reading input_select.tesla_unit_system directly — see agents.md
      # Section 8 for the exact conversion constants and the full list of
      # cards this has been wired into (and the known chart-tab limitation).
      - name: "Tesla Unit Distance"
        unique_id: tesla_unit_distance_v1
        icon: mdi:map-marker-distance
        state: >
          {{ 'mi' if states('input_select.tesla_unit_system') != 'Metric (km, °C, bar)' else 'km' }}

      - name: "Tesla Unit Speed"
        unique_id: tesla_unit_speed_v1
        icon: mdi:speedometer
        state: >
          {{ 'mph' if states('input_select.tesla_unit_system') != 'Metric (km, °C, bar)' else 'km/h' }}

      - name: "Tesla Unit Pressure"
        unique_id: tesla_unit_pressure_v1
        icon: mdi:gauge
        state: >
          {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'bar' }}

      - name: "Tesla Unit Temperature"
        unique_id: tesla_unit_temperature_v1
        icon: mdi:thermometer
        state: >
          {{ '°F' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else '°C' }}

      # === Real Drive Energy Consumption (from actual battery drop while driving) ===
      # Populated by automations tesla_drive_energy_session_start / _end in automations.yaml.
      - name: "Tesla Drive Energy Consumed Total"
        unique_id: tesla_drive_energy_consumed_total_v1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt
        state: >
          {{ states('input_number.tesla_drive_energy_consumed_total_kwh') | float(0) | round(3) }}

      # === Vehicle Stats ===
      - name: "Tesla Tires Status"
        unique_id: tesla_tires_status_v4
        icon: mdi:tire
        state: >
          {% set warning_entities = [
            'binary_sensor.vehicle_tyre_pressure_warning_front_left',
            'binary_sensor.vehicle_tyre_pressure_warning_front_right',
            'binary_sensor.vehicle_tyre_pressure_warning_rear_left',
            'binary_sensor.vehicle_tyre_pressure_warning_rear_right'
          ] %}
          {% set active_warnings = warning_entities | select('is_state', 'on') | list | count %}
          {% if active_warnings > 0 %}
            Check Tires
          {% else %}
            Optimal
          {% endif %}

      # === Efficiency ===
      # Real rolling efficiency computed from actual logged drive-energy consumption
      # (battery % drop x pack capacity) over actual distance driven in the last 7 days.
      # Falls back to a 0.228 kWh/km baseline estimate until enough real driving data
      # has accumulated (needs > 5km driven in the last 7 days).
      - name: "Tesla Efficiency kWh/km"
        unique_id: tesla_efficiency_kwh_per_km_v5
        unit_of_measurement: "kWh/km"
        icon: mdi:car-electric
        state: >
          {% set dist_7d = states('sensor.tesla_weekly_distance') | float(0) %}
          {% set energy_7d = states('sensor.tesla_weekly_drive_energy') | float(0) %}
          {% if dist_7d > 5 and energy_7d > 0 %}
            {{ (energy_7d / dist_7d) | round(3) }}
          {% else %}
            0.228
          {% endif %}

      - name: "Tesla Efficiency Wh Per Km"
        unique_id: tesla_efficiency_wh_per_km_v5
        unit_of_measurement: "Wh/km"
        icon: mdi:car-electric
        state: >
          {{ (states('sensor.tesla_efficiency_kwh_km') | float(0.228) * 1000) | round(0) }}

      # === Distance ===
      - name: "Tesla Daily Distance"
        unique_id: tesla_daily_distance_v4
        unit_of_measurement: "km"
        icon: mdi:map-marker-distance
        state: >
          {{ states('sensor.tesla_daily_distance_raw') | float(0) | round(2) }}

      - name: "Tesla Weekly Distance"
        unique_id: tesla_weekly_distance_v1
        unit_of_measurement: "km"
        state_class: measurement
        icon: mdi:map-marker-distance
        state: >
          {{ states('sensor.tesla_weekly_distance_raw') | float(0) | round(2) }}

      - name: "Tesla Monthly Distance"
        unique_id: tesla_monthly_distance_v4
        unit_of_measurement: "km"
        state_class: measurement
        icon: mdi:map-marker-distance
        state: >
          {% set odom_raw = states('sensor.vehicle_odometer') %}
          {% set base_raw = states('input_number.tesla_odometer_monthly_baseline') %}
          {% if odom_raw in ['unknown', 'unavailable', 'none'] or base_raw in ['unknown', 'unavailable', 'none'] %}
            {% set prev = this.state | float(0) %}
            {{ prev | round(2) }}
          {% else %}
            {% set odom = odom_raw | float(0) %}
            {% set base = base_raw | float(0) %}
            {{ ((odom - base) if odom >= base else 0) | round(2) }}
          {% endif %}

      # === Daily Tracking ===
      - name: "Tesla Daily Energy Consumed"
        unique_id: tesla_daily_energy_consumed_v5
        unit_of_measurement: "kWh"
        icon: mdi:flash
        state: >
          {% set real = states('sensor.tesla_daily_drive_energy') | float(0) %}
          {% if real > 0 %}
            {{ real | round(2) }}
          {% else %}
            {% set dist_km = states('sensor.tesla_daily_distance') | float(0) %}
            {% set eff = states('sensor.tesla_efficiency_kwh_km') | float(0.228) %}
            {{ (dist_km * eff) | round(2) }}
          {% endif %}

      - name: "Tesla Daily Electric Cost"
        unique_id: tesla_daily_electric_cost_v5
        # unit_of_measurement can NEVER be a live Jinja template in Home
        # Assistant (it's validated as a plain cv.string, unlike state/icon/
        # name which are cv.template) - a template here would render as
        # literal unrendered text on every dashboard card. Hardcoded to
        # match the currently selected input_select.tesla_currency (HUF).
        # If you change your currency, update this string too (and the
        # other 9 "Ft" unit_of_measurement values in this file).
        unit_of_measurement: "Ft"
        icon: mdi:cash
        # Tariff A/D: real cost accumulated at the price active while
        # charging (agents.md Section 21). Off: flat default rate.
        state: >
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {{ states('sensor.tesla_daily_tariff_charging_cost') | float(0) | round(0) }}
          {% else %}
            {% set energy = states('sensor.tesla_daily_charging_energy') | float(0) %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
            {{ (energy * rate) | round(0) }}
          {% endif %}

      # === Monthly + Projections ===
      - name: "Tesla Monthly Electric Cost"
        unique_id: tesla_monthly_electric_cost_v5
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {{ states('sensor.tesla_monthly_tariff_charging_cost') | float(0) | round(0) }}
          {% else %}
            {% set monthly_energy = states('sensor.tesla_monthly_charging_energy') | float(0) %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
            {{ (monthly_energy * rate) | round(0) }}
          {% endif %}

      - name: "Tesla Weekly Electric Cost"
        unique_id: tesla_weekly_electric_cost_v2
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {{ states('sensor.tesla_weekly_tariff_charging_cost') | float(0) | round(0) }}
          {% else %}
            {% set weekly_energy = states('sensor.tesla_weekly_charging_energy') | float(0) %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
            {{ (weekly_energy * rate) | round(0) }}
          {% endif %}

      - name: "Tesla Electric Cost 7d Rolling"
        unique_id: tesla_electric_cost_7d_rolling_v1
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {{ states('sensor.tesla_tariff_charging_cost_7d_rolling') | float(0) | round(0) }}
          {% else %}
            {% set energy = states('sensor.tesla_charging_energy_7d_rolling') | float(0) %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
            {{ (energy * rate) | round(0) }}
          {% endif %}

      # Previous calendar month's charging energy, read straight off the
      # tesla_monthly_charging_energy utility_meter's own auto-maintained
      # "last_period" attribute (populated by HA every time the monthly cycle
      # rolls over) -- no extra automation logic needed, unlike distance below.
      - name: "Tesla Previous Month Charging Energy"
        unique_id: tesla_previous_month_charging_energy_v1
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:ev-station
        state: >
          {{ state_attr('sensor.tesla_monthly_charging_energy', 'last_period') | float(0) | round(2) }}

      - name: "Tesla Previous Month Electric Cost"
        unique_id: tesla_previous_month_electric_cost_v1
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {{ state_attr('sensor.tesla_monthly_tariff_charging_cost', 'last_period') | float(0) | round(0) }}
          {% else %}
            {% set energy = states('sensor.tesla_previous_month_charging_energy') | float(0) %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
            {{ (energy * rate) | round(0) }}
          {% endif %}

      - name: "Tesla Annual Electric Cost"
        unique_id: tesla_annual_electric_cost_v5
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% set monthly = states('sensor.tesla_monthly_electric_cost') | float(0) %}
          {{ (monthly * 12) | round(0) }}

      - name: "Tesla 5 Year Electric Cost"
        unique_id: tesla_5year_electric_cost_v5
        # ⚠️ Real entity_id is sensor.tesla_5_year_electric_cost (with an
        # underscore between "5" and "year") -- HA auto-slugifies the
        # entity_id from the space in "5 Year" above, NOT from unique_id.
        # Any dashboard/template that reads this sensor must use that exact
        # entity_id, not "tesla_5year_electric_cost" (no underscore) -- see
        # agents.md Section 13 for the full story of this bug.
        unit_of_measurement: "Ft"
        icon: mdi:cash-multiple
        state: >
          {% set annual = states('sensor.tesla_annual_electric_cost') | float(0) %}
          {{ (annual * 5) | round(0) }}

      # === Equivalent Fuel Cost ===
      - name: "Tesla Fuel Cost per km"
        unique_id: tesla_fuel_cost_per_km_v5
        unit_of_measurement: "Ft/km"
        icon: mdi:gas-station
        state: >
          {% set eff = states('input_number.comparison_ice_efficiency') | float(6.5) %}
          {% set price = states('input_number.comparison_fuel_price_per_liter') | float(595) %}
          {{ (eff / 100 * price) | round(2) }}

      - name: "Tesla Daily Fuel Cost Equivalent"
        unique_id: tesla_daily_fuel_cost_equivalent_v5
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set dist = states('sensor.tesla_daily_distance') | float(0) %}
          {% set fuel_per_km = states('sensor.tesla_fuel_cost_per_km') | float(0) %}
          {{ (dist * fuel_per_km) | round(0) }}

      - name: "Tesla Monthly Fuel Cost"
        unique_id: tesla_monthly_fuel_cost_v6
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set dist = states('sensor.tesla_monthly_distance') | float(0) %}
          {% set fuel_per_km = states('sensor.tesla_fuel_cost_per_km') | float(0) %}
          {{ (dist * fuel_per_km) | round(0) }}

      - name: "Tesla Weekly Fuel Cost Equivalent"
        unique_id: tesla_weekly_fuel_cost_v2
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set dist = states('sensor.tesla_weekly_distance') | float(0) %}
          {% set fuel_per_km = states('sensor.tesla_fuel_cost_per_km') | float(0) %}
          {{ (dist * fuel_per_km) | round(0) }}

      - name: "Tesla Fuel Cost 7d Rolling Equivalent"
        unique_id: tesla_fuel_cost_7d_rolling_v1
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set dist = states('sensor.tesla_distance_7d_rolling') | float(0) %}
          {% set fuel_per_km = states('sensor.tesla_fuel_cost_per_km') | float(0) %}
          {{ (dist * fuel_per_km) | round(0) }}

      # Wraps input_number.tesla_previous_month_distance (populated by the
      # tesla_odometer_monthly_baseline automation right before it resets the
      # baseline each month) for naming consistency with its monthly/weekly
      # siblings above.
      - name: "Tesla Previous Month Distance"
        unique_id: tesla_previous_month_distance_v1
        unit_of_measurement: "km"
        state_class: measurement
        icon: mdi:map-marker-distance
        state: >
          {{ states('input_number.tesla_previous_month_distance') | float(0) | round(2) }}

      - name: "Tesla Previous Month Fuel Cost"
        unique_id: tesla_previous_month_fuel_cost_v1
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set dist = states('sensor.tesla_previous_month_distance') | float(0) %}
          {% set fuel_per_km = states('sensor.tesla_fuel_cost_per_km') | float(0) %}
          {{ (dist * fuel_per_km) | round(0) }}

      - name: "Tesla Annual Fuel Cost Equivalent"
        unique_id: tesla_annual_fuel_cost_equivalent_v1
        # Same projection approach as Tesla Annual Electric Cost above
        # (monthly * 12) -- used for the Cost Projections tab's Savings row.
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set monthly = states('sensor.tesla_monthly_fuel_cost') | float(0) %}
          {{ (monthly * 12) | round(0) }}

      - name: "Tesla 5 Year Fuel Cost Equivalent"
        unique_id: tesla_5year_fuel_cost_equivalent_v1
        # ⚠️ Same entity_id slugification gotcha as Tesla 5 Year Electric
        # Cost (Section 13 in agents.md): the real entity_id will be
        # sensor.tesla_5_year_fuel_cost_equivalent (underscore between "5"
        # and "year", from the space in the name above) -- reference it
        # with that exact entity_id, not "tesla_5year_...".
        unit_of_measurement: "Ft"
        icon: mdi:gas-station
        state: >
          {% set annual = states('sensor.tesla_annual_fuel_cost_equivalent') | float(0) %}
          {{ (annual * 5) | round(0) }}

      - name: "Tesla Monthly Energy Consumed"
        unique_id: tesla_monthly_energy_consumed_v5
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:flash
        state: >
          {% set real = states('sensor.tesla_monthly_drive_energy') | float(0) %}
          {% if real > 0 %}
            {{ real | round(2) }}
          {% else %}
            {% set dist_km = states('sensor.tesla_monthly_distance') | float(0) %}
            {% set eff = states('sensor.tesla_efficiency_kwh_km') | float(0.228) %}
            {{ (dist_km * eff) | round(2) }}
          {% endif %}

      - name: "Tesla Electric Cost Per KM"
        unique_id: tesla_electric_cost_per_km_v5
        unit_of_measurement: "Ft/km"
        icon: mdi:cash
        # Tariff A/D: this month's average charging price (accumulated cost /
        # charged kWh), or the current active price early in the month.
        state: >
          {% set eff = states('sensor.tesla_efficiency_kwh_km') | float(0) %}
          {% if states('input_select.tesla_tariff_mode') in ['Tariff A', 'Tariff D'] %}
            {% set e = states('sensor.tesla_monthly_charging_energy') | float(0) %}
            {% set c = states('sensor.tesla_monthly_tariff_charging_cost') | float(0) %}
            {% set rate = (c / e) if e >= 5 else states('sensor.tesla_active_charging_price') | float(60) %}
          {% else %}
            {% set rate = states('input_number.tesla_default_electricity_cost') | float(60) %}
          {% endif %}
          {{ (eff * rate) | round(2) }}

      # === Activity Time Tracking ===
      - name: "Tesla Driving Time Today"
        unique_id: tesla_driving_time_today_v1
        unit_of_measurement: "min"
        icon: mdi:car
        state: >
          {% set hours = states('sensor.tesla_driving_time_today_raw') | float(0) %}
          {{ (hours * 60) | round(0) }}

      - name: "Tesla Driving Time 7d"
        unique_id: tesla_driving_time_7d_v1
        unit_of_measurement: "min"
        icon: mdi:car-clock
        state: >
          {% set hours = states('sensor.tesla_driving_time_7d_raw') | float(0) %}
          {{ (hours * 60) | round(0) }}

      # Deliberately NOT device_class: duration (unlike its _raw source,
      # sensor.tesla_driving_time_30d_raw) -- the Analytics "Duration" chart
      # (dashboards/tesla-analytics.yaml) fed directly off the _raw entity for
      # years and always showed "N/A"/no data, while every other chart in that
      # dashboard (built on plain unitless/minute-based sensors like this one)
      # worked fine. history_stats' "type: time" sensors get device_class:
      # duration + native unit "h" assigned automatically by the platform,
      # which apexcharts-card's raw-history fetch appears unable to parse
      # reliably for this integration/HA version combination. Kept as a
      # plain numeric "min" sensor -- identical shape to Today/7d above --
      # to sidestep that entirely rather than debug it further blind.
      - name: "Tesla Driving Time 30d"
        unique_id: tesla_driving_time_30d_v1
        unit_of_measurement: "min"
        icon: mdi:car-clock
        state: >
          {% set hours = states('sensor.tesla_driving_time_30d_raw') | float(0) %}
          {{ (hours * 60) | round(0) }}

      - name: "Tesla Charging Time Today"
        unique_id: tesla_charging_time_today_v1
        unit_of_measurement: "min"
        icon: mdi:ev-station
        state: >
          {% set hours = states('sensor.tesla_charging_time_today_raw') | float(0) %}
          {{ (hours * 60) | round(0) }}

      - name: "Tesla Charging Time 7d"
        unique_id: tesla_charging_time_7d_v1
        unit_of_measurement: "min"
        icon: mdi:ev-station
        state: >
          {% set hours = states('sensor.tesla_charging_time_7d_raw') | float(0) %}
          {{ (hours * 60) | round(0) }}

      - name: "Tesla Distance per Drive Session Today"
        unique_id: tesla_distance_per_drive_session_today_v1
        unit_of_measurement: "km/session"
        icon: mdi:road-variant
        state: >
          {% set dist = states('sensor.tesla_daily_distance') | float(0) %}
          {% set sessions = states('sensor.tesla_drive_sessions_today') | float(0) | round(0) | int(0) %}
          {{ (dist / sessions) | round(2) if sessions > 0 else 0 }}

      - name: "Tesla Energy per Charge Session Today"
        unique_id: tesla_energy_per_charge_session_today_v1
        unit_of_measurement: "kWh/session"
        icon: mdi:ev-station
        state: >
          {% set energy = states('sensor.tesla_daily_charging_energy') | float(0) %}
          {% set sessions = states('sensor.tesla_charge_sessions_today') | float(0) %}
          {{ (energy / sessions) | round(2) if sessions > 0 else 0 }}

      # === Analytics ===
      - name: "Tesla Monthly Driving Duration"
        unique_id: tesla_monthly_driving_duration_v1
        icon: mdi:timer-outline
        state: >
          {% set h = states('sensor.tesla_driving_time_30d_raw') | float(0) %}
          {% set days = (h / 24) | int %}
          {% set hrs = (h % 24) | int %}
          {% if days > 0 %}{{ days }}d {{ hrs }}h{% else %}{{ hrs }}h{% endif %}

      - name: "Tesla Daily Efficiency Wh Per Km"
        unique_id: tesla_daily_efficiency_wh_per_km_v1
        unit_of_measurement: "Wh/km"
        state_class: measurement
        icon: mdi:leaf
        state: >
          {% set dist = states('sensor.tesla_daily_distance') | float(0) %}
          {% set energy = states('sensor.tesla_daily_energy_consumed') | float(0) %}
          {% if dist > 0.5 %}
            {{ (energy * 1000 / dist) | round(0) }}
          {% else %}
            {{ states('sensor.tesla_efficiency_wh_per_km') | float(228) | round(0) }}
          {% endif %}

  # ===== HUNGARIAN TARIFFS (Tariff A / Tariff D) — agents.md Section 21 =====
  # Prices are gross Ft/kWh (energy + grid fees + 27% VAT). The discounted
  # band rate (36.21) and the above-band A rate fallback (70.10) live ONLY in
  # the attributes of sensor.tesla_tariff_a_current_price; everything else
  # reads them from there. 36.21 is a typical value (35.29-36.39 depending on
  # your distributor); change it there if your bill differs.

  # Grid import this month, from the lifetime kWh sensor named in
  # input_text.tesla_grid_import_entity. Trigger-based (state + attributes
  # survive restarts) and baseline-driven instead of a utility_meter, so:
  #  - a meter outage doesn't lose the energy used meanwhile (the next reading
  #    is still compared to the month's baseline);
  #  - changing the configured sensor never adds a bogus jump (a new baseline
  #    is taken and the count continues from the previous value);
  #  - setting it up mid-month starts from an estimate of the month so far
  #    (household estimate x elapsed month + home charging this month).
  # Unknown when no sensor is configured (quota usage then uses the estimate).
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: input_text.tesla_grid_import_entity
    sensor:
      - name: "Tesla Monthly Grid Import"
        unique_id: tesla_monthly_grid_import_v1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-import
        state: >
          {% set src = states('input_text.tesla_grid_import_entity') | trim | lower %}
          {% set valid = src | regex_match('^[a-z_]+[.][a-z0-9_]+$') %}
          {% set cur = (states(src) | float(none)) if valid else none %}
          {% set month = now().strftime('%Y-%m') %}
          {% set same_month = this.attributes.get('month') == month %}
          {% set same_src = this.attributes.get('source_entity') == src %}
          {% set base = this.attributes.get('baseline_kwh') %}
          {% set offset = this.attributes.get('offset_kwh') | float(0) %}
          {% set prev = this.state | float(none) if same_month else none %}
          {% if not valid %}
            {{ none }}
          {% elif cur is none %}
            {{ prev if prev is not none else (0 if not same_month and this.attributes.get('month') is not none else none) }}
          {% elif same_month and same_src and base is number and cur >= base %}
            {{ (cur - base + offset) | round(2) }}
          {% elif same_month and prev is not none %}
            {{ prev | round(2) }}
          {% elif same_month or this.attributes.get('month') is none %}
            {% set n = now() %}
            {% set start = n.replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
            {% set dim = ((start.date() + timedelta(days=32)).replace(day=1) - start.date()).days %}
            {% set frac = [(n - start).total_seconds() / (dim * 86400), 1] | min %}
            {{ (states('input_number.tesla_household_monthly_kwh') | float(0) * frac
                + states('sensor.tesla_monthly_home_charging_energy') | float(0)) | round(2) }}
          {% else %}
            0
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.tesla_grid_import_entity') | trim | lower }}"
          month: "{{ now().strftime('%Y-%m') }}"
          # Meter reading this month's count is measured from. Re-taken on a
          # new month, a changed source, or a meter reset (reading went down).
          baseline_kwh: >
            {% set src = states('input_text.tesla_grid_import_entity') | trim | lower %}
            {% set valid = src | regex_match('^[a-z_]+[.][a-z0-9_]+$') %}
            {% set cur = (states(src) | float(none)) if valid else none %}
            {% set same_month = this.attributes.get('month') == now().strftime('%Y-%m') %}
            {% set same_src = this.attributes.get('source_entity') == src %}
            {% set base = this.attributes.get('baseline_kwh') %}
            {% if not valid %}
              {{ none }}
            {% elif cur is none %}
              {{ base if same_month and same_src else none }}
            {% elif same_month and same_src and base is number and cur >= base %}
              {{ base }}
            {% else %}
              {{ cur }}
            {% endif %}
          # Usage counted before the current baseline was taken this month.
          offset_kwh: >
            {% set src = states('input_text.tesla_grid_import_entity') | trim | lower %}
            {% set valid = src | regex_match('^[a-z_]+[.][a-z0-9_]+$') %}
            {% set cur = (states(src) | float(none)) if valid else none %}
            {% set same_month = this.attributes.get('month') == now().strftime('%Y-%m') %}
            {% set same_src = this.attributes.get('source_entity') == src %}
            {% set base = this.attributes.get('baseline_kwh') %}
            {% set offset = this.attributes.get('offset_kwh') | float(0) %}
            {% set prev = this.state | float(none) if same_month else none %}
            {% if not valid or not same_month %}
              {% if valid and cur is not none and this.attributes.get('month') is none %}
                {% set n = now() %}
                {% set start = n.replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
                {% set dim = ((start.date() + timedelta(days=32)).replace(day=1) - start.date()).days %}
                {% set frac = [(n - start).total_seconds() / (dim * 86400), 1] | min %}
                {{ (states('input_number.tesla_household_monthly_kwh') | float(0) * frac
                    + states('sensor.tesla_monthly_home_charging_energy') | float(0)) | round(2) }}
              {% else %}
                {{ 0 }}
              {% endif %}
            {% elif cur is none %}
              {{ offset if same_src else (prev if prev is not none else 0) }}
            {% elif same_src and base is number and cur >= base %}
              {{ offset }}
            {% elif prev is not none %}
              {{ prev }}
            {% else %}
              {% set n = now() %}
              {% set start = n.replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
              {% set dim = ((start.date() + timedelta(days=32)).replace(day=1) - start.date()).days %}
              {% set frac = [(n - start).total_seconds() / (dim * 86400), 1] | min %}
              {{ (states('input_number.tesla_household_monthly_kwh') | float(0) * frac
                  + states('sensor.tesla_monthly_home_charging_energy') | float(0)) | round(2) }}
            {% endif %}

  # Charging energy/cost accumulators, updated on every change of the
  # vehicle's "charge energy added" (which restarts from 0 each session).
  # Delta rules: first sample 0; rising -> new - last; dropped below half
  # of last -> new session, add new; small dip -> ignore (noise).
  # Unknown/unavailable samples (car asleep) are skipped entirely.
  - triggers:
      - trigger: state
        entity_id: sensor.vehicle_charge_energy_added
        not_to:
          - unknown
          - unavailable
    sensor:
      # Energy charged AT HOME (device_tracker.<car>_location == home) — part
      # of your home's grid import, so it counts toward the discounted quota.
      - name: "Tesla Home Charging Energy Total"
        unique_id: tesla_home_charging_energy_total_v1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-lightning-bolt
        state: >
          {% set new = trigger.to_state.state | float(0) %}
          {% set last = this.attributes.get('last_energy_kwh') %}
          {% set delta = 0 if last is not number else
               (new - last if new >= last else (new if new < last * 0.5 else 0)) %}
          {% set car = states('input_text.tesla_car_name') %}
          {% set home = is_state('device_tracker.' ~ car ~ '_location', 'home') %}
          {{ (this.state | float(0) + (delta if home else 0)) | round(3) }}
        attributes:
          # Keep the previous value on a small dip (noise), so the
          # recovery back up isn't counted twice.
          last_energy_kwh: >
            {% set new = trigger.to_state.state | float(0) %}
            {% set last = this.attributes.get('last_energy_kwh') %}
            {{ last if last is number and last * 0.5 <= new < last else new }}

      # ALL charging, priced at the moment it happens: home charging at
      # sensor.tesla_active_charging_price (tariff-aware), away charging
      # (Superchargers etc.) at input_number.tesla_default_electricity_cost.
      # Can go down (negative Tariff D prices), hence state_class: total.
      - name: "Tesla Tariff Charging Cost Total"
        unique_id: tesla_tariff_charging_cost_total_v1
        unit_of_measurement: "Ft"
        state_class: total
        icon: mdi:cash-register
        state: >
          {% set new = trigger.to_state.state | float(0) %}
          {% set last = this.attributes.get('last_energy_kwh') %}
          {% set delta = 0 if last is not number else
               (new - last if new >= last else (new if new < last * 0.5 else 0)) %}
          {% set car = states('input_text.tesla_car_name') %}
          {% set home = is_state('device_tracker.' ~ car ~ '_location', 'home') %}
          {% set default = states('input_number.tesla_default_electricity_cost') | float(0) %}
          {% set price = (states('sensor.tesla_active_charging_price') | float(default)) if home else default %}
          {{ (this.state | float(0) + delta * price) | round(2) }}
        attributes:
          # Keep the previous value on a small dip (noise), so the
          # recovery back up isn't counted twice.
          last_energy_kwh: >
            {% set new = trigger.to_state.state | float(0) %}
            {% set last = this.attributes.get('last_energy_kwh') %}
            {{ last if last is number and last * 0.5 <= new < last else new }}
          last_price: >
            {% set car = states('input_text.tesla_car_name') %}
            {% set default = states('input_number.tesla_default_electricity_cost') | float(0) %}
            {{ (states('sensor.tesla_active_charging_price') | float(default))
               if is_state('device_tracker.' ~ car ~ '_location', 'home') else default }}

  - sensor:
      # Discounted band for the current month: 2,523 kWh/year counted per
      # day -> ~207 kWh in 30-day months, ~214 kWh in 31-day months.
      - name: "Tesla Discounted Quota Monthly"
        unique_id: tesla_discounted_quota_monthly_v1
        unit_of_measurement: "kWh"
        icon: mdi:sale
        state: >
          {% set start = now().date().replace(day=1) %}
          {% set dim = ((start + timedelta(days=32)).replace(day=1) - start).days %}
          {{ (2523 / 365 * dim) | round(1) }}

      # How much of this month's discounted quota the household has used:
      # the real grid import if a meter is configured, otherwise
      # household estimate x elapsed share of the month + home charging.
      - name: "Tesla Quota Usage Monthly"
        unique_id: tesla_quota_usage_monthly_v1
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:home-import-outline
        state: >
          {% set grid = states('sensor.tesla_monthly_grid_import') %}
          {% if states('input_text.tesla_grid_import_entity') | trim != '' and grid | is_number %}
            {{ grid | float | round(1) }}
          {% else %}
            {% set n = now() %}
            {% set start = n.replace(day=1, hour=0, minute=0, second=0, microsecond=0) %}
            {% set dim = ((start.date() + timedelta(days=32)).replace(day=1) - start.date()).days %}
            {% set frac = [(n - start).total_seconds() / (dim * 86400), 1] | min %}
            {{ (states('input_number.tesla_household_monthly_kwh') | float(0) * frac
                + states('sensor.tesla_monthly_home_charging_energy') | float(0)) | round(1) }}
          {% endif %}
        attributes:
          source: >
            {{ 'meter' if states('input_text.tesla_grid_import_entity') | trim != ''
               and states('sensor.tesla_monthly_grid_import') | is_number else 'estimate' }}

      - name: "Tesla Quota Remaining Monthly"
        unique_id: tesla_quota_remaining_monthly_v1
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:battery-arrow-down-outline
        state: >
          {% set quota = states('sensor.tesla_discounted_quota_monthly') | float(207) %}
          {% set used = states('sensor.tesla_quota_usage_monthly') | float(0) %}
          {{ ([quota - used, 0] | max) | round(1) }}

      # Tariff A gross price right now. Holds the two fixed rates as
      # attributes (single source for every other tariff template).
      - name: "Tesla Tariff A Current Price"
        unique_id: tesla_tariff_a_current_price_v1
        unit_of_measurement: "Ft/kWh"
        state_class: measurement
        icon: mdi:alpha-a-circle-outline
        state: >
          {% set market = state_attr('sensor.tesla_d_tariff_price', 'a1_sav_feletti_brutto_ft_kwh') | float(70.10) %}
          {{ 36.21 if is_state('binary_sensor.tesla_discount_band_active', 'on') else market }}
        attributes:
          discounted_rate: "{{ 36.21 }}"
          # Above-band A1 rate published by dnap.hu, 70.10 if unavailable.
          market_rate: >
            {{ state_attr('sensor.tesla_d_tariff_price', 'a1_sav_feletti_brutto_ft_kwh') | float(70.10) }}

      # Price used for home charging right now. Off: your flat default rate.
      # Tariff A: band/market rate. Tariff D: band rate inside the discounted
      # quota, else the live dnap.hu quarter-hour price (market rate if the
      # feed has no data).
      - name: "Tesla Active Charging Price"
        unique_id: tesla_active_charging_price_v1
        unit_of_measurement: "Ft/kWh"
        state_class: measurement
        icon: mdi:cash-clock
        state: >
          {% set mode = states('input_select.tesla_tariff_mode') %}
          {% set band = is_state('binary_sensor.tesla_discount_band_active', 'on') %}
          {% set disc = state_attr('sensor.tesla_tariff_a_current_price', 'discounted_rate') | float(36.21) %}
          {% set market = state_attr('sensor.tesla_tariff_a_current_price', 'market_rate') | float(70.10) %}
          {% if mode == 'Tariff A' %}
            {{ disc if band else market }}
          {% elif mode == 'Tariff D' %}
            {{ disc if band else states('sensor.tesla_d_tariff_price') | float(market) }}
          {% else %}
            {{ states('input_number.tesla_default_electricity_cost') | float(0) }}
          {% endif %}
        attributes:
          source: >
            {% set mode = states('input_select.tesla_tariff_mode') %}
            {% set band = is_state('binary_sensor.tesla_discount_band_active', 'on') %}
            {% if mode == 'Tariff A' %}
              {{ 'Tariff A discounted band' if band else 'Tariff A market rate' }}
            {% elif mode == 'Tariff D' %}
              {% if band %}Tariff D discounted band
              {% elif states('sensor.tesla_d_tariff_price') | is_number %}Tariff D live price
              {% else %}Tariff D fallback (no price data){% endif %}
            {% else %}
              Default rate
            {% endif %}

  - binary_sensor:
      # On while this month's discounted quota is enabled and not used up.
      - name: "Tesla Discount Band Active"
        unique_id: tesla_discount_band_active_v1
        icon: mdi:sale
        state: >
          {{ is_state('input_boolean.tesla_use_discounted_quota', 'on')
             and states('sensor.tesla_quota_usage_monthly') | float(0)
                 < states('sensor.tesla_discounted_quota_monthly') | float(207) }}

  # ===== FULL AUTO CHARGING (agents.md Section 22) =====
  # Tariff D quarter-hour prices for today and tomorrow (dnap.hu, CC BY 4.0),
  # kept as compact [unix time, gross Ft/kWh] pairs in the "slots" attribute
  # (~4 KB; the raw files are too big for a recorder attribute). Tomorrow's
  # prices appear around 13:00-14:00: checked every 30 min from 13:00 to
  # 16:00, then hourly, until found. Today's are fetched on start-up and every
  # 3 h while missing. A check that finds nothing yet logs one harmless
  # rest_command 404 warning (README Troubleshooting). Runs in every tariff
  # mode but only fetches while data is missing (a few requests a day).
  # State: when the known prices end.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/30"
    actions:
      - variables:
          dnap_ma: "{{ none }}"
          dnap_holnap: "{{ none }}"
          known_days: >
            {% set slots = state_attr('sensor.tesla_d_price_forecast', 'slots') %}
            {% set slots = slots if slots is sequence and slots is not string else [] %}
            {% set t1 = as_timestamp(today_at('00:00')) %}
            {% set t2 = as_timestamp(today_at('00:00') + timedelta(days=1)) %}
            {% set t3 = as_timestamp(today_at('00:00') + timedelta(days=2)) %}
            {% set ts = slots | map(attribute='0') | list %}
            {{ [ts | select('ge', t1) | select('lt', t2) | list | count > 0,
                ts | select('ge', t2) | select('lt', t3) | list | count > 0] }}
          fetch_ma: >
            {{ not known_days[0]
               and ((trigger is defined and trigger.platform == 'homeassistant')
                    or (now().hour % 3 == 0 and now().minute < 30)) }}
          fetch_holnap: >
            {{ not known_days[1] and now().hour >= 13
               and (now().hour < 16 or now().minute < 30) }}
      - if: "{{ fetch_ma }}"
        then:
          - action: rest_command.tesla_dnap_prices
            data:
              day: ma
            response_variable: dnap_ma
            continue_on_error: true
      - if: "{{ fetch_holnap }}"
        then:
          - action: rest_command.tesla_dnap_prices
            data:
              day: holnap
            response_variable: dnap_holnap
            continue_on_error: true
      - variables:
          # Old slots from today on, replaced by any freshly fetched ones
          # (matched by start time, never by position: DST days have 92/100).
          merged: >
            {% set old = state_attr('sensor.tesla_d_price_forecast', 'slots') %}
            {% set old = old if old is sequence and old is not string else [] %}
            {% set t1 = as_timestamp(today_at('00:00')) %}
            {% set ns = namespace(new=[], keep=[]) %}
            {% for r in [dnap_ma, dnap_holnap] %}
              {% if r is mapping and r.get('status') == 200 and r.get('content') is mapping %}
                {% set qs = r.content.get('negyedorak') %}
                {% if qs is sequence and qs is not string %}
                  {% for q in qs %}
                    {% set s = as_timestamp(q.get('kezdet'), none) if q is mapping else none %}
                    {% if s is number and q.get('d_brutto_ft_kwh') is number %}
                      {% set ns.new = ns.new + [[s | int, q.d_brutto_ft_kwh]] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set new_ts = ns.new | map(attribute='0') | list %}
            {% for s in old %}
              {% if s is sequence and s is not string and s | count == 2
                    and s[0] is number and s[1] is number
                    and s[0] >= t1 and (s[0] | int) not in new_ts %}
                {% set ns.keep = ns.keep + [[s[0] | int, s[1]]] %}
              {% endif %}
            {% endfor %}
            {{ (ns.keep + ns.new) | sort(attribute='0') }}
    sensor:
      - name: "Tesla D Price Forecast"
        unique_id: tesla_d_price_forecast_v1
        device_class: timestamp
        icon: mdi:chart-timeline-variant-shimmer
        state: >
          {% set ts = merged | map(attribute='0') | list %}
          {{ ((ts | max) + 900) | timestamp_local if ts else none }}
        attributes:
          slots: "{{ merged }}"
          today_available: >
            {% set t1 = as_timestamp(today_at('00:00')) %}
            {% set t2 = as_timestamp(today_at('00:00') + timedelta(days=1)) %}
            {{ merged | map(attribute='0') | select('ge', t1) | select('lt', t2) | list | count > 0 }}
          tomorrow_available: >
            {% set t2 = as_timestamp(today_at('00:00') + timedelta(days=1)) %}
            {% set t3 = as_timestamp(today_at('00:00') + timedelta(days=2)) %}
            {{ merged | map(attribute='0') | select('ge', t2) | select('lt', t3) | list | count > 0 }}
          last_fetch: >
            {% set ns = namespace(p=[]) %}
            {% if fetch_ma %}{% set ns.p = ns.p + ['today: ' ~ (dnap_ma.status if dnap_ma is mapping else 'error')] %}{% endif %}
            {% if fetch_holnap %}{% set ns.p = ns.p + ['tomorrow: ' ~ (dnap_holnap.status if dnap_holnap is mapping else 'error')] %}{% endif %}
            {{ ns.p | join(', ') if ns.p else this.attributes.get('last_fetch', 'none yet') }}
          attribution: "Tariff D prices: dnap.hu (CC BY 4.0)"

  # Solar power the car could use right now, in kW: what is being exported
  # plus what the car itself is drawing (so it doesn't "see" its own load and
  # throttle down). Uses input_text.tesla_grid_power_entity (+ = import); if
  # that is empty/unavailable, solar power minus the household base load
  # (input_number.tesla_household_monthly_kwh / 730 h, 0.3 kW if unset). The
  # car's draw is estimated from its amps setpoint x phases x 230 V, which is
  # a close approximation. Averaged over 10 min by
  # sensor.tesla_solar_surplus_power_10m (statistics, above).
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "Tesla Solar Surplus Power"
        unique_id: tesla_solar_surplus_power_v1
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant-outline
        state: >
          {% set car = states('input_text.tesla_car_name') %}
          {% set rx = '^[a-z0-9_]+[.][a-z0-9_]+$' %}
          {% set g_id = states('input_text.tesla_grid_power_entity') | trim | lower %}
          {% set pv_id = states('input_text.tesla_pv_power_entity') | trim | lower %}
          {% set g = states(g_id) | float(none) if g_id is match(rx) else none %}
          {% set pv = states(pv_id) | float(none) if pv_id is match(rx) else none %}
          {% set g = g / 1000 if g is not none and (state_attr(g_id, 'unit_of_measurement') or '') | lower == 'w' else g %}
          {% set pv = pv / 1000 if pv is not none and (state_attr(pv_id, 'unit_of_measurement') or '') | lower == 'w' else pv %}
          {% set phases = 1 if is_state('input_select.tesla_home_charger_phases', '1-phase') else 3 %}
          {% set drawing = (is_state('binary_sensor.tesla_charging_active', 'on')
                            or is_state('input_boolean.tesla_auto_charge_owned', 'on'))
                           and is_state('device_tracker.' ~ car ~ '_location', 'home') %}
          {% set car_kw = states('number.vehicle_charge_current') | float(0) * phases * 0.23 if drawing else 0 %}
          {% set base = states('input_number.tesla_household_monthly_kwh') | float(0) / 730 %}
          {% set base = base if base > 0 else 0.3 %}
          {% if g is not none %}
            {{ ([car_kw - g, 0] | max) | round(2) }}
          {% elif pv is not none %}
            {{ ([pv - base, 0] | max) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        attributes:
          source: >
            {% set rx = '^[a-z0-9_]+[.][a-z0-9_]+$' %}
            {% set g_id = states('input_text.tesla_grid_power_entity') | trim | lower %}
            {% set pv_id = states('input_text.tesla_pv_power_entity') | trim | lower %}
            {% if g_id is match(rx) and states(g_id) | is_number %}grid
            {% elif pv_id is match(rx) and states(pv_id) | is_number %}solar
            {% else %}none{% endif %}

  # The Full auto charge planner. Every 5 min (and whenever an input changes)
  # it works out how much energy is needed to reach the Target Charge Limit
  # by the deadline (Charge Ready By, or an earlier Next Departure) and plans
  # it SOLAR FIRST, GRID FOR THE REST:
  #  1. Reference ("grid only") price: the cheapest continuous full-power
  #     block that covers the whole need.
  #  2. Following the sun = charging at max(surplus, 5 A). Sun is worth only
  #     the Solar Feed-in Price; whatever 5 A needs on top comes from the
  #     grid. Every quarter with at least 30% of 5 A in surplus (forecast x
  #     0.8, to be safe) where that blended price is 5% below the reference
  #     is followed, and its energy is subtracted from the need.
  #  3. The rest comes from the cheapest continuous full-power block before
  #     the deadline (+1 spare quarter, and the last quarter is kept free).
  #     If the block overlaps followed quarters it is lengthened to make up
  #     for it. Equal prices -> the LATER block wins, so on a flat tariff
  #     with no sun the car charges just before the deadline.
  #  4. If the full-power block no longer fits, it charges now ("deadline").
  # The plan is redone every 5 min, so if the sun doesn't show up the
  # missing energy simply moves into a grid block later (e.g. at night).
  #  - Price per kWh: Tariff D = live dnap.hu quarter-hour price (same time
  #    yesterday / average when a quarter isn't published yet); Tariff A = the
  #    above-band rate; Off = Default Electricity Rate. Inside the discounted
  #    band the car only uses up quota the house would otherwise use, so the
  #    house pays the above-band rate later: that is the real cost.
  #  - Solar: Forecast.Solar's remaining-today / tomorrow energy is spread over
  #    the day as a sine curve, minus the household base load. The next ~3 h
  #    are scaled by measured / forecast output now ("nowcast", 0.3-2x), and
  #    the current quarter uses the measured 10-min surplus.
  # The automations in packages/tesla/automations.yaml act on it. State = the
  # reason (off/away/unplugged/no_data/override/paused/full/min_soc/
  # committed/deadline/planned/cheap/solar/waiting); attribute "summary"
  # explains it.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - sensor.vehicle_battery_level
          - binary_sensor.vehicle_charge_cable
          - binary_sensor.tesla_charging_active
          - sensor.tesla_d_price_forecast
          - input_boolean.tesla_full_auto_charging
          - input_boolean.tesla_charge_now_override
          - input_boolean.tesla_auto_charge_paused
          - input_boolean.tesla_auto_charge_owned
          - input_number.tesla_target_charge_limit
          - input_number.tesla_auto_charge_min_soc
          - input_number.tesla_auto_charge_cheap_price
          - input_number.tesla_home_charger_max_amps
          - input_number.tesla_solar_feed_in_price
          - input_select.tesla_home_charger_phases
          - input_select.tesla_tariff_mode
          - input_datetime.tesla_charge_ready_by
          - input_datetime.tesla_next_departure
    actions:
      - variables:
          plan: >
            {#- Start of the cheapest n-quarter block among the first m quarters.
                Equal cost -> the LATER block (charge as late as possible), and
                the last quarter before the deadline is kept free as a buffer. -#}
            {%- macro best_start(arr, n, m) -%}
              {%- set w = namespace(win=arr[:n] | sum, best=0, bi=0) -%}
              {%- set w.best = w.win -%}
              {%- for i in range(1, m - n) -%}
                {%- set w.win = w.win - arr[i - 1] + arr[i + n - 1] -%}
                {%- if w.win <= w.best + 0.01 -%}
                  {%- set w.best = [w.best, w.win] | min -%}
                  {%- set w.bi = i -%}
                {%- endif -%}
              {%- endfor -%}
              {{- w.bi -}}
            {%- endmacro -%}
            {% set car = states('input_text.tesla_car_name') %}
            {% set nowts = as_timestamp(now()) %}
            {% set dstr = now().strftime('%Y-%m-%d') %}
            {% set enabled = is_state('input_boolean.tesla_full_auto_charging', 'on') %}
            {% set home = is_state('device_tracker.' ~ car ~ '_location', 'home') %}
            {% set plugged = is_state('binary_sensor.vehicle_charge_cable', 'on') %}
            {% set owned = is_state('input_boolean.tesla_auto_charge_owned', 'on') %}
            {% set override = is_state('input_boolean.tesla_charge_now_override', 'on') %}
            {% set paused = is_state('input_boolean.tesla_auto_charge_paused', 'on') %}
            {% set soc = states('sensor.vehicle_battery_level') | float(none) %}
            {% set target = states('input_number.tesla_target_charge_limit') | float(80) %}
            {% set car_limit = states('number.vehicle_charge_limit') | float(100) %}
            {% set min_soc = states('input_number.tesla_auto_charge_min_soc') | float(0) %}
            {% set cap = states('input_number.tesla_battery_capacity_kwh') | float(75) %}
            {% set cap = cap if cap > 0 else 75 %}
            {% set max_a = [states('input_number.tesla_home_charger_max_amps') | int(16), 5] | max %}
            {% set phases = 1 if is_state('input_select.tesla_home_charger_phases', '1-phase') else 3 %}
            {% set p_max = max_a * phases * 0.23 %}
            {% set p_min = 5 * phases * 0.23 %}
            {% set thr = p_min * 0.3 %}
            {% set feed_in = states('input_number.tesla_solar_feed_in_price') | float(0) %}
            {% set cheap = states('input_number.tesla_auto_charge_cheap_price') | float(-50) %}
            {% set mode = states('input_select.tesla_tariff_mode') %}
            {% set base = states('input_number.tesla_household_monthly_kwh') | float(0) / 730 %}
            {% set base = base if base > 0 else 0.3 %}
            {% set unit = 'Ft' if mode in ['Tariff A', 'Tariff D'] else states('sensor.tesla_currency_symbol') %}
            {# --- deadline: next "ready by" time, or an earlier departure --- #}
            {% set rb = states('input_datetime.tesla_charge_ready_by') %}
            {% set rb = rb[:5] if rb is match('^[0-9]{2}:[0-9]{2}') else '07:00' %}
            {% set dl_dt = today_at(rb) %}
            {% set dl_dt = dl_dt if as_timestamp(dl_dt) >= nowts + 1800 else dl_dt + timedelta(days=1) %}
            {% set dl = as_timestamp(dl_dt) %}
            {% set dep = state_attr('input_datetime.tesla_next_departure', 'timestamp') %}
            {% set dl = dep if dep is number and nowts + 900 < dep < dl else dl %}
            {% set q0 = ((nowts // 900) * 900) | int %}
            {% set M = ((dl - q0) // 900) | int %}
            {# --- price per quarter --- #}
            {% set default_price = states('input_number.tesla_default_electricity_cost') | float(0) %}
            {% set a_market = state_attr('sensor.tesla_tariff_a_current_price', 'market_rate') | float(70.10) %}
            {% set d_live = states('sensor.tesla_d_tariff_price') | float(none) %}
            {% set slots = state_attr('sensor.tesla_d_price_forecast', 'slots') %}
            {% set slots = slots if slots is sequence and slots is not string else [] %}
            {% set ns = namespace(d={}, tot=0, n=0) %}
            {% if mode == 'Tariff D' %}
              {% for s in slots %}
                {% if s is sequence and s is not string and s | count == 2 and s[1] is number %}
                  {% set ns.d = dict(ns.d, **{(s[0] | int | string): s[1]}) %}
                  {% set ns.tot = ns.tot + s[1] %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set d_fill = ns.tot / ns.n if ns.n > 0 else (d_live if d_live is not none else a_market) %}
            {# --- solar forecast (Forecast.Solar) --- #}
            {% set fc = states('input_text.tesla_solar_forecast_entity') | trim | lower %}
            {% set has_fc = fc is match('^sensor[.][a-z0-9_]*power_production_now[a-z0-9_]*$') %}
            {% set rem_id = fc | replace('power_production_now', 'energy_production_today_remaining') %}
            {% set tom_id = fc | replace('power_production_now', 'energy_production_tomorrow') %}
            {% set e_rem = states(rem_id) | float(none) if has_fc else none %}
            {% set e_tom = states(tom_id) | float(none) if has_fc else none %}
            {% set e_rem = e_rem / 1000 if e_rem is not none and (state_attr(rem_id, 'unit_of_measurement') or '') | lower == 'wh' else e_rem %}
            {% set e_tom = e_tom / 1000 if e_tom is not none and (state_attr(tom_id, 'unit_of_measurement') or '') | lower == 'wh' else e_tom %}
            {% set nr = as_timestamp(state_attr('sun.sun', 'next_rising'), none) %}
            {% set nst = as_timestamp(state_attr('sun.sun', 'next_setting'), none) %}
            {% if nr is number and nst is number %}
              {% set r1 = nr if (nr | timestamp_custom('%Y-%m-%d')) == dstr else nr - 86400 %}
              {% set s1 = nst if (nst | timestamp_custom('%Y-%m-%d')) == dstr else nst - 86400 %}
            {% else %}
              {% set r1 = as_timestamp(today_at('06:00')) %}
              {% set s1 = as_timestamp(today_at('18:00')) %}
            {% endif %}
            {% set L = [s1 - r1, 3600] | max %}
            {% set r2 = r1 + 86400 %}
            {% set s2 = s1 + 86400 %}
            {% set xn = pi * ([nowts, r1] | max - r1) / L %}
            {% set den1 = (L / 3600) / pi * (1 + cos([xn, pi] | min)) %}
            {% set live = states('sensor.tesla_solar_surplus_power_10m') | float(none) %}
            {# measured PV output now (for the nowcast): the PV sensor if set, else surplus + base load #}
            {% set pv_id = states('input_text.tesla_pv_power_entity') | trim | lower %}
            {% set pv_meas = states(pv_id) | float(none) if pv_id is match('^[a-z0-9_]+[.][a-z0-9_]+$') else none %}
            {% set pv_meas = pv_meas / 1000 if pv_meas is not none and (state_attr(pv_id, 'unit_of_measurement') or '') | lower == 'w' else pv_meas %}
            {% set pv_meas = pv_meas if pv_meas is not none else (live + base if live is not none else none) %}
            {# --- per quarter: grid price, expected solar surplus, running totals --- #}
            {% set eq = p_max * 0.25 %}
            {% set ns2 = namespace(raw=[], eff=[], fe=[], fb=[], kc=1) %}
            {% for i in range([M, 0] | max) %}
              {% set q = q0 + i * 900 %}
              {% set t = q + 450 %}
              {% if mode == 'Tariff D' %}
                {% set p = ns.d.get(q | string, ns.d.get((q - 86400) | string,
                     d_live if (i == 0 and d_live is not none) else d_fill)) %}
              {% elif mode == 'Tariff A' %}
                {% set p = a_market %}
              {% else %}
                {% set p = default_price %}
              {% endif %}
              {% if r1 < t < s1 and e_rem is not none and den1 > 0.05 %}
                {% set pv = e_rem * sin(pi * (t - r1) / L) / den1 %}
              {% elif r2 < t < s2 and e_tom is not none %}
                {% set pv = e_tom * pi / (2 * L / 3600) * sin(pi * (t - r2) / L) %}
              {% else %}
                {% set pv = 0 %}
              {% endif %}
              {# nowcast: scale the next ~3 h of forecast by measured / forecast now #}
              {% if i == 0 %}
                {% set ns2.kc = ([[pv_meas / pv, 0.3] | max, 2] | min) if (pv_meas is not none and pv > 0.3) else 1 %}
              {% endif %}
              {% set pv = pv * (1 + (ns2.kc - 1) * ([1 - (t - nowts) / 10800, 0] | max)) %}
              {# forecast quarters count at 80%, to be on the safe side #}
              {% set sur = live if (i == 0 and live is not none) else (pv - base) * 0.8 %}
              {% set sur = [sur, 0] | max %}
              {# Following the sun = charging at max(sun, 5 A): energy f this
                 quarter at the blended price (sun at feed-in, rest from grid).
                 A full-power block here gets the sun at feed-in for its part. #}
              {% set f = ([[sur, p_min] | max, p_max] | min) * 0.25 %}
              {% set fs = [sur * 0.25, f] | min %}
              {% set ns2.fe = ns2.fe + [f if (sur >= thr and p > feed_in) else 0] %}
              {% set ns2.fb = ns2.fb + [(fs * feed_in + (f - fs) * p) / f] %}
              {% set ns2.eff = ns2.eff + [p - (p - feed_in) * ([sur / p_max, 1] | min)] %}
              {% set ns2.raw = ns2.raw + [p] %}
            {% endfor %}
            {# --- energy needed; plan = follow the sun where it pays, cheapest grid block for the rest --- #}
            {% set need = (([target - soc, 0] | max) / 100 * cap / 0.9) if soc is not none else 0 %}
            {% set n_full = ((need / eq) | round(0, 'ceil') | int + 1) if need > 0 else 0 %}
            {% set deadline_mode = n_full > 0 and n_full >= M %}
            {% set ns3 = namespace(ref=none, sol=0, scost=0, ff=[], e2=[]) %}
            {# reference: the whole need from the cheapest full-power block #}
            {% if n_full > 0 and not deadline_mode %}
              {% set b0 = best_start(ns2.eff, n_full, M) | trim | int %}
              {% set ns3.ref = (ns2.eff[b0:b0 + n_full] | sum) / n_full %}
            {% endif %}
            {# follow the sun in quarters where the blend beats that by 5% #}
            {% for i in range(ns2.raw | count) %}
              {% set use = ns3.ref is not none and ns2.fe[i] > 0 and ns2.fb[i] < ns3.ref * 0.95 %}
              {% set ns3.ff = ns3.ff + [ns2.fe[i] if use else 0] %}
              {% set ns3.sol = ns3.sol + (ns2.fe[i] if use else 0) %}
              {% set ns3.scost = ns3.scost + (ns2.fe[i] * ns2.fb[i] if use else 0) %}
              {% set ns3.e2 = ns3.e2 + [ns2.raw[i] if use else ns2.eff[i]] %}
            {% endfor %}
            {# grid block for the rest; lengthened if it overlaps followed quarters #}
            {% set grid_need = [need - ns3.sol, 0] | max %}
            {% set N = ((grid_need / eq) | round(0, 'ceil') | int + 1) if grid_need > 0 else 0 %}
            {% if deadline_mode %}
              {% set bi = 0 %}
              {% set N = M %}
            {% elif N > 0 %}
              {% set b1 = best_start(ns3.e2, N, M) | trim | int %}
              {% set N2 = [N + ((ns3.ff[b1:b1 + N] | sum) / eq) | round(0, 'ceil') | int, n_full] | min %}
              {% set bi = best_start(ns3.e2, N2, M) | trim | int if N2 > N else b1 %}
              {% set N = N2 %}
            {% else %}
              {% set bi = -1 %}
            {% endif %}
            {% set bs = q0 + bi * 900 if bi >= 0 else none %}
            {% set be = (dl | int if deadline_mode else bs + N * 900) if bi >= 0 else none %}
            {% set blk = ns2.raw[bi:bi + N] if bi >= 0 else [] %}
            {% set blk_e = ns3.e2[bi:bi + N] if bi >= 0 else [] %}
            {% set avg_p = (blk | sum) / (blk | count) if blk | count > 0 else none %}
            {% set avg_e = (blk_e | sum) / (blk_e | count) if blk_e | count > 0 else none %}
            {% set solar_part = 0 if deadline_mode else [ns3.sol, need] | min %}
            {% set grid_part = need - solar_part %}
            {% set est = (ns3.scost * solar_part / ns3.sol if ns3.sol > 0 else 0)
                         + (avg_e if avg_e is not none else 0) * grid_part %}
            {% set price_now = ns2.raw[0] if ns2.raw | count > 0 else default_price %}
            {% set sur_now = live if live is not none else 0 %}
            {% set solar_amps = [[(sur_now * 1000 / (phases * 230)) | round(0, 'floor') | int, 5] | max, max_a] | min %}
            {% set commit_end = state_attr('input_datetime.tesla_auto_charge_block_end', 'timestamp') | float(0) %}
            {# Solar now: a surplus big enough for 5 A is always followed. A
               smaller one (at least 30% of 5 A) is followed at 5 A with a grid
               top-up while that blend beats the reference price (start below
               95%, keep going up to 100%). #}
            {% set blend = (([sur_now, p_min] | min) * feed_in + ([p_min - sur_now, 0] | max) * price_now) / p_min %}
            {% set solar_ok = price_now > feed_in and live is not none
                              and (live >= (p_min * 0.75 if owned else p_min)
                                   or (ns3.ref is not none and live >= (thr * 0.7 if owned else thr)
                                       and blend <= ns3.ref * (1.0 if owned else 0.95))) %}
            {# --- decision, most important first --- #}
            {% if not enabled %}{% set r = 'off' %}
            {% elif not home %}{% set r = 'away' %}
            {% elif not plugged %}{% set r = 'unplugged' %}
            {% elif soc is none %}{% set r = 'no_data' %}
            {% elif override and soc < car_limit %}{% set r = 'override' %}
            {% elif paused %}{% set r = 'paused' %}
            {% elif soc >= target %}{% set r = 'full' %}
            {% elif soc < min_soc %}{% set r = 'min_soc' %}
            {% elif owned and nowts < commit_end %}{% set r = 'committed' %}
            {% elif deadline_mode %}{% set r = 'deadline' %}
            {% elif bi == 0 %}{% set r = 'planned' %}
            {% elif price_now <= cheap %}{% set r = 'cheap' %}
            {% elif solar_ok %}{% set r = 'solar' %}
            {% else %}{% set r = 'waiting' %}{% endif %}
            {% set should = r in ['override', 'min_soc', 'committed', 'deadline', 'planned', 'cheap', 'solar']
                            or (r == 'no_data' and owned) %}
            {% set amps = solar_amps if r == 'solar' else max_a %}
            {% set commit_until = (be if r in ['planned', 'deadline'] else (commit_end if r == 'committed' else nowts)) | int %}
            {# --- text --- #}
            {% set dl_s = dl | timestamp_custom('%H:%M' if (dl | timestamp_custom('%Y-%m-%d')) == dstr else '%a %H:%M') %}
            {% set bs_s = bs | timestamp_custom('%H:%M' if (bs | timestamp_custom('%Y-%m-%d')) == dstr else '%a %H:%M') if bs is not none else '' %}
            {% set be_s = be | timestamp_custom('%H:%M') if be is not none else '' %}
            {% set ce_s = commit_end | timestamp_custom('%H:%M') %}
            {% set price_s = ('%.1f' | format(avg_e)) ~ ' ' ~ unit ~ '/kWh' if avg_e is not none else '' %}
            {% set cost_s = ' (~' ~ ('%.0f' | format(est)) ~ ' ' ~ unit ~ ' total)' if need > 0 else '' %}
            {% set sol_s = '~' ~ ('%.1f' | format(solar_part)) ~ ' kWh from solar, ' if solar_part >= 0.5 else '' %}
            {% set wait_s = ('Waiting. Plan: ' ~ sol_s ~ 'grid ' ~ bs_s ~ '–' ~ be_s ~ ' at avg ' ~ price_s ~ cost_s ~ ', ready by ' ~ dl_s ~ '.')
                            if bs is not none else
                            ('Waiting for solar: ~' ~ ('%.1f' | format(ns3.sol)) ~ ' kWh expected before ' ~ dl_s ~ ' covers the ' ~ ('%.1f' | format(need)) ~ ' kWh needed.') %}
            {% set texts = {
                 'off': 'Full auto charging is off.',
                 'away': 'The car is not at home.',
                 'unplugged': 'The car is not plugged in.',
                 'no_data': 'Waiting for battery data from the car.',
                 'override': "Charge now: charging to the car's own limit (" ~ (car_limit | int) ~ '%) until unplugged.',
                 'paused': 'Paused (you stopped charging) until the car is unplugged. Tap Charge now to charge anyway.',
                 'full': 'Target reached (' ~ (soc | int if soc is not none else 0) ~ '% of ' ~ (target | int) ~ '%).',
                 'min_soc': 'Battery below ' ~ (min_soc | int) ~ '%: charging now at full power.',
                 'committed': 'Charging in the planned block until ' ~ ce_s ~ '.',
                 'deadline': 'Charging now at full power to be ready by ' ~ dl_s ~ '.',
                 'planned': 'Charging now in the cheapest block ' ~ bs_s ~ '–' ~ be_s ~ ', avg ' ~ price_s ~ cost_s ~ '.',
                 'cheap': 'Price now (' ~ ('%.1f' | format(price_now)) ~ ' ' ~ unit ~ '/kWh) is at or below your Always Charge Below Price.',
                 'solar': ('Charging from solar surplus (' ~ ('%.1f' | format(sur_now)) ~ ' kW, ' ~ solar_amps ~ ' A).')
                          if sur_now >= p_min else
                          ('Charging at 5 A on ' ~ ('%.1f' | format(sur_now)) ~ ' kW sun + grid (~' ~ ('%.0f' | format(blend)) ~ ' ' ~ unit ~ '/kWh, cheaper than ~' ~ ('%.0f' | format(ns3.ref or 0)) ~ ' ' ~ unit ~ '/kWh from the grid alone).'),
                 'waiting': wait_s
               } %}
            {{ {
                 'reason': r,
                 'should_charge': should,
                 'amps': amps,
                 'summary': texts[r],
                 'need_kwh': need | round(1),
                 'solar_kwh': solar_part | round(1),
                 'quarters_needed': N,
                 'deadline': dl_s,
                 'deadline_ts': dl | int,
                 'block_start': bs_s,
                 'block_end': be_s,
                 'block_start_ts': bs,
                 'block_end_ts': be,
                 'commit_until_ts': commit_until,
                 'avg_price': avg_p | round(1) if avg_p is not none else none,
                 'avg_effective_price': avg_e | round(1) if avg_e is not none else none,
                 'grid_only_price': ns3.ref | round(1) if ns3.ref is not none else none,
                 'est_cost': est | round(0) if need > 0 else none,
                 'price_now': price_now | round(1),
                 'surplus_kw': sur_now | round(2),
                 'solar_forecast': has_fc
               } }}
    sensor:
      - name: "Tesla Auto Charge Plan"
        unique_id: tesla_auto_charge_plan_v1
        state: "{{ plan.reason }}"
        icon: >
          {{ {'off': 'mdi:robot-off-outline', 'away': 'mdi:home-export-outline',
              'unplugged': 'mdi:power-plug-off-outline', 'no_data': 'mdi:help-circle-outline',
              'override': 'mdi:flash-alert', 'paused': 'mdi:pause-circle-outline',
              'full': 'mdi:battery-check',
              'min_soc': 'mdi:battery-alert-variant-outline', 'committed': 'mdi:battery-charging',
              'deadline': 'mdi:clock-alert-outline', 'planned': 'mdi:battery-charging',
              'cheap': 'mdi:cash-fast', 'solar': 'mdi:solar-power',
              'waiting': 'mdi:timer-sand'}.get(plan.reason, 'mdi:robot-outline') }}
        attributes:
          should_charge: "{{ plan.should_charge }}"
          amps: "{{ plan.amps }}"
          summary: "{{ plan.summary }}"
          need_kwh: "{{ plan.need_kwh }}"
          solar_kwh: "{{ plan.solar_kwh }}"
          quarters_needed: "{{ plan.quarters_needed }}"
          deadline: "{{ plan.deadline }}"
          deadline_ts: "{{ plan.deadline_ts }}"
          block_start: "{{ plan.block_start }}"
          block_end: "{{ plan.block_end }}"
          block_start_ts: "{{ plan.block_start_ts }}"
          block_end_ts: "{{ plan.block_end_ts }}"
          commit_until_ts: "{{ plan.commit_until_ts }}"
          avg_price: "{{ plan.avg_price }}"
          avg_effective_price: "{{ plan.avg_effective_price }}"
          grid_only_price: "{{ plan.grid_only_price }}"
          est_cost: "{{ plan.est_cost }}"
          price_now: "{{ plan.price_now }}"
          surplus_kw: "{{ plan.surplus_kw }}"
          solar_forecast: "{{ plan.solar_forecast }}"

# ---------------------------------------------------------------------------
# HUNGARIAN TARIFF D PRICE FEED (dnap.hu) — agents.md Section 21
# ---------------------------------------------------------------------------
# Free public JSON, no API key, refreshed every 5 minutes upstream. Gross
# Tariff D price for the CURRENT quarter hour (Ft/kWh, can be negative).
# Data: dnap.hu, CC BY 4.0 (wholesale price: Bundesnetzagentur | SMARD.de).
# On days with no published prices the server answers HTTP 404 with
# {"hiba": "..."}; the availability templates below then mark these
# entities unavailable (no log spam) and sensor.tesla_active_charging_price
# falls back to the above-band A rate. Polled in every tariff mode; disable
# the three entities in the entity settings if you never use Tariff D.
rest:
  - resource: https://dnap.hu/adatok/most.json
    scan_interval: 300
    timeout: 20
    sensor:
      - name: "Tesla D Tariff Price"
        unique_id: tesla_d_tariff_price_v1
        unit_of_measurement: "Ft/kWh"
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        availability: >
          {{ value_json is mapping and value_json.most is mapping
             and value_json.most.d_brutto_ft_kwh is number }}
        value_template: "{{ value_json.most.d_brutto_ft_kwh }}"
        json_attributes:
          - most
          - legolcsobb_ora_24h
          - a1_sav_feletti_brutto_ft_kwh
      - name: "Tesla D Tariff Cheapest Hour"
        unique_id: tesla_d_tariff_cheapest_hour_v1
        device_class: timestamp
        icon: mdi:clock-star-four-points-outline
        availability: >
          {{ value_json is mapping and value_json.legolcsobb_ora_24h is mapping
             and value_json.legolcsobb_ora_24h.kezdet is string }}
        value_template: "{{ value_json.legolcsobb_ora_24h.kezdet }}"
    binary_sensor:
      - name: "Tesla D Tariff Cheaper Than A"
        unique_id: tesla_d_tariff_cheaper_than_a_v1
        icon: mdi:scale-unbalanced
        availability: >
          {{ value_json is mapping and value_json.most is mapping
             and value_json.most.olcsobb_mint_a1 is defined }}
        value_template: "{{ value_json.most.olcsobb_mint_a1 }}"

# ---------------------------------------------------------------------------
# REST COMMANDS
# ---------------------------------------------------------------------------
# tesla_window_close_gps: Workaround for HA tesla_fleet integration bug where
# cover.close_cover passes lat=0,lon=0, triggering Tesla's proximity check.
# Calls the Fleet API directly with the vehicle's current GPS coordinates.
#
# Required secrets.yaml entries:
#   tesla_fleet_token: <OAuth2 access token from Tesla Fleet integration>
#   tesla_fleet_vehicle_id: <numeric vehicle ID, e.g. 1234567890123456789>
#
# To find your vehicle ID: call GET https://fleet-api.prd.eu.vn.cloud.tesla.com/api/1/vehicles
# with your bearer token — the "id" field in the response is what you need.
# To get the token temporarily: HA Developer Tools → Template →
#   {{ integration_loaded('tesla_fleet') }}  (then check .storage/tesla_fleet/ in your HA config volume)
rest_command:
  tesla_window_close_gps:
    url: "https://fleet-api.prd.eu.vn.cloud.tesla.com/api/1/vehicles/{{ vehicle_id }}/command/window_control"
    method: POST
    headers:
      Authorization: "Bearer {{ token }}"
      Content-Type: "application/json"
    payload: '{"command": "close", "lat": {{ lat | float }}, "lon": {{ lon | float }}}'

  # Full auto charging (agents.md Section 22): Tariff D quarter-hour prices for
  # a whole day from dnap.hu (CC BY 4.0). day = "ma" (today) or "holnap"
  # (tomorrow). Called by the sensor.tesla_d_price_forecast trigger template.
  # If the day isn't published yet the server answers 404 and rest_command
  # logs one warning ("Error. Url: https://dnap.hu/... Status code 404") —
  # harmless, see README Troubleshooting.
  tesla_dnap_prices:
    url: "https://dnap.hu/adatok/{{ day }}.json"
    method: GET
    timeout: 20

# Tesla Fleet token refresh (see scripts/refresh_tesla_token.sh,
# script.tesla_refresh_fleet_token in packages/tesla/scripts.yaml, and the
# hourly "tesla_refresh_fleet_token" automation). shell_command runs inside
# the HA Core container, which shares the same /config filesystem the SSH
# add-on sees, so no separate host access is needed. --apply writes the
# integration's current token into secrets.yaml. script.tesla_refresh_fleet_token
# then reloads scripts so the new token is used right away (no restart).
shell_command:
  refresh_tesla_token: "bash /config/scripts/refresh_tesla_token.sh --apply"
