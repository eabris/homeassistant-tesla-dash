                      <span style="font-size:18px;width:22px;text-align:center;flex-shrink:0">${icon}</span>
                      <div style="flex:1;min-width:0">
                        <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                        <div style="color:#fff;font-size:15px;font-weight:700">${val}${sub ? `<span style="color:#aaa;font-size:11px;font-weight:400">  ${sub}</span>` : ''}</div>
                      </div>
                    </div>`;
                  const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                  const isMi = unitSys !== 'Metric (km, °C, bar)';
                  const distUnit = isMi ? 'mi' : 'km';
                  const distKm = parseFloat(states['sensor.tesla_weekly_distance']?.state || '0') || 0;
                  const dist = fmt(isMi ? distKm * 0.621371 : distKm, distUnit, 0);
                  const energy = fmt(states['sensor.tesla_weekly_charging_energy']?.state, 'kWh', 2);
                  const elecCost = ftm(states['sensor.tesla_weekly_electric_cost']?.state);
                  const fuelEq = ftm(states['sensor.tesla_weekly_fuel_cost']?.state);
                  const elecV = parseFloat(states['sensor.tesla_weekly_electric_cost']?.state || '0') || 0;
                  const fuelV = parseFloat(states['sensor.tesla_weekly_fuel_cost']?.state || '0') || 0;
                  const saved = Math.max(0, fuelV - elecV);
                  return `<div style="width:100%;text-align:left">
                    <div style="color:#ccc;font-size:12px;font-weight:700;letter-spacing:1.5px;padding-bottom:4px">📅 THIS WEEK <span style="color:#666;font-size:10px;font-weight:400">(since Mon)</span></div>
                    ${row('🚗', 'DISTANCE', dist, '')}
                    ${row('⚡', 'ENERGY CHARGED', energy, '')}
                    ${row('💰', 'ELECTRIC COST', elecCost, `vs fuel ${fuelEq}`)}
                    ${saved > 0 ? row('✅', 'SAVED VS ICE', currencySymbol + Math.round(saved).toLocaleString(currencyLocale), '') : ''}
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: rgba(28, 28, 30, 0.95)
                - border-radius: 16px
                - padding: 16px 20px
              grid:
                - grid-template-areas: '"block"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                block:
                  - width: 100%

