  # ========== VIEW 4: SETTINGS ==========
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:
      - type: markdown
        content: |
          ## Settings & Configuration

      # Currency Selector
      - type: markdown
        content: |
          ## 💱 Currency

          Choose the currency used for all cost calculations and displays
          across both dashboards (electricity cost, fuel comparison, savings,
          projections, history). The number you enter for rates below should
          already be in this currency.

      - type: custom:mushroom-select-card
        entity: input_select.tesla_currency
        name: "Currency"
        icon: mdi:cash-multiple

      # Unit System Selector
      - type: markdown
        content: |
          ## 📏 Unit System

          Choose how distance, speed, tire pressure, and temperature are
          displayed across both dashboards. Charging/battery energy always
          stays in kWh/kW/A/V regardless of this setting (that's universal
          for EVs, even in the US). **UK** uses miles/mph like US Imperial,
          but keeps °C and bar like Metric — matching how most UK/Ireland
          drivers actually configure their car.

          **Known limitation:** the long-term history charts on the
          *Driving* and *Charging* analytics tabs currently always plot in
          km / km/h / Wh per km regardless of this setting — only this
          Settings tab, the Overview dashboard, and the History tab's
          Today/Week/Month summary cards fully respect it for now.

          **Also note:** this only changes how these *custom dashboard
          cards* display values — the underlying sensors (odometer, range,
          tire pressure, temperature, etc.) always store km/bar/°C
          internally, matching what the Tesla Fleet integration natively
          reports. So if you check a value in **Developer Tools → States**,
          a native History/Logbook entry, or a plain `history-graph` /
          `statistics-graph` card outside these dashboards, it'll always
          show km/bar/°C no matter what you pick above. (This is
          intentional — dynamically changing a stats-tracked sensor's unit
          at runtime would trigger Home Assistant's "unit changed" repair
          warnings and can disrupt Long-Term Statistics.)

      - type: custom:mushroom-select-card
        entity: input_select.tesla_unit_system
        name: "Unit System"
        icon: mdi:ruler-square-compass

      # Recommended Tire Pressure Configuration
      - type: markdown
        content: |
          ## 🛞 Wheels & Recommended Cold Tire Pressure

          Tesla's Fleet API only reports each wheel's *live* pressure — it
          doesn't expose a manufacturer-recommended value, and the correct
          number depends on your specific wheel size (it isn't universal).

          Pick your wheel size below and the pressure + range-adjustment
          sliders auto-fill with Tesla community-typical starting values —
          then double-check the pressure against the placard on your
          driver's door jamb and edit if it differs. Pressure is always
          stored in bar; it converts to psi on the Tires tab automatically
          if you're using US Imperial units.

      - type: custom:mushroom-select-card
        entity: input_select.tesla_wheel_size
        name: "Wheel Size"
        icon: mdi:tire

      - type: custom:mushroom-number-card
        entity: input_number.tesla_recommended_tire_pressure
        name: "Recommended Cold Pressure"
        icon: mdi:gauge
        min: 1.5
        max: 3.8
        step: 0.05

      - type: markdown
        content: |
          **Range adjustment:** larger/heavier wheels increase rolling
          resistance, reducing real-world range below the vehicle's
          official rated range. This % is subtracted from the official
          range to estimate a more realistic figure — shown in brackets
          next to the official range throughout both dashboards. It's a
          rough estimate; tune it over time based on your own observed
          real-world range if it doesn't match.

      - type: custom:mushroom-number-card
        entity: input_number.tesla_wheel_range_adjustment_pct
        name: "Wheel Range Adjustment"
        icon: mdi:speedometer
        min: 0
        max: 25
        step: 0.5

      # Electricity Cost Configuration
      - type: markdown
        content: |
          ## ⚡ Electricity Costs

      - type: custom:mushroom-number-card
        entity: input_number.tesla_default_electricity_cost
        name: "Default Electricity Rate"
        icon: mdi:cash
        min: 0
        max: 200
        step: 0.5

      # Smart Charging (off-peak window automation)
      - type: markdown
        content: |
          ## 🌙 Smart Charging

          When enabled, charging automatically starts once per day at the
          window start time below (if plugged in and below your target %),
          and stops if the window ends before the target is reached — so you
          don't accidentally pay peak rates. This fires **at most once per
          day** (one start, one stop) by design; it will not repeatedly
          toggle charging on/off.

      - type: custom:mushroom-entity-card
        entity: input_boolean.tesla_enable_smart_charging
        name: "Enable Smart Charging"
        icon: mdi:wand-magic-sparkles
        tap_action:
          action: toggle

      - type: custom:mushroom-number-card
        entity: input_number.tesla_target_charge_limit
        name: "Target Charge Limit"
        icon: mdi:battery-80
        min: 50
        max: 100
        step: 1

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: input_datetime.tesla_smart_charge_window_start
            name: "Window Start"
            icon: mdi:clock-start
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: input_datetime.tesla_smart_charge_window_end
            name: "Window End"
            icon: mdi:clock-end
            tap_action:
              action: more-info

      # Supercharger Configuration (Placeholder)
      - type: markdown
        content: |
          ## 🔌 Supercharging

          Unlike the Tessie app, this project's Tesla Fleet integration does
          **not** sync Supercharging session costs from your Tesla account —
          that data isn't exposed by the Fleet API. Supercharger costs shown
          in Cost Projections and Analytics are placeholders (0) until this
          is implemented (e.g. by manually logging sessions, or once a
          community sensor for Supercharger billing exists).

      # Fuel Comparison Profiler
      - type: markdown
        content: |
          ## 🚗 Fuel Comparison (ICE Vehicle)

      - type: custom:mushroom-number-card
        entity: input_number.comparison_ice_efficiency
        name: "ICE Fuel Efficiency"
        icon: mdi:fuel
        unit: "L/100km"
        min: 1
        max: 25
        step: 0.1

      - type: custom:mushroom-number-card
        entity: input_number.comparison_fuel_price_per_liter
        name: "Fuel Price per Litre"
        icon: mdi:cash
        min: 0
        max: 2000
        step: 1

      # Rate Schedules — Saved Location Rates (live, editable)
      - type: markdown
        content: |
          ---
          ## 📍 Saved Location Rates

          Rates below are shown in whatever currency you set above (currently
          **{{ states('input_select.tesla_currency') }} ({{ states('sensor.tesla_currency_symbol') }})**).
          Edit any value using the entity rows underneath each location.

          **Note:** These are informational/manual rate profiles — the actual
          cost calculations on the Overview/Analytics dashboards currently use
          `input_number.tesla_default_electricity_cost` as a single flat rate.
          Automatic time-of-use / location-aware rate switching is not wired
          up yet; use these cards to document your tariffs for now.

      - type: markdown
        content: >
          ### {{ states('input_text.tesla_rate_home_name') }}

          - **Rate:** {{ states('input_number.tesla_rate_home_per_kwh') }} {{
          states('sensor.tesla_currency_symbol') }}/kWh

          - **Hours:** {{ states('input_text.tesla_rate_home_hours') }}

          - **Active Days:** {{ states('input_text.tesla_rate_home_days') }}

          - **Season:** {{ states('input_text.tesla_rate_home_season') }}
      - type: entities
        title: Edit Home Rate
        entities:
          - entity: input_text.tesla_rate_home_name
            name: Location name
          - entity: input_number.tesla_rate_home_per_kwh
            name: Rate
          - entity: input_text.tesla_rate_home_hours
            name: Hours
          - entity: input_text.tesla_rate_home_days
            name: Active days
          - entity: input_text.tesla_rate_home_season
            name: Season

      - type: markdown
        content: >
          ### {{ states('input_text.tesla_rate_solar_name') }}

          - **Rate:** {{ states('input_number.tesla_rate_solar_per_kwh') }} {{
          states('sensor.tesla_currency_symbol') }}/kWh

          - **Hours:** {{ states('input_text.tesla_rate_solar_hours') }}

          - **Active Days:** {{ states('input_text.tesla_rate_solar_days') }}

          - **Season:** {{ states('input_text.tesla_rate_solar_season') }}
      - type: entities
        title: Edit Solar / Off-Peak Rate
        entities:
          - entity: input_text.tesla_rate_solar_name
            name: Location name
          - entity: input_number.tesla_rate_solar_per_kwh
            name: Rate
          - entity: input_text.tesla_rate_solar_hours
            name: Hours
          - entity: input_text.tesla_rate_solar_days
            name: Active days
          - entity: input_text.tesla_rate_solar_season
            name: Season

      - type: markdown
        content: >
          ### {{ states('input_text.tesla_rate_work_name') }}

          - **Rate:** {{ states('input_number.tesla_rate_work_per_kwh') }} {{
          states('sensor.tesla_currency_symbol') }}/kWh

          - **Hours:** {{ states('input_text.tesla_rate_work_hours') }}

          - **Active Days:** {{ states('input_text.tesla_rate_work_days') }}

          - **Season:** {{ states('input_text.tesla_rate_work_season') }}
      - type: entities
        title: Edit Work Rate
        entities:
          - entity: input_text.tesla_rate_work_name
            name: Location name
          - entity: input_number.tesla_rate_work_per_kwh
            name: Rate
          - entity: input_text.tesla_rate_work_hours
