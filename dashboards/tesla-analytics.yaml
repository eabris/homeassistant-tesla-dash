  # ========== VIEW 5: ADVANCED SETTINGS (sub-page of Settings) ==========
  # subview: no tab in the top bar; reached from Settings -> Advanced.
  - title: Advanced settings
    path: settings-advanced
    icon: mdi:wrench-cog
    subview: true
    back_path: /tesla-analytics/settings
    cards:

      # Tesla Fleet API token (Close Windows GPS workaround)
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 🔑 Tesla API Token

              **Close Windows** sends its command to Tesla directly, using a copy
              of the Tesla Fleet token stored in `secrets.yaml`. That copy expires
              about every 8 hours. It refreshes itself every hour and whenever
              Close Windows gets a 401 error. Tap below to refresh it now. No
              restart needed; the result appears in your notifications.
          - type: custom:mushroom-entity-card
            entity: script.tesla_refresh_fleet_token
            name: "Refresh Tesla API token"
            icon: mdi:key-change
            secondary_info: last-changed
            tap_action:
              action: call-service
              service: script.tesla_refresh_fleet_token

      # Unit system details
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 📏 Unit System details

              **UK** uses miles and mph like US Imperial, but keeps °C and bar
              like Metric. Energy (kWh, kW, A, V) never changes.

              Only these two dashboards convert values (except the Driving and
              Charging charts, which always use km). The sensors themselves
              always store km, bar and °C, as Tesla reports them, so Developer
              Tools, History, Logbook and other dashboards always show those.
              Changing a sensor's unit on the fly would break Home Assistant's
              long-term statistics.

      - type: markdown
        content: |
          ## 🔌 Supercharging

          Tesla's Fleet API doesn't share Supercharger bills, so they can't be
          tracked. Charging away from home is counted at your Default
          Electricity Rate instead.

      # Saved location rates: notes only
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 📍 Saved Location Rates (notes only)

              A place to write down the rates of the places you charge. These
              are **notes only**, with one exception: the **Work rate** prices
              charging inside your Work zone once you set one (Settings → ⚡
              Electricity Price). Names, hours, days and season are always just
              notes. Currency:
              **{{ states('input_select.tesla_currency') }} ({{ states('sensor.tesla_currency_symbol') }})**.
          - type: markdown
            content: >
              ### {{ states('input_text.tesla_rate_home_name') }}

              - **Rate:** {{ states('input_number.tesla_rate_home_per_kwh') }} {{
              states('sensor.tesla_currency_symbol') }}/kWh

              - **Hours:** {{ states('input_text.tesla_rate_home_hours') }}

              - **Active Days:** {{ states('input_text.tesla_rate_home_days') }}

              - **Season:** {{ states('input_text.tesla_rate_home_season') }}
          - type: entities
            title: Edit Home Rate
            entities:
              - entity: input_text.tesla_rate_home_name
                name: Location name
              - entity: input_number.tesla_rate_home_per_kwh
                name: Rate
              - entity: input_text.tesla_rate_home_hours
                name: Hours
              - entity: input_text.tesla_rate_home_days
                name: Active days
              - entity: input_text.tesla_rate_home_season
                name: Season

      # Solar / off-peak rate notes
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### {{ states('input_text.tesla_rate_solar_name') }}

              - **Rate:** {{ states('input_number.tesla_rate_solar_per_kwh') }} {{
              states('sensor.tesla_currency_symbol') }}/kWh

              - **Hours:** {{ states('input_text.tesla_rate_solar_hours') }}

              - **Active Days:** {{ states('input_text.tesla_rate_solar_days') }}

              - **Season:** {{ states('input_text.tesla_rate_solar_season') }}
          - type: entities
            title: Edit Solar / Off-Peak Rate
            entities:
              - entity: input_text.tesla_rate_solar_name
                name: Location name
              - entity: input_number.tesla_rate_solar_per_kwh
                name: Rate
              - entity: input_text.tesla_rate_solar_hours
                name: Hours
              - entity: input_text.tesla_rate_solar_days
                name: Active days
              - entity: input_text.tesla_rate_solar_season
                name: Season

      # Work rate notes
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ### {{ states('input_text.tesla_rate_work_name') }}

              - **Rate:** {{ states('input_number.tesla_rate_work_per_kwh') }} {{
              states('sensor.tesla_currency_symbol') }}/kWh

              - **Hours:** {{ states('input_text.tesla_rate_work_hours') }}

              - **Active Days:** {{ states('input_text.tesla_rate_work_days') }}

              - **Season:** {{ states('input_text.tesla_rate_work_season') }}
          - type: entities
            title: Edit Work Rate
            entities:
              - entity: input_text.tesla_rate_work_name
                name: Location name
              - entity: input_number.tesla_rate_work_per_kwh
                name: Rate
              - entity: input_text.tesla_rate_work_hours
                name: Hours
              - entity: input_text.tesla_rate_work_days
