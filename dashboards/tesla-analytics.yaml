  # ========== VIEW 4: SETTINGS ==========
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:
      - type: markdown
        content: |
          ## Settings & Configuration

      # Currency Selector
      - type: markdown
        content: |
          ## 💱 Currency

          Choose the currency used for all cost calculations and displays
          across both dashboards (electricity cost, fuel comparison, savings,
          projections, history). The number you enter for rates below should
          already be in this currency.

      - type: custom:mushroom-select-card
        entity: input_select.tesla_currency
        name: "Currency"
        icon: mdi:cash-multiple

      # Unit System Selector
      - type: markdown
        content: |
          ## 📏 Unit System

          Choose how distance, speed, tire pressure, and temperature are
          displayed across both dashboards. Charging/battery energy always
          stays in kWh/kW/A/V regardless of this setting (that's universal
          for EVs, even in the US). **UK** uses miles/mph like US Imperial,
          but keeps °C and bar like Metric — matching how most UK/Ireland
          drivers actually configure their car.

          **Known limitation:** the long-term history charts on the
          *Driving* and *Charging* analytics tabs currently always plot in
          km / km/h / Wh per km regardless of this setting — only this
          Settings tab, the Overview dashboard, and the History tab's
          Today/Week/Month summary cards fully respect it for now.

          **Also note:** this only changes how these *custom dashboard
          cards* display values — the underlying sensors (odometer, range,
          tire pressure, temperature, etc.) always store km/bar/°C
          internally, matching what the Tesla Fleet integration natively
          reports. So if you check a value in **Developer Tools → States**,
          a native History/Logbook entry, or a plain `history-graph` /
          `statistics-graph` card outside these dashboards, it'll always
          show km/bar/°C no matter what you pick above. (This is
          intentional — dynamically changing a stats-tracked sensor's unit
          at runtime would trigger Home Assistant's "unit changed" repair
          warnings and can disrupt Long-Term Statistics.)

      - type: custom:mushroom-select-card
        entity: input_select.tesla_unit_system
        name: "Unit System"
        icon: mdi:ruler-square-compass

      # Recommended Tire Pressure Configuration
      - type: markdown
        content: |
          ## 🛞 Wheels & Recommended Cold Tire Pressure

          Tesla's Fleet API only reports each wheel's *live* pressure — it
          doesn't expose a manufacturer-recommended value, and the correct
          number depends on your specific wheel size (it isn't universal).

          Pick your wheel size below and the pressure + range-adjustment
          sliders auto-fill with Tesla community-typical starting values —
          then double-check the pressure against the placard on your
          driver's door jamb and edit if it differs. Pressure is always
          stored in bar; it converts to psi on the Tires tab automatically
          if you're using US Imperial units.

      - type: custom:mushroom-select-card
        entity: input_select.tesla_wheel_size
        name: "Wheel Size"
        icon: mdi:tire

      - type: custom:mushroom-number-card
        entity: input_number.tesla_recommended_tire_pressure
        name: "Recommended Cold Pressure"
        icon: mdi:gauge
        min: 1.5
        max: 3.8
        step: 0.05

      - type: markdown
        content: |
          **Range adjustment:** larger/heavier wheels increase rolling
          resistance, reducing real-world range below the vehicle's
          official rated range. This % is subtracted from the official
          range to estimate a more realistic figure — shown in brackets
          next to the official range throughout both dashboards. It's a
          rough estimate; tune it over time based on your own observed
          real-world range if it doesn't match.

      - type: custom:mushroom-number-card
        entity: input_number.tesla_wheel_range_adjustment_pct
        name: "Wheel Range Adjustment"
        icon: mdi:speedometer
        min: 0
        max: 25
        step: 0.5

      # Electricity Cost Configuration
      - type: markdown
        content: |
          ## ⚡ Electricity Costs

      - type: custom:mushroom-number-card
        entity: input_number.tesla_default_electricity_cost
        name: "Default Electricity Rate"
        icon: mdi:cash
        min: 0
        max: 200
        step: 0.5

      # Hungarian electricity tariff (agents.md Section 21)
      - type: markdown
        content: |
          ## 🇭🇺 Hungarian Electricity Tariff

          Pick how your home electricity is billed. The price in force
          *while the car charges* is added up into every charging-cost
          figure on both dashboards (changing the tariff later does not
          rewrite costs already counted).

          - **Off** — every charge is priced at the Default Electricity Rate above.
          - **Tariff A** — 36.21 Ft/kWh inside your discounted quota
            (2,523 kWh/year, counted per day: ~207 kWh in 30-day months,
            ~214 kWh in 31-day months), then the above-quota A1 rate
            (~70.10 Ft/kWh, read live from dnap.hu).
          - **Tariff D** — 36.21 Ft/kWh inside the quota, then the live
            quarter-hour Tariff D price from dnap.hu (it can even be
            negative). Turn on **Full Auto Charging** below to charge in
            the cheapest quarter hours automatically.

          Charging away from home (Superchargers etc.) is always priced at
          the Default Electricity Rate. Tariff prices are in Hungarian
          Forint — keep the Currency set to HUF when using Tariff A or D.

      - type: custom:mushroom-select-card
        entity: input_select.tesla_tariff_mode
        name: "Tariff"
        icon: mdi:transmission-tower

      - type: custom:mushroom-entity-card
        entity: input_boolean.tesla_use_discounted_quota
        name: "Use Discounted Quota (rezsicsökkentett sáv)"
        icon: mdi:sale
        tap_action:
          action: toggle

      - type: markdown
        content: |
          **Quota tracking:** to count your real monthly usage, enter the
          entity ID of a **lifetime** grid-import energy sensor (kWh, only
          ever goes up — e.g. a smart-meter / P1 reader sensor such as
          `sensor.your_grid_import_kwh`). Leave it empty to estimate usage
          instead: *household kWh per month (without the car)* spread
          evenly over the month, plus the car's home charging.

          **Started mid-month?** Type what your home has already used this
          month (from your meter or your provider's app) into **Used This
          Month So Far**. The count is corrected to that value right away
          and keeps counting up from there. It resets with the next month.

      - type: entities
        entities:
          - entity: input_text.tesla_grid_import_entity
            name: "Grid Import Sensor (entity ID)"
          - entity: input_number.tesla_household_monthly_kwh
            name: "Household kWh / Month (without car)"
          - entity: input_number.tesla_quota_used_this_month
            name: "Used This Month So Far (corrects the count)"

      - type: markdown
        content: |
          {% set mode = states('input_select.tesla_tariff_mode') %}
          {% set price = states('sensor.tesla_active_charging_price') %}
          {% set unit = 'Ft' if mode in ['Tariff A', 'Tariff D'] else states('sensor.tesla_currency_symbol') %}
          {% set d = states('sensor.tesla_d_tariff_price') %}
          {% set cheap = states('sensor.tesla_d_tariff_cheapest_hour') %}
          {% set src = state_attr('sensor.tesla_quota_usage_monthly', 'source') %}

          ### Live Tariff Status

          | | |
          |---|---|
          | **Active charging price** | {{ price ~ ' ' ~ unit ~ '/kWh' if price | is_number else '–' }} ({{ state_attr('sensor.tesla_active_charging_price', 'source') | default('–', true) }}) |
          | **Tariff A price now** | {{ states('sensor.tesla_tariff_a_current_price') }} Ft/kWh |
          | **Tariff D price now** | {{ d ~ ' Ft/kWh' if d | is_number else 'no data from dnap.hu right now' }} |
          | **Cheapest D hour (next 24 h)** | {{ as_timestamp(cheap) | timestamp_custom('%a %H:%M') if as_timestamp(cheap, none) is not none else '–' }} |
          | **Quota used this month** | {{ states('sensor.tesla_quota_usage_monthly') }} / {{ states('sensor.tesla_discounted_quota_monthly') }} kWh ({{ 'grid meter' if src == 'meter' else 'estimate' }}{{ ', corrected ' ~ ('%+.1f' | format(state_attr('sensor.tesla_quota_usage_monthly', 'correction_kwh') | float(0))) ~ ' kWh' if state_attr('sensor.tesla_quota_usage_monthly', 'correction_kwh') | float(0) != 0 else '' }}) |
          | **Quota remaining** | {{ states('sensor.tesla_quota_remaining_monthly') }} kWh |
          | **Discounted band** | {{ 'Active (36.21 Ft/kWh)' if is_state('binary_sensor.tesla_discount_band_active', 'on') else ('Used up' if is_state('input_boolean.tesla_use_discounted_quota', 'on') else 'Disabled') }} |
          | **Full auto charging** | {{ state_attr('sensor.tesla_auto_charge_plan', 'summary') | default('–', true) if is_state('input_boolean.tesla_full_auto_charging', 'on') else 'Off' }} |


          <sub>Tariff D prices: [dnap.hu](https://dnap.hu) (wholesale price:
          Bundesnetzagentur | SMARD.de), CC BY 4.0. On days dnap.hu has no
          data yet, Tariff D falls back to the above-quota A1 rate.</sub>

      # Smart Charging (off-peak window automation)
      - type: markdown
        content: |
          ## 🌙 Smart Charging

          When enabled, charging automatically starts once per day at the
          window start time below (if plugged in and below your target %),
          and stops if the window ends before the target is reached — so you
          don't accidentally pay peak rates. This fires **at most once per
          day** (one start, one stop) by design; it will not repeatedly
          toggle charging on/off.

          Works with every tariff. While **Full Auto Charging** (below) is
          on, this window is not used: Full auto decides when to charge.
          The Target Charge Limit applies to both.

      - type: custom:mushroom-entity-card
        entity: input_boolean.tesla_enable_smart_charging
        name: "Enable Smart Charging"
        icon: mdi:wand-magic-sparkles
        tap_action:
          action: toggle

      - type: custom:mushroom-number-card
        entity: input_number.tesla_target_charge_limit
        name: "Target Charge Limit"
        icon: mdi:battery-80
        min: 50
        max: 100
        step: 1

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: input_datetime.tesla_smart_charge_window_start
            name: "Window Start"
            icon: mdi:clock-start
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: input_datetime.tesla_smart_charge_window_end
            name: "Window End"
            icon: mdi:clock-end
            tap_action:
              action: more-info

      # Full Auto Charging (agents.md Section 22)
      - type: markdown
        content: |
          ## 🤖 Full Auto Charging

          When on, Home Assistant decides by itself when the car charges at
          home, with every tariff. Every 5 minutes it looks at:

          - how much energy the car needs to reach the **Target Charge
            Limit** (above) by the **Ready By** time (or an earlier *Next
            Departure*),
          - the price of every quarter hour until then (live Tariff D
            prices, the Tariff A rate, or the Default Electricity Rate),
          - the solar forecast (Forecast.Solar, which already includes the
            weather), corrected with what your panels produce right now,
          - what your exported solar is worth (**Solar Feed-in Price**).

          Then it charges the cheapest way: on solar surplus when there is
          enough (the current follows the sun, at least 5 A, topped up from
          the grid only while that's still cheaper than charging from the
          grid alone), and the rest in the cheapest grid block before the
          deadline. On a cloudy day it simply waits for the cheap block,
          e.g. at night. If prices are equal it charges as late as
          possible.

          - Below the **Always Charge Below Battery Level** it charges
            straight away; at or below the **Always Charge Below Price**
            too.
          - It starts or stops at most once per 30 minutes and changes the
            amps at most every 5 minutes, so charging never flaps.
          - When the car starts charging by itself after you plug in, Full
            auto takes that session over (it may pause it until the cheap
            block).
          - **Charge now** charges straight away to the car's own limit
            until you unplug. **Stop charging** (Battery tab) pauses Full
            auto until you unplug.

          Turn off *Scheduled Charging* in the Tesla app, or it will fight
          Full auto. Solar and cost figures are estimates.

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.tesla_full_auto_charging
            name: "Full Auto Charging"
            icon: mdi:robot-outline
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: script.tesla_charge_now
            name: "Charge now"
            icon: mdi:flash-alert
            secondary_info: none
            tap_action:
              action: call-service
              service: script.tesla_charge_now
              confirmation:
                text: "Charge straight away, whatever the price, until the car is unplugged?"

      - type: markdown
        content: |
          {% set p = 'sensor.tesla_auto_charge_plan' %}
          {% set mode = states('input_select.tesla_tariff_mode') %}
          {% set unit = 'Ft' if mode in ['Tariff A', 'Tariff D'] else states('sensor.tesla_currency_symbol') %}
          {% macro num(v, d=1) %}{{ (v | float) | round(d) if v | is_number else '–' }}{% endmacro %}
          {% set bs = state_attr(p, 'block_start') %}
          {% set be = state_attr(p, 'block_end') %}

          ### Plan

          {% if is_state('input_boolean.tesla_full_auto_charging', 'on') %}
          **{{ state_attr(p, 'summary') | default('Working out a plan…', true) }}**

          | | |
          |---|---|
          | **Energy needed** | {{ num(state_attr(p, 'need_kwh')) }} kWh (~{{ num(state_attr(p, 'solar_kwh')) }} kWh from solar) |
          | **Grid block** | {{ bs ~ ' – ' ~ be if bs and be else '–' }} |
          | **Block price (with solar)** | {{ num(state_attr(p, 'avg_effective_price')) }} {{ unit }}/kWh |
          | **Grid only would be** | {{ num(state_attr(p, 'grid_only_price')) }} {{ unit }}/kWh |
          | **Estimated cost** | {{ num(state_attr(p, 'est_cost'), 0) }} {{ unit }} |
          | **Price now** | {{ num(state_attr(p, 'price_now')) }} {{ unit }}/kWh |
          | **Solar surplus now** | {{ num(state_attr(p, 'surplus_kw'), 2) }} kW |
          | **Ready by** | {{ state_attr(p, 'deadline') | default('–', true) }} |
          | **Session** | {{ 'Charge now (until unplugged)' if is_state('input_boolean.tesla_charge_now_override', 'on') else ('Paused until unplugged' if is_state('input_boolean.tesla_auto_charge_paused', 'on') else ('Managed by Full auto' if is_state('input_boolean.tesla_auto_charge_owned', 'on') else '–')) }} |
          {% else %}
          Full auto is off. Charging follows Smart Charging (above) or the
          car's own settings.
          {% endif %}

      - type: entities
        title: Full Auto Settings
        entities:
          - entity: input_datetime.tesla_charge_ready_by
            name: "Ready By (every day)"
          - entity: input_number.tesla_auto_charge_min_soc
            name: "Always Charge Below Battery Level"
          - entity: input_number.tesla_auto_charge_cheap_price
            name: "Always Charge Below Price (-50 = never)"
          - entity: input_number.tesla_home_charger_max_amps
            name: "Home Charger Max Current"
          - entity: input_select.tesla_home_charger_phases
            name: "Home Charger Phases"
          - entity: input_number.tesla_solar_feed_in_price
            name: "Solar Feed-in Price"

      - type: markdown
        content: |
          **Solar (optional):** enter entity IDs from Developer Tools >
          States. *Grid Power* must be positive while importing and
          negative while exporting (W or kW). *Solar Power* is your
          inverter's live PV output. *Solar Forecast* is Forecast.Solar's
          "Estimated power production - now" sensor (e.g.
          `sensor.power_production_now`). Leave them empty without solar;
          Full auto then plans on prices only.

      - type: entities
        entities:
          - entity: input_text.tesla_grid_power_entity
            name: "Grid Power Sensor (entity ID)"
          - entity: input_text.tesla_pv_power_entity
            name: "Solar Power Sensor (entity ID)"
          - entity: input_text.tesla_solar_forecast_entity
            name: "Solar Forecast Sensor (entity ID)"

