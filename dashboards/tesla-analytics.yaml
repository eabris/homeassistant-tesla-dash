title: Tesla Analytics
icon: mdi:chart-line

# Shared custom:button-card templates (used with `template:` + `variables:`).
button_card_templates:
  # History tab: the same 5 rows for every period (variables.period = today,
  # week, days7, month or prev), so the cards line up on desktop.
  tesla_period_summary:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    custom_fields:
      block: |
        [[[
          const st = (id) => states[id]?.state;
          const val = (id) => { const v = parseFloat(st(id)); return isNaN(v) ? null : v; };
          const code = st('input_select.tesla_currency') || 'HUF';
          const loc = st('sensor.tesla_currency_locale') || 'hu-HU';
          const money = (v) => {
            if (v === null) return '–';
            try {
              return new Intl.NumberFormat(loc, { style: 'currency', currency: code, maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(Math.round(v));
            } catch (e) {
              return `${Math.round(v)} ${st('sensor.tesla_currency_symbol') || ''}`;
            }
          };
          const isMi = (st('input_select.tesla_unit_system') || 'Metric (km, °C, bar)') !== 'Metric (km, °C, bar)';
          const dist = (km, dec) => km === null ? '–' : `${(isMi ? km * 0.621371 : km).toFixed(dec)} ${isMi ? 'mi' : 'km'}`;
          const kwh = (v) => v === null ? '–' : `${v.toFixed(1)} kWh`;
          const dur = (min) => {
            if (min === null) return '';
            const m = Math.round(min);
            return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
          };
          const now = new Date();
          const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1).toLocaleString('en-GB', { month: 'long' });
          const P = {
            today: { title: 'TODAY', dist: 'sensor.tesla_daily_distance', dec: 1,
              energy: 'sensor.tesla_daily_charging_energy', cost: 'sensor.tesla_daily_electric_cost',
              fuel: 'sensor.tesla_daily_fuel_cost_equivalent',
              driveMin: 'sensor.tesla_driving_time_today', chargeMin: 'sensor.tesla_charging_time_today' },
            week: { title: 'THIS WEEK', hint: 'since Monday', dist: 'sensor.tesla_weekly_distance', dec: 0,
              energy: 'sensor.tesla_weekly_charging_energy', cost: 'sensor.tesla_weekly_electric_cost',
              fuel: 'sensor.tesla_weekly_fuel_cost' },
            days7: { title: 'LAST 7 DAYS', hint: 'rolling', dist: 'sensor.tesla_distance_7d_rolling', dec: 0,
              energy: 'sensor.tesla_charging_energy_7d_rolling', cost: 'sensor.tesla_electric_cost_7d_rolling',
              fuel: 'sensor.tesla_fuel_cost_7d_rolling_equivalent',
              driveMin: 'sensor.tesla_driving_time_7d', chargeMin: 'sensor.tesla_charging_time_7d' },
            month: { title: 'THIS MONTH', hint: 'since the 1st', dist: 'sensor.tesla_monthly_distance', dec: 0,
              energy: 'sensor.tesla_monthly_charging_energy', cost: 'sensor.tesla_monthly_electric_cost',
              fuel: 'sensor.tesla_monthly_fuel_cost', driveHours: 'sensor.tesla_monthly_driving_time' },
            prev: { title: 'LAST MONTH', hint: lastMonth, dist: 'sensor.tesla_previous_month_distance', dec: 0,
              energy: 'sensor.tesla_previous_month_charging_energy', cost: 'sensor.tesla_previous_month_electric_cost',
              fuel: 'sensor.tesla_previous_month_fuel_cost' },
          }[variables.period];
          if (!P) return '';
          const driveMin = P.driveMin ? val(P.driveMin) : (P.driveHours && val(P.driveHours) !== null ? val(P.driveHours) * 60 : null);
          const chargeMin = P.chargeMin ? val(P.chargeMin) : null;
          const cost = val(P.cost);
          const fuel = val(P.fuel);
          const saved = cost !== null && fuel !== null ? fuel - cost : null;
          const row = (icon, label, value, sub, color = '#fff') =>
            `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.07)">
              <span style="font-size:18px;width:22px;text-align:center;flex-shrink:0">${icon}</span>
              <div style="flex:1;min-width:0">
                <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                <div style="color:${color};font-size:15px;font-weight:700">${value}${sub ? `<span style="color:#aaa;font-size:11px;font-weight:400">&nbsp;&nbsp;${sub}</span>` : ''}</div>
              </div>
            </div>`;
          const hint = P.hint ? ` <span style="color:#666;font-size:10px;font-weight:400;letter-spacing:0.5px">(${P.hint})</span>` : '';
          return `<div style="width:100%;text-align:left">
            <div style="color:#ccc;font-size:12px;font-weight:700;letter-spacing:1.5px;padding-bottom:4px">📅 ${P.title}${hint}</div>
            ${row('🚗', 'DISTANCE', dist(val(P.dist), P.dec), driveMin ? `driving ${dur(driveMin)}` : '')}
            ${row('⚡', 'ENERGY CHARGED', kwh(val(P.energy)), chargeMin ? `charging ${dur(chargeMin)}` : '')}
            ${row('💰', 'CHARGING COST', money(cost), '')}
            ${row('⛽', 'A FUEL CAR WOULD COST', money(fuel), '', '#ccc')}
            ${saved === null || saved >= 0
              ? row('✅', 'YOU SAVED', money(saved), '', '#4CAF50')
              : row('💸', 'CHARGING COST MORE BY', money(-saved), '', '#F44336')}
          </div>`;
        ]]]
    styles:
      card:
        - background-color: rgba(28, 28, 30, 0.95)
        - border-radius: 16px
        - padding: 16px 20px
      grid:
        - grid-template-areas: '"block"'
        - grid-template-columns: 1fr
      custom_fields:
        block:
          - width: 100%

views:
  # ========== VIEW 1: HISTORY ==========
  # One card per period (button_card_templates: tesla_period_summary), each
  # in its own section: 1 column on mobile, up to 3 side by side on desktop.
  - title: History
    path: history
    icon: mdi:history
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_period_summary
            variables:
              period: today
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_period_summary
            variables:
              period: week
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_period_summary
            variables:
              period: days7
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_period_summary
            variables:
              period: month
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_period_summary
            variables:
              period: prev

  # ========== VIEW 2: DRIVING ANALYTICS ==========
  - title: Driving
    path: driving
    icon: mdi:car
    cards:

      # ── 1. DISTANCE ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Distance
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Distance per day, last 30 days. \"Per day\" = this month so far ÷ days."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_monthly_distance
            name: THIS MONTH
            color: '#FF9F0A'
            unit: " km"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_average_daily_distance
            name: PER DAY (AVG)
            color: '#1E88E5'
            unit: " km"
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_distance
            name: Distance
            type: column
            color: '#1E88E5'
            unit: " km"
            float_precision: 1
            transform: "return x > 500 ? null : x;"
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 2. ENERGY USED ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Energy used
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Energy the car used while driving, per day, last 30 days."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_monthly_energy_consumed
            name: THIS MONTH
            color: '#FF9F0A'
            unit: " kWh"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_average_daily_energy_consumed
            name: PER DAY (AVG)
            color: '#1E88E5'
            unit: " kWh"
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_energy_consumed
            name: Energy used
            type: column
            color: '#1E88E5'
            unit: " kWh"
            float_precision: 1
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 3. ELECTRIC COST ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Electric cost
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "What charging cost, per day, last 30 days. Per km = this month's average."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_monthly_electric_cost
            name: THIS MONTH
            color: '#FF9F0A'
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_electric_cost_per_km
            name: PER KM
            color: '#1E88E5'
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_electric_cost
            name: Charging cost
            type: column
            color: '#FF9F0A'
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 4. FUEL COST ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Fuel cost
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "What the same driving would cost in a petrol/diesel car, per day, last 30 days."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_monthly_fuel_cost
            name: THIS MONTH
            color: '#FF9F0A'
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_fuel_cost_per_km
            name: PER KM
            color: '#1E88E5'
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_fuel_cost_equivalent
            name: Fuel would cost
            type: column
            color: '#1E88E5'
            float_precision: 0
            # Outlier guard derived from the configured fuel price (100 litres in a day).
            transform: >
              return x > (hass.states['input_number.comparison_fuel_price_per_liter']?.state * 100 || 25000) ? null : x;
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 5. DURATION ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Duration
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Time spent driving, per day, last 30 days (minutes)."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          yaxis:
            title:
              text: "min"
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_monthly_driving_time
            name: THIS MONTH
            color: '#FF9F0A'
            unit: " h"
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_average_daily_driving_time
            name: PER DAY (AVG)
            color: '#1E88E5'
            unit: " min"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_driving_time_today
            name: Driving time
            type: column
            color: '#1E88E5'
            unit: " min"
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 6. SPEED ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Speed
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Average and top speed per day, last 30 days. Monthly average = distance ÷ time in Drive."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          yaxis:
            title:
              text: "km/h"
          dataLabels:
            enabled: false
          legend:
            show: true
            position: bottom
        series:
          - entity: sensor.tesla_average_speed_this_month
            name: AVG THIS MONTH
            color: '#FF9F0A'
            unit: " km/h"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_top_speed_this_month
            name: TOP THIS MONTH
            color: '#1E88E5'
            unit: " km/h"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.vehicle_speed
            name: Average
            type: column
            color: '#90CAF9'
            unit: " km/h"
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: avg
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'
          - entity: sensor.vehicle_speed
            name: Top
            type: column
            color: '#1565C0'
            unit: " km/h"
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 7. TOTAL DRIVES ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Drives
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Number of drives per day, last 30 days."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          yaxis:
            min: 0
            forceNiceScale: true
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_drive_sessions_month
            name: THIS MONTH
            color: '#FF9F0A'
            unit: " drives"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_average_daily_drives
            name: PER DAY (AVG)
            color: '#1E88E5'
            unit: " drives"
            float_precision: 1
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_drive_sessions_today
            name: Drives
            type: column
            color: '#1E88E5'
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: max
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 8. ENERGY EFFICIENCY ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Energy efficiency
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Energy used per km (lower is better). Average = this month and last month. Bars: each driving day."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          yaxis:
            title:
              text: "Wh/km"
            min: 0
          dataLabels:
            enabled: false
        series:
          - entity: sensor.tesla_efficiency_wh_per_km
            name: AVERAGE
            color: '#FF9F0A'
            unit: " Wh/km"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_last_driving_day_efficiency
            name: LAST DRIVING DAY
            color: '#1E88E5'
            unit: " Wh/km"
            float_precision: 0
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_efficiency_wh_per_km
            name: Efficiency
            type: column
            color: '#1E88E5'
            unit: " Wh/km"
            float_precision: 0
            show:
              in_header: false
              legend_value: false
            group_by:
              func: last
              duration: 1d
              # Days without data stay empty instead of repeating the day before.
              fill: 'null'

      # ── 9. DISTANCE · YEARLY ──
      - type: custom:apexcharts-card
        graph_span: 1y
        span:
          end: month
        cache: true
        header:
          show: true
          title: "Distance · Yearly"
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Distance driven per month, last 12 months."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                year: "yyyy"
                month: "MMM"
          tooltip:
            x:
              format: "MMMM yyyy"
          dataLabels:
            enabled: false
          colors:
            - '#FF9F0A'
            - '#1E88E5'
            - '#1E88E5'
        series:
          - entity: sensor.tesla_yearly_distance
            name: THIS YEAR
            unit: " km"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_distance
            name: THIS MONTH
            unit: " km"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_distance
            name: Distance
            type: column
            color: '#1E88E5'
            statistics:
              type: max
              period: month
            # Drops impossible months (> 20,000 km, e.g. the odometer counted
            # as one month's distance while the baseline was 0).
            transform: "return x > 20000 ? null : x;"
            show:
              in_header: false
              legend_value: false

      # ── 10. ENERGY USED · YEARLY ──
      - type: custom:apexcharts-card
        graph_span: 1y
        span:
          end: month
        cache: true
        header:
          show: true
          title: "Energy used · Yearly"
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Energy consumed while driving per month, last 12 months."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                year: "yyyy"
                month: "MMM"
          tooltip:
            x:
              format: "MMMM yyyy"
          dataLabels:
            enabled: false
          colors:
            - '#FF9F0A'
            - '#1E88E5'
            - '#1E88E5'
        series:
          - entity: sensor.tesla_yearly_energy_consumed
            name: THIS YEAR
            unit: " kWh"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_energy_consumed
            name: THIS MONTH
            unit: " kWh"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_energy_consumed
            name: Energy used
            type: column
            color: '#1E88E5'
            statistics:
              type: state
              period: month
            show:
              in_header: false
              legend_value: false

      # ── 11. ELECTRIC COST · YEARLY ──
      - type: custom:apexcharts-card
        graph_span: 1y
        span:
          end: month
        cache: true
        header:
          show: true
          title: "Electric cost · Yearly"
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "Charging cost per month, last 12 months."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                year: "yyyy"
                month: "MMM"
          tooltip:
            x:
              format: "MMMM yyyy"
          dataLabels:
            enabled: false
          colors:
            - '#FF9F0A'
            - '#1E88E5'
            - '#FF9F0A'
        series:
          - entity: sensor.tesla_yearly_electric_cost
            name: THIS YEAR
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_electric_cost
            name: THIS MONTH
            show:
              in_chart: false
              legend_value: true
          # Monthly charged kWh (utility meter, has long-term statistics from
          # the start) x this month's average price (Tesla Monthly Electric
          # Cost / charged kWh). Past months use that price (an estimate).
          - entity: sensor.tesla_monthly_charging_energy
            name: Electric cost
            type: column
            color: '#FF9F0A'
            unit: " Ft"
            float_precision: 0
            statistics:
              type: state
              period: month
            transform: >
              const st = hass.states;
              const n = (id, d) => { const v = parseFloat(st[id]?.state); return isNaN(v) ? d : v; };
              const e = n('sensor.tesla_monthly_charging_energy', 0);
              const c = n('sensor.tesla_monthly_electric_cost', 0);
              const rate = e >= 5 ? c / e : n('sensor.tesla_active_charging_price', n('input_number.tesla_default_electricity_cost', 60));
              return x * rate;
            show:
              in_header: false
              legend_value: false

      # ── 12. FUEL COST · YEARLY ──
      - type: custom:apexcharts-card
        graph_span: 1y
        span:
          end: month
        cache: true
        header:
          show: true
          title: "Fuel cost · Yearly"
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: "What the same distance would cost with fuel, per month, last 12 months."
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                year: "yyyy"
                month: "MMM"
          tooltip:
            x:
              format: "MMMM yyyy"
          dataLabels:
            enabled: false
          colors:
            - '#FF9F0A'
            - '#1E88E5'
            - '#1E88E5'
        series:
          - entity: sensor.tesla_yearly_fuel_cost
            name: THIS YEAR
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_monthly_fuel_cost
            name: THIS MONTH
            show:
              in_chart: false
              legend_value: true
          # Monthly distance x today's fuel cost per km (the same formula as
          # sensor.tesla_monthly_fuel_cost, which has no older statistics).
          - entity: sensor.tesla_monthly_distance
            name: Fuel cost
            type: column
            color: '#1E88E5'
            unit: " Ft"
            float_precision: 0
            statistics:
              type: max
              period: month
            transform: >
              if (x > 20000) return null;
              const f = parseFloat(hass.states['sensor.tesla_fuel_cost_per_km']?.state);
              return isNaN(f) ? null : x * f;
            show:
              in_header: false
              legend_value: false

