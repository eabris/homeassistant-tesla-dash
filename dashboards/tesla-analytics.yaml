  # ========== VIEW 2: DRIVING ANALYTICS ==========
  - title: Driving
    path: driving
    icon: mdi:car
    cards:

      # ── 1. DISTANCE ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Distance
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: The total distance driven.
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
          colors:
            - '#1E88E5'
        series:
          - entity: sensor.tesla_monthly_distance
            name: TOTAL
            unit: " km"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_distance
            name: km
            type: column
            show:
              legend_value: false
              in_header: false
            transform: "return x > 500 ? null : x;"
            group_by:
              func: max
              duration: 1d

      # ── 2. ENERGY USED ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Energy used
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: The total energy consumed while driving.
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
          colors:
            - '#1E88E5'
        series:
          - entity: sensor.tesla_monthly_energy_consumed
            name: TOTAL
            unit: " kWh"
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_energy_consumed
            name: DAILY
            type: column
            show:
              legend_value: false
            group_by:
              func: max
              duration: 1d

      # ── 3. ELECTRIC COST ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Electric cost
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: Based on the charging efficiency and cost of this period.
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
          colors:
            - '#FF9F0A'
            - '#FF9F0A'
            - '#1E88E5'
        series:
          - entity: sensor.tesla_monthly_electric_cost
            name: TOTAL
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_electric_cost_per_km
            name: PER KILOMETER
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_electric_cost
            name: Cost
            type: column
            show:
              legend_value: false
              in_header: false
            group_by:
              func: max
              duration: 1d

      # ── 4. FUEL COST ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Fuel cost
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: The total cost of driving if fuel was used.
            offsetY: 0
            style:
              fontSize: "12px"
              color: "#888888"
          chart:
            height: 260
            foreColor: '#7F7F7F'
            toolbar:
              show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          grid:
            borderColor: '#2D2D2D'
            strokeDashArray: 4
          xaxis:
            type: datetime
            labels:
              datetimeFormatter:
                day: "MMM d"
          dataLabels:
            enabled: false
          colors:
            - '#1E88E5'
        series:
          - entity: sensor.tesla_monthly_fuel_cost
            name: TOTAL
            show:
              in_chart: false
              legend_value: true
          - entity: sensor.tesla_daily_fuel_cost_equivalent
            name: DAILY
            type: column
            show:
              legend_value: false
            # Outlier guard: was a hardcoded `x > 25000` which silently assumed
            # HUF pricing. Derived instead from the user's actual configured
            # fuel price (input_number.comparison_fuel_price_per_liter), so it
            # scales correctly for any currency: caps at a 100-litre-equivalent
            # single day, which is already an implausible amount of driving.
            transform: >
              return x > (hass.states['input_number.comparison_fuel_price_per_liter']?.state * 100 || 25000) ? null : x;
            group_by:
              func: max
              duration: 1d

      # ── 5. DURATION ──
      - type: custom:apexcharts-card
        graph_span: 30d
        cache: true
        header:
          show: true
          title: Duration
          show_states: true
          colorize_states: true
        apex_config:
          subtitle:
            text: The total time spent driving.
            offsetY: 0
            style:
              fontSize: "12px"
