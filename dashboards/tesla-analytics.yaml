                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                block:
                  - width: 100%

          # PREVIOUS MONTH (last complete calendar month; distance snapshot +
          # utility_meter last_period both populate on the 1st of each month --
          # will read "–"/Ft0 until the first rollover after this card was added)
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              block: |
                [[[
                  const fmt = (raw, unit, dec=1) => {
                    const v = parseFloat(String(raw || '0'));
                    return isNaN(v) || v <= 0 ? '–' : `${v.toFixed(dec)} ${unit}`;
                  };
                  const currencySymbol = states['sensor.tesla_currency_symbol']?.state || 'Ft';
                  const currencyLocale = states['sensor.tesla_currency_locale']?.state || 'hu-HU';
                  const ftm = (raw) => {
                    const v = parseFloat(String(raw || '0')) || 0;
                    return v <= 0 ? currencySymbol + '0' : currencySymbol + Math.round(v).toLocaleString(currencyLocale);
                  };
                  const row = (icon, label, val, sub) =>
                    `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.07)">
                      <span style="font-size:18px;width:22px;text-align:center;flex-shrink:0">${icon}</span>
                      <div style="flex:1;min-width:0">
                        <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                        <div style="color:#fff;font-size:15px;font-weight:700">${val}${sub ? `<span style="color:#aaa;font-size:11px;font-weight:400">  ${sub}</span>` : ''}</div>
                      </div>
                    </div>`;
                  const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                  const isMi = unitSys !== 'Metric (km, °C, bar)';
                  const distUnit = isMi ? 'mi' : 'km';
                  const distKm = parseFloat(states['sensor.tesla_previous_month_distance']?.state || '0') || 0;
                  const dist = fmt(isMi ? distKm * 0.621371 : distKm, distUnit, 0);
                  const energy = fmt(states['sensor.tesla_previous_month_charging_energy']?.state, 'kWh', 2);
                  const elecCost = ftm(states['sensor.tesla_previous_month_electric_cost']?.state);
                  const fuelEq = ftm(states['sensor.tesla_previous_month_fuel_cost']?.state);
                  const elecV = parseFloat(states['sensor.tesla_previous_month_electric_cost']?.state || '0') || 0;
                  const fuelV = parseFloat(states['sensor.tesla_previous_month_fuel_cost']?.state || '0') || 0;
                  const saved = Math.max(0, fuelV - elecV);
                  return `<div style="width:100%;text-align:left">
                    <div style="color:#ccc;font-size:12px;font-weight:700;letter-spacing:1.5px;padding-bottom:4px">📅 PREVIOUS MONTH <span style="color:#666;font-size:10px;font-weight:400">(updates on the 1st)</span></div>
                    ${row('🚗', 'DISTANCE', dist, '')}
                    ${row('⚡', 'ENERGY CHARGED', energy, '')}
                    ${row('💰', 'ELECTRIC COST', elecCost, `vs fuel ${fuelEq}`)}
