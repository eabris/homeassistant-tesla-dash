            max: 2000
            step: 1

      # Link to the Advanced sub-page
      - type: custom:button-card
        icon: mdi:wrench-cog
        name: "Advanced"
        label: "API token, unit details, rate notes"
        show_label: true
        tap_action:
          action: navigate
          navigation_path: /tesla-analytics/settings-advanced
        styles:
          card:
            - padding: 14px 16px
          grid:
            - grid-template-areas: '"i n" "i l"'
            - grid-template-columns: 40px 1fr
            - column-gap: 10px
            - align-items: center
          icon:
            - width: 22px
