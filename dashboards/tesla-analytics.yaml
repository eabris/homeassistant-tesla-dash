  # ========== VIEW 4: SETTINGS ==========
  # Each topic is one vertical-stack, so the heading always stays with its
  # controls on desktop (masonry used to split them into different columns).
  # Notes-only and maintenance items live on the Advanced sub-page below.
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:

      # Currency & units
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 💱 Currency & 📏 Units

              Pick the currency you pay in (type every price on this page in it) and how
              distance, speed, tire pressure and temperature are shown. Energy always
              stays in kWh / kW. The Driving and Charging charts always use km.
          - type: custom:mushroom-select-card
            entity: input_select.tesla_currency
            name: "Currency"
            icon: mdi:cash-multiple
          - type: custom:mushroom-select-card
            entity: input_select.tesla_unit_system
            name: "Unit System"
            icon: mdi:ruler-square-compass

      # Wheels & tires
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 🛞 Wheels & Tires

              Pick your wheel size: the recommended cold pressure and the range
              adjustment fill in automatically. Check the pressure against the sticker
              in the driver's door frame and change it if it's different.

              **Range adjustment:** bigger wheels lower the real-world range. This % is
              taken off Tesla's rated range to show the "≈ real-world" range.
          - type: custom:mushroom-select-card
            entity: input_select.tesla_wheel_size
            name: "Wheel Size"
            icon: mdi:tire
          - type: custom:mushroom-number-card
            entity: input_number.tesla_recommended_tire_pressure
            name: "Recommended Cold Pressure"
            icon: mdi:gauge
            min: 1.5
            max: 3.8
            step: 0.05
          - type: custom:mushroom-number-card
            entity: input_number.tesla_wheel_range_adjustment_pct
            name: "Wheel Range Adjustment"
            icon: mdi:speedometer
            min: 0
            max: 25
            step: 0.5

      # Electricity price + Hungarian tariff (agents.md Section 21)
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## ⚡ Electricity Price

              **Default rate:** price per kWh when no tariff is selected, and for
              charging away from home (except your Work zone, below).

              **Tariff (Hungary):**
              - **Off**: always the default rate.
              - **Tariff A**: 36.21 Ft/kWh within your discounted quota (2,523 kWh a
                year, ~207 kWh a month), then the above-quota A1 rate (~70 Ft/kWh).
              - **Tariff D**: 36.21 Ft/kWh within the quota, then the live
                quarter-hour price from dnap.hu (it can even be negative).

              Keep the currency on HUF for Tariff A or D. Each kWh is priced at the
              moment it's charged; changing the tariff later doesn't change past costs.
          - type: custom:mushroom-number-card
            entity: input_number.tesla_default_electricity_cost
            name: "Default Electricity Rate"
            icon: mdi:cash
            min: 0
            max: 200
            step: 0.5
          - type: custom:mushroom-select-card
            entity: input_select.tesla_tariff_mode
            name: "Tariff"
            icon: mdi:transmission-tower
          - type: custom:mushroom-entity-card
            entity: input_boolean.tesla_use_discounted_quota
            name: "Use Discounted Quota (rezsicsökkentett sáv)"
            icon: mdi:sale
            tap_action:
              action: toggle
          - type: markdown
            content: |
              **Quota tracking (optional):** enter a lifetime grid-import energy
              sensor (kWh, only goes up) to count your real usage. Leave it empty to
              estimate it from your household kWh per month plus home charging.
              Started mid-month? Type what you've used so far this month into
              **Used This Month So Far**.
          - type: entities
            entities:
              - entity: input_text.tesla_grid_import_entity
                name: "Grid Import Sensor (entity ID)"
              - entity: input_number.tesla_household_monthly_kwh
                name: "Household kWh / Month (without car)"
              - entity: input_number.tesla_quota_used_this_month
                name: "Used This Month So Far (corrects the count)"
          - type: markdown
            content: |
              **Charging at another place (Work):** if the car charges
              somewhere else on someone else's electricity (e.g. a few houses
              away), create a small zone there in Home Assistant: **Settings →
              Areas, labels & zones → Zones → Add zone**, radius 15–20 m (smaller
              than your Home zone, so it wins where they overlap). Enter its
              entity ID and that place's price below. Charging inside it is
              priced at this rate, and Full auto and your home quota ignore it.
              Anywhere else away from home uses the Default rate.
          - type: entities
            entities:
              - entity: input_text.tesla_rate_work_zone
                name: "Work Zone (entity ID, e.g. zone.work)"
              - entity: input_number.tesla_rate_work_per_kwh
                name: "Work Rate (per kWh)"
          - type: markdown
            content: |
              {% set mode = states('input_select.tesla_tariff_mode') %}
              {% set price = states('sensor.tesla_active_charging_price') %}
              {% set unit = 'Ft' if mode in ['Tariff A', 'Tariff D'] else states('sensor.tesla_currency_symbol') %}
              {% set d = states('sensor.tesla_d_tariff_price') %}
              {% set cheap = states('sensor.tesla_d_tariff_cheapest_hour') %}
              {% set src = state_attr('sensor.tesla_quota_usage_monthly', 'source') %}

              ### Live Tariff Status

              | | |
              |---|---|
              | **Home charging price** | {{ price ~ ' ' ~ unit ~ '/kWh' if price | is_number else '–' }} ({{ state_attr('sensor.tesla_active_charging_price', 'source') | default('–', true) }}) |
              | **Price where the car is now** | {% set lp = states('sensor.tesla_location_charging_price') %}{% set loc = state_attr('sensor.tesla_location_charging_price', 'location') %}{{ lp ~ ' ' ~ unit ~ '/kWh' if lp | is_number else '–' }} ({{ {'home': 'at home, tariff', 'work': 'Work zone, Work rate', 'away': 'away, default rate'}.get(loc, '–') }}) |
              | **Tariff A price now** | {{ states('sensor.tesla_tariff_a_current_price') }} Ft/kWh |
              | **Tariff D price now** | {{ d ~ ' Ft/kWh' if d | is_number else 'no data from dnap.hu right now' }} |
              | **Cheapest D hour (next 24 h)** | {{ as_timestamp(cheap) | timestamp_custom('%a %H:%M') if as_timestamp(cheap, none) is not none else '–' }} |
              | **Quota used this month** | {{ states('sensor.tesla_quota_usage_monthly') }} / {{ states('sensor.tesla_discounted_quota_monthly') }} kWh ({{ 'grid meter' if src == 'meter' else 'estimate' }}{{ ', corrected ' ~ ('%+.1f' | format(state_attr('sensor.tesla_quota_usage_monthly', 'correction_kwh') | float(0))) ~ ' kWh' if state_attr('sensor.tesla_quota_usage_monthly', 'correction_kwh') | float(0) != 0 else '' }}) |
              | **Quota remaining** | {{ states('sensor.tesla_quota_remaining_monthly') }} kWh |
              | **Discounted band** | {{ 'Active (36.21 Ft/kWh)' if is_state('binary_sensor.tesla_discount_band_active', 'on') else ('Used up' if is_state('input_boolean.tesla_use_discounted_quota', 'on') else 'Disabled') }} |
              | **Full auto charging** | {{ state_attr('sensor.tesla_auto_charge_plan', 'summary') | default('–', true) if is_state('input_boolean.tesla_full_auto_charging', 'on') else 'Off' }} |


              <sub>Tariff D prices: [dnap.hu](https://dnap.hu) (wholesale price:
              Bundesnetzagentur | SMARD.de), CC BY 4.0. On days dnap.hu has no
              data yet, Tariff D falls back to the above-quota A1 rate.</sub>

      # Smart Charging (fixed time window)
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 🌙 Smart Charging (time window)

              Charges inside a fixed time window (e.g. a cheap night rate), up to the
              **Target Charge Limit**. It starts at most once and stops at most once a
              day, so charging never switches on and off. Not used while **Full Auto
              Charging** is on; the Target Charge Limit applies to both.
          - type: custom:mushroom-entity-card
            entity: input_boolean.tesla_enable_smart_charging
            name: "Enable Smart Charging"
            icon: mdi:wand-magic-sparkles
            tap_action:
              action: toggle
          - type: custom:mushroom-number-card
            entity: input_number.tesla_target_charge_limit
            name: "Target Charge Limit"
            icon: mdi:battery-80
            min: 50
            max: 100
            step: 1
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: input_datetime.tesla_smart_charge_window_start
                name: "Window Start"
                icon: mdi:clock-start
                tap_action:
                  action: more-info
              - type: custom:mushroom-entity-card
                entity: input_datetime.tesla_smart_charge_window_end
                name: "Window End"
                icon: mdi:clock-end
                tap_action:
                  action: more-info

      # Full Auto Charging (agents.md Section 22)
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 🤖 Full Auto Charging

              When on, Home Assistant picks when to charge at home: it reaches the
              **Target Charge Limit** by the **Ready By** time at the lowest cost, using
              the electricity price, your solar surplus and the solar forecast.

              - Below **Always Charge Below Battery Level** it charges right away; at or
                below **Always Charge Below Price** too.
              - It starts or stops at most once per 30 minutes.
              - **Charge now** charges right away until you unplug. **Stop charging**
                (Battery tab) pauses Full auto until you unplug.

              Turn off *Scheduled Charging* in the Tesla app, or the two will fight.
              Solar and cost figures are estimates.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: input_boolean.tesla_full_auto_charging
                name: "Full Auto Charging"
                icon: mdi:robot-outline
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: script.tesla_charge_now
                name: "Charge now"
                icon: mdi:flash-alert
                secondary_info: none
                tap_action:
                  action: call-service
                  service: script.tesla_charge_now
                  confirmation:
                    text: "Charge straight away, whatever the price, until the car is unplugged?"
          - type: markdown
            content: |
              {% set p = 'sensor.tesla_auto_charge_plan' %}
              {% set mode = states('input_select.tesla_tariff_mode') %}
              {% set unit = 'Ft' if mode in ['Tariff A', 'Tariff D'] else states('sensor.tesla_currency_symbol') %}
              {% macro num(v, d=1) %}{{ (v | float) | round(d) if v | is_number else '–' }}{% endmacro %}
              {% set bs = state_attr(p, 'block_start') %}
              {% set be = state_attr(p, 'block_end') %}

              ### Plan

              {% if is_state('input_boolean.tesla_full_auto_charging', 'on') %}
              **{{ state_attr(p, 'summary') | default('Working out a plan…', true) }}**

              | | |
              |---|---|
              | **Energy needed** | {{ num(state_attr(p, 'need_kwh')) }} kWh (~{{ num(state_attr(p, 'solar_kwh')) }} kWh from solar) |
              | **Grid block** | {{ bs ~ ' – ' ~ be if bs and be else '–' }} |
              | **Block price (with solar)** | {{ num(state_attr(p, 'avg_effective_price')) }} {{ unit }}/kWh |
              | **Grid only would be** | {{ num(state_attr(p, 'grid_only_price')) }} {{ unit }}/kWh |
              | **Estimated cost** | {{ num(state_attr(p, 'est_cost'), 0) }} {{ unit }} |
              | **Price now** | {{ num(state_attr(p, 'price_now')) }} {{ unit }}/kWh |
              | **Solar surplus now** | {{ num(state_attr(p, 'surplus_kw'), 2) }} kW |
              | **Ready by** | {{ state_attr(p, 'deadline') | default('–', true) }} |
              | **Session** | {{ 'Charge now (until unplugged)' if is_state('input_boolean.tesla_charge_now_override', 'on') else ('Paused until unplugged' if is_state('input_boolean.tesla_auto_charge_paused', 'on') else ('Managed by Full auto' if is_state('input_boolean.tesla_auto_charge_owned', 'on') else '–')) }} |
              {% else %}
              Full auto is off. Charging follows Smart Charging (above) or the
              car's own settings.
              {% endif %}
          - type: entities
            title: Full Auto Settings
            entities:
              - entity: input_datetime.tesla_charge_ready_by
                name: "Ready By (every day)"
              - entity: input_number.tesla_auto_charge_min_soc
                name: "Always Charge Below Battery Level"
              - entity: input_number.tesla_auto_charge_cheap_price
                name: "Always Charge Below Price (-50 = never)"
              - entity: input_number.tesla_home_charger_max_amps
                name: "Home Charger Max Current"
              - entity: input_select.tesla_home_charger_phases
                name: "Home Charger Phases"
              - entity: input_number.tesla_solar_feed_in_price
                name: "Solar Feed-in Price"
          - type: markdown
            content: |
              **Solar (optional):** enter entity IDs from Developer Tools >
              States. *Grid Power* must be positive while importing and
              negative while exporting (W or kW). *Solar Power* is your
              inverter's live PV output. *Solar Forecast* is the "Estimated power
              production - now" sensor of Open-Meteo Solar Forecast (recommended:
              15-minute forecast) or Forecast.Solar (e.g.
              `sensor.power_production_now`). Leave them empty without solar;
              Full auto then plans on prices only.
          - type: entities
            entities:
              - entity: input_text.tesla_grid_power_entity
                name: "Grid Power Sensor (entity ID)"
              - entity: input_text.tesla_pv_power_entity
                name: "Solar Power Sensor (entity ID)"
              - entity: input_text.tesla_solar_forecast_entity
                name: "Solar Forecast Sensor (entity ID)"

      # Fuel comparison
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## ⛽ Fuel Comparison

              The petrol/diesel car to compare against: how much fuel it uses and what a
              litre costs. Used for "a fuel car would cost" and "you saved".
          - type: custom:mushroom-number-card
            entity: input_number.comparison_ice_efficiency
            name: "ICE Fuel Efficiency"
            icon: mdi:fuel
            unit: "L/100km"
            min: 1
            max: 25
            step: 0.1
          - type: custom:mushroom-number-card
