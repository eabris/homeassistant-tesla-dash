title: Tesla Overview
icon: mdi:car-electric
views:
  # ========== VIEW 1: DASHBOARD (Main Hub) ==========
  - title: Dashboard
    path: dashboard
    icon: mdi:gauge
    cards:
      # 1.1 Header Status Row
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                return car.charAt(0).toUpperCase() + car.slice(1);
              ]]]
            icon: mdi:car-electric
            label: "🔔"
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.3)
                - height: 60px
                - padding: 8px

          - type: custom:button-card
            entity: sensor.vehicle_battery_range
            icon: mdi:battery
            show_name: false
            show_label: true
            label: |
              [[[
                const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                const rawRange = String(states['sensor.vehicle_battery_range']?.state || '');
                const rangeKm = (!rawRange || rawRange === 'unknown' || rawRange === 'unavailable')
                  ? soc * 4.1
                  : parseFloat(rawRange);
                const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                const isMi = unitSys !== 'Metric (km, °C, bar)';
                const range = Math.round(isMi ? rangeKm * 0.621371 : rangeKm);
                const unit = isMi ? 'mi' : 'km';
                return `${soc.toFixed(0)}% • ${range} ${unit}`;
              ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                      if (soc > 70) return 'rgba(76, 175, 80, 0.3)';
                      if (soc > 40) return 'rgba(255, 193, 7, 0.3)';
                      return 'rgba(244, 67, 54, 0.3)';
                    ]]]
                - height: 60px
                - padding: 8px

      # 1.2 Charging Status Card (Conditional)
      - type: conditional
        conditions:
          - entity: binary_sensor.tesla_charging_active
            state: "on"
        card:
          type: custom:button-card
          entity: binary_sensor.tesla_charging_active
          name: "CHARGING >"
          show_label: true
          label: |
            [[[
              const raw = String(states['sensor.vehicle_time_to_full_charge']?.state || '');
              const amp = String(states['sensor.vehicle_charger_current']?.state || '–');
              const maxAmp = String(states['number.vehicle_charge_current']?.state || '–');
              const volt = String(states['sensor.vehicle_charger_voltage']?.state || '–');
              const power = String(states['sensor.vehicle_charger_power']?.state || '–');
              const rate = String(states['sensor.vehicle_charge_rate']?.state || '–');
              const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
              const isMi = unitSys !== 'Metric (km, °C, bar)';
              const rateVal = parseFloat(rate);
              const rateDisp = isNaN(rateVal) ? rate : Math.round(isMi ? rateVal * 0.621371 : rateVal);
              const rateUnit = isMi ? 'mi/hr' : 'km/hr';
              let row1;
              if (!raw || raw === 'unknown' || raw === 'unavailable') {
                row1 = 'Calculating...';
              } else {
                const endTime = new Date(raw);
                const now = new Date();
                const diffMs = endTime - now;
                if (diffMs <= 0) {
                  row1 = 'Fully charged';
                } else {
                  const diffMins = Math.round(diffMs / 60000);
                  const h = Math.floor(diffMins / 60);
                  const m = diffMins % 60;
                  const hStr = String(endTime.getHours()).padStart(2, '0');
                  const mStr = String(endTime.getMinutes()).padStart(2, '0');
                  const dur = h > 0 ? `${h}h ${m}m` : `${m}m`;
                  row1 = `${dur} remaining > ${hStr}:${mStr}`;
                }
              }
              return `${row1}\n${amp}/${maxAmp} A • ${volt} V • ${power} kW • ${rateDisp} ${rateUnit}`;
            ]]]
          show_state: false
          styles:
            label:
              - white-space: pre-line
            card:
              - background-color: rgba(33, 150, 243, 0.2)
              - border-left: 4px solid rgb(33, 150, 243)
              - padding: 12px

      # 1.3 Quick Action Row (6 buttons)
      - type: horizontal-stack
        cards:
          # Lock/Unlock
          - type: custom:button-card
            entity: script.tesla_lock_toggle
            icon: mdi:lock
            name: "Lock"
            tap_action:
              action: call-service
              service: script.tesla_lock_toggle
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)
              icon:
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'rgb(76, 175, 80)' : 'rgb(244, 67, 54)';
                    ]]]

          # Climate
          - type: custom:button-card
            entity: script.tesla_climate_toggle
            icon: mdi:fan
            name: "Climate"
            tap_action:
              action: call-service
              service: script.tesla_climate_toggle
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Frunk
          - type: custom:button-card
            entity: script.tesla_frunk_open
            icon: mdi:car-door
            name: "Frunk"
            tap_action:
              action: call-service
              service: script.tesla_frunk_open
              confirmation:
                text: Open the front trunk (frunk)?
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Trunk
          - type: custom:button-card
            entity: script.tesla_trunk_open
            icon: mdi:car-back
            name: "Trunk"
            tap_action:
              action: call-service
              service: script.tesla_trunk_open
              confirmation:
                text: Open the rear trunk?
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Flash Lights
          - type: custom:button-card
            entity: script.tesla_flash_lights
            icon: mdi:lightbulb-flash
            name: "Flash"
            tap_action:
              action: call-service
              service: script.tesla_flash_lights
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Sentry
          - type: custom:button-card
            entity: script.tesla_sentry_toggle
            icon: mdi:shield-alert
            name: "Sentry"
            tap_action:
              action: call-service
              service: script.tesla_sentry_toggle
            styles:
              card:
                - background-color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['switch.' + car + '_sentry_mode']?.state === 'on' ? 'rgba(244, 67, 54, 0.3)' : 'rgba(76, 175, 80, 0.2)';
                    ]]]

      # 1.4 Location Strip Card
      # NOTE: the Tesla Fleet integration's device_tracker doesn't do reverse
      # geocoding — its .state is either a configured HA zone name (e.g.
      # "home"/"work") or "not_home". There's no real street address exposed
      # by the API, so this shows the zone name rather than pretending to be
      # a geocoded address like Tessie's own app can.
      - type: custom:button-card
        entity: input_text.tesla_car_name
        name: "📍 Current Location"
        show_label: true
        label: |
          [[[
            const car = states['input_text.tesla_car_name']?.state || 'tesla';
            const zone = String(states['device_tracker.' + car + '_location']?.state || '');
            if (!zone || zone === 'unknown' || zone === 'unavailable') return 'Location unavailable';
            if (zone === 'not_home') return 'Away from saved zones';
            return `At ${zone.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}`;
          ]]]
        tap_action:
          action: url
          url_path: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const lat = state_attr('device_tracker.' + car + '_location', 'latitude');
              const lon = state_attr('device_tracker.' + car + '_location', 'longitude');
              return lat && lon ? `https://maps.google.com/?q=${lat},${lon}` : '#';
            ]]]
        styles:
          card:
            - background-color: rgba(33, 150, 243, 0.15)
            - padding: 12px

      # 1.5 Information Overview Grid (9 cards, 2 columns)
      # NOTE: the original Tessie-parity spec called for a 10th "Profiler"
      # (speedometer/performance-tracking) tile, but no backing entity exists
      # for that yet in this project — omitted rather than faking it. Ask if
      # you'd like a real Profiler feature added.
      - type: grid
        columns: 2
        cards:
          # Climate
          - type: custom:button-card
            entity: sensor.vehicle_inside_temperature
            icon: mdi:thermometer
            name: "Climate"
            show_label: true
            label: |
              [[[
                const tempStr = String(states['sensor.vehicle_inside_temperature']?.state || '0');
                const temp = parseFloat(tempStr);
                const isF = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                if (isNaN(temp)) return 'N/A';
                const disp = isF ? (temp * 9 / 5 + 32) : temp;
                return `${disp.toFixed(1)}°${isF ? 'F' : 'C'}`;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Battery
          - type: custom:button-card
            entity: sensor.vehicle_battery_range
            icon: mdi:battery
            name: "Battery"
            show_label: true
            label: |
              [[[
                const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                const isMi = unitSys !== 'Metric (km, °C, bar)';
                const unit = isMi ? 'mi' : 'km';
                const range = String(states['sensor.vehicle_battery_range']?.state || '');
                if (!range || range === 'unknown' || range === 'unavailable') {
                  const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                  if (isNaN(soc)) return `– ${unit}`;
                  const km = soc * 4.1;
                  return `~${Math.round(isMi ? km * 0.621371 : km)} ${unit}`;
                }
                const km = parseFloat(range);
                return `${Math.round(isMi ? km * 0.621371 : km)} ${unit}`;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Schedule
          - type: custom:button-card
            entity: input_datetime.tesla_next_departure
            icon: mdi:calendar-clock
            name: "Schedule"
            show_label: true
            label: |
              [[[
                const time = String(states['input_datetime.tesla_next_departure']?.state || 'unknown');
                if (time === 'unavailable' || time === 'unknown' || !time) return 'Not set';
                const parts = time.split(' ');
                if (parts.length > 1 && parts[1]) {
                  const timeParts = parts[1].split(':');
                  return `${timeParts[0]}:${timeParts[1] || '00'}`;
                }
                return 'Not set';
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Tires
          - type: custom:button-card
            entity: sensor.tesla_tires_status
            icon: mdi:tire
            name: "Tires"
            show_label: true
            label: |
              [[[
                return String(states['sensor.tesla_tires_status']?.state || 'Unknown');
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Drives
          - type: custom:button-card
            entity: sensor.tesla_driving_time_today_raw
            icon: mdi:map
            name: "Drives"
            show_label: true
            label: |
              [[[
                const sessions = parseInt(states['sensor.tesla_drive_sessions_today']?.state || '0');
                const hours = parseFloat(states['sensor.tesla_driving_time_today_raw']?.state || '0');
                const mins = Math.round(hours * 60);
                if (sessions === 0 && mins === 0) return 'No drives today';
                const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Charges
          - type: custom:button-card
            entity: sensor.tesla_charging_time_today_raw
            icon: mdi:lightning-bolt
            name: "Charges"
            show_label: true
            label: |
              [[[
                const sessions = parseInt(states['sensor.tesla_charge_sessions_today']?.state || '0');
                const hours = parseFloat(states['sensor.tesla_charging_time_today_raw']?.state || '0');
                const mins = Math.round(hours * 60);
                if (sessions === 0 && mins === 0) return 'No charges today';
                const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Idles
          - type: custom:button-card
            entity: sensor.tesla_charging_time_3d_raw
            icon: mdi:parking
            name: "Idles"
            show_label: true
            label: |
              [[[
                const shift = String(states['sensor.vehicle_shift_state']?.state || '').toUpperCase();
                const charging = String(states['sensor.vehicle_charging']?.state || '').toLowerCase();
                const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
                if (driving) return 'Driving';
                if (['charging','preconditioning'].includes(charging)) return 'Charging';
                if (['p','park','unknown','unavailable',''].includes(shift.toLowerCase())) return 'Parked';
                return shift || 'Parked';
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Activity
          - type: custom:button-card
            entity: sensor.vehicle_shift_state
            icon: mdi:state-machine
            name: "Activity"
            show_label: true
            label: |
              [[[
                const state = String(states['sensor.vehicle_shift_state']?.state || '');
                if (!state || state === 'unknown' || state === 'unavailable') return 'Parked';
                return state.toUpperCase();
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Automation
          - type: custom:button-card
            entity: input_boolean.tesla_enable_smart_charging
            icon: mdi:wand-plus
            name: "Automation"
            show_label: true
            label: |
              [[[
                return states['input_boolean.tesla_enable_smart_charging']?.state === 'on' ? 'On' : 'Off';
              ]]]
            tap_action:
              action: call-service
              service: input_boolean.toggle
              service_data:
                entity_id: input_boolean.tesla_enable_smart_charging
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)



      # 1.6 Vehicle Specifications Footer
      - type: markdown
        content: |
          ---
          **{{ states('input_text.tesla_model') | default('Tesla Model X') }}** • VIN: {{ states('input_text.tesla_vin') | default('Unknown') }} • Plate: {{ states('input_text.tesla_plate') | default('Unknown') }}
          
          {% set car = states('input_text.tesla_car_name') %}
          {% set unit_sys = states('input_select.tesla_unit_system') %}
          {% set is_mi = unit_sys != 'Metric (km, °C, bar)' %}
          {% set odo_km = states('sensor.vehicle_odometer') | float(0) %}
          {% set odo = (odo_km * 0.621371) if is_mi else odo_km %}
          Firmware: {{ state_attr('update.' + car + '_update', 'installed_version') | default('Unknown') }}{{ ' ⬆️' if states('update.' + car + '_update') == 'on' else '' }} • Odometer: {{ odo | round(0) }} {{ 'mi' if is_mi else 'km' }} • Status: {{ 'Online' if is_state('binary_sensor.vehicle_status', 'on') else 'Offline' }}

  # ========== VIEW 2: CONTROLS ==========
  - title: Controls
    path: controls
    icon: mdi:tune
    cards:
      # Vehicle Status Hero Card
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          status: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const online = states['binary_sensor.vehicle_status']?.state === 'on';
              const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
              const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
              const soc = parseFloat(states['sensor.vehicle_battery_level']?.state || '0');
              const range = states['sensor.vehicle_battery_range']?.state;
              const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
              const isMi = unitSys !== 'Metric (km, °C, bar)';
              const rangeUnit = isMi ? 'mi' : 'km';
              const rangeKm = (!range || range === 'unknown') ? (soc * 4.1) : parseFloat(range);
              const rangeStr = `${Math.round(isMi ? rangeKm * 0.621371 : rangeKm)} ${rangeUnit}`;

              let statePill, stateColor;
              if (!online) {
                statePill = '😴 Sleeping'; stateColor = '#555';
              } else if (driving) {
                statePill = '🚗 Driving'; stateColor = '#1E88E5';
              } else if (charging) {
                statePill = '⚡ Charging'; stateColor = '#4CAF50';
              } else {
                statePill = '🅿️ Parked'; stateColor = '#888';
              }

              const battColor = soc > 70 ? '#4CAF50' : soc > 40 ? '#FFC107' : '#F44336';
              const battBar = `<div style="width:100%;background:rgba(255,255,255,0.08);border-radius:4px;height:6px;margin-top:4px">
                <div style="width:${soc}%;background:${battColor};height:6px;border-radius:4px"></div>
              </div>`;

              return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%">
                <div>
                  <span style="background:${stateColor};color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.5px">${statePill}</span>
                </div>
                <div style="text-align:right">
                  <div style="color:#fff;font-size:18px;font-weight:700">${soc.toFixed(0)}% <span style="color:#aaa;font-size:13px;font-weight:400">${rangeStr}</span></div>
                  ${battBar}
                </div>
              </div>`;
            ]]]
          details: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const online = states['binary_sensor.vehicle_status']?.state === 'on';
              const sentry = states['switch.' + car + '_sentry_mode']?.state === 'on';
              const lock = states['lock.' + car + '_lock']?.state;
              const windows = states['cover.' + car + '_windows']?.state;

              const chip = (icon, label, color) =>
                `<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:3px 10px;font-size:11px;color:${color};margin:2px">${icon} ${label}</span>`;

              const lockChip = lock === 'locked'
                ? chip('🔒', 'Locked', '#4CAF50')
                : lock === 'unlocked' ? chip('🔓', 'Unlocked', '#F44336') : chip('🔒', '–', '#666');
              const winChip = windows === 'open'
                ? chip('🪟', 'Windows open', '#FF9F0A')
                : windows === 'closed' ? chip('🪟', 'Windows closed', '#4CAF50') : chip('🪟', '–', '#666');
              const sentryChip = sentry ? chip('🛡️', 'Sentry on', '#EF5350') : chip('🛡️', 'Sentry off', '#888');
              const onlineChip = online ? chip('📡', 'Online', '#4CAF50') : chip('📡', 'Offline', '#F44336');

              return `<div style="padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);margin-top:8px">
                ${onlineChip}${lockChip}${winChip}${sentryChip}
              </div>`;
            ]]]
        styles:
          card:
            - background-color: rgba(28, 28, 30, 0.95)
            - border-radius: 16px
            - padding: 16px 20px
          grid:
            - grid-template-areas: '"status" "details"'
            - grid-template-columns: 1fr
            - grid-template-rows: auto auto
          custom_fields:
            status:
              - width: 100%
            details:
              - width: 100%

      # Wake Car
      - type: custom:button-card
        entity: script.tesla_wake
        icon: mdi:sleep-off
        name: "Wake Car"
        show_label: true
        label: |
          [[[
            const online = states['binary_sensor.vehicle_status']?.state === 'on';
            return online ? '✅ Vehicle is awake' : '💤 Tap to wake from sleep';
          ]]]
        tap_action:
          action: call-service
          service: script.tesla_wake
        styles:
          card:
            - background-color: |
                [[[
                  return states['binary_sensor.vehicle_status']?.state === 'on'
                    ? 'rgba(76, 175, 80, 0.15)'
                    : 'rgba(255, 193, 7, 0.2)';
                ]]]
          icon:
            - color: |
                [[[
                  return states['binary_sensor.vehicle_status']?.state === 'on'
                    ? 'rgb(76, 175, 80)'
                    : 'rgb(255, 193, 7)';
                ]]]

      # Window Controls
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: script.tesla_windows_vent
            icon: mdi:window-open-variant
            name: "Vent Windows"
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const s = states['cover.' + car + '_windows']?.state;
                return s === 'open' ? '● Currently open' : s === 'closed' ? '○ Currently closed' : '–';
              ]]]
            tap_action:
              action: call-service
              service: script.tesla_windows_vent
            styles:
              card:
                - background-color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['cover.' + car + '_windows']?.state === 'open'
                        ? 'rgba(255, 159, 10, 0.25)'
                        : 'rgba(76, 175, 80, 0.2)';
                    ]]]
              label:
                - font-size: 10px
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['cover.' + car + '_windows']?.state === 'open'
                        ? 'rgb(255, 159, 10)'
                        : 'rgb(76, 175, 80)';
                    ]]]

          - type: custom:button-card
            entity: script.tesla_windows_close
            icon: mdi:window-closed-variant
            name: "Close Windows"
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const s = states['cover.' + car + '_windows']?.state;
                return s === 'closed' ? '● Already closed' : '↓ Tap to close';
              ]]]
            tap_action:
              action: call-service
              service: script.tesla_windows_close
            styles:
              card:
                - background-color: rgba(244, 67, 54, 0.2)
              label:
                - font-size: 10px
                - color: rgba(255, 255, 255, 0.5)

      # Sentry Mode
      - type: custom:button-card
        entity: script.tesla_sentry_toggle
        icon: mdi:shield-alert
        name: "Sentry Mode"
        show_label: true
        label: |
          [[[
            const car = states['input_text.tesla_car_name']?.state || 'tesla';
            return states['switch.' + car + '_sentry_mode']?.state === 'on'
              ? '🛡️ Active — monitoring surroundings'
              : '○ Inactive — tap to enable';
          ]]]
        tap_action:
          action: call-service
          service: script.tesla_sentry_toggle
        styles:
          card:
            - background-color: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  return states['switch.' + car + '_sentry_mode']?.state === 'on'
                    ? 'rgba(239, 83, 80, 0.2)'
                    : 'rgba(76, 175, 80, 0.15)';
                ]]]
          icon:
            - color: |
                [[[
