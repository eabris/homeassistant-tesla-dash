                name: "Idles"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const shift = String(states['sensor.vehicle_shift_state']?.state || '').toUpperCase();
                    const charging = String(states['sensor.vehicle_charging']?.state || '').toLowerCase();
                    const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
                    if (driving) return 'Driving';
                    if (['charging','preconditioning'].includes(charging)) return 'Charging';
                    if (['p','park','unknown','unavailable',''].includes(shift.toLowerCase())) return 'Parked';
                    return shift || 'Parked';
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
