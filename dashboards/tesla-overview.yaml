                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              - type: custom:button-card
                entity: sensor.vehicle_time_to_full_charge
                icon: mdi:clock-end
                name: "Done at"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                    if (!charging) return 'Not charging';
                    const raw = String(states['sensor.vehicle_time_to_full_charge']?.state || '');
                    const end = new Date(raw);
                    if (!raw || isNaN(end.getTime())) return 'Calculating…';
                    const mins = Math.max(0, Math.round((end - new Date()) / 60000));
                    const hm = `${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')}`;
                    const left = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
                    return `${hm}<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">in ${left}</div>`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              - type: custom:button-card
                entity: sensor.vehicle_charger_current
                icon: mdi:current-ac
                name: "Charging current"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                    if (!charging) return 'Not charging';
                    const amp = parseFloat(String(states['sensor.vehicle_charger_current']?.state || ''));
                    const max = parseFloat(String(states['number.vehicle_charge_current']?.state || ''));
                    if (isNaN(amp)) return '– A';
                    return isNaN(max) ? `${amp.toFixed(0)} A` : `${amp.toFixed(0)} of ${max.toFixed(0)} A`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              - type: custom:button-card
                entity: sensor.vehicle_charger_voltage
                icon: mdi:flash-triangle-outline
                name: "Charging voltage"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                    if (!charging) return 'Not charging';
                    const volt = parseFloat(String(states['sensor.vehicle_charger_voltage']?.state || ''));
                    return isNaN(volt) ? '– V' : `${volt.toFixed(0)} V`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

          # Energy the car used for driving, from logged drives (battery %
          # drop x capacity), since this project started tracking it.
          - type: custom:button-card
            entity: sensor.tesla_drive_energy_consumed_total
            icon: mdi:car-electric
            name: "Energy used for driving"
            size: 18px
            show_state: false
            show_label: true
            tap_action:
              action: navigate
              navigation_path: /tesla-analytics/driving
            label: |
              [[[
                const raw = String(states['sensor.tesla_drive_energy_consumed_total']?.state || '');
                const kwh = parseFloat(raw);
                const loc = states['sensor.tesla_currency_locale']?.state || 'hu-HU';
                return (!raw || raw === 'unknown' || raw === 'unavailable' || isNaN(kwh))
                  ? '– kWh'
                  : `${kwh.toLocaleString(loc, {maximumFractionDigits: 0})} kWh since tracking started`;
              ]]]
            styles:
              card:
                - background-color: rgba(255,255,255,0.04)
                - border: 1px solid rgba(255,255,255,0.08)
                - border-radius: 16px
