title: Tesla Overview
icon: mdi:car-electric
views:
  # ========== VIEW 1: DASHBOARD (Main Hub) ==========
  - title: Dashboard
    path: dashboard
    icon: mdi:gauge
    cards:
      - type: vertical-stack
        cards:
          # 1.1 Vehicle Hero (Tesla-app dock layout)
          # Car name (input_text.tesla_car_name) + range live ON the photo.
          # Lock / Wake / Charge / Unlock sit in a 4-column dock under the photo.
          - type: custom:button-card
            show_icon: false
            show_name: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 0
                - background-color: "#070708"
                - border-radius: 20px
                - overflow: hidden
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: none
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"hero hero hero hero" "lock wake charge unlock"'
                - grid-template-columns: 1fr 1fr 1fr 1fr
                - grid-template-rows: auto min-content
              custom_fields:
                hero:
                  - grid-area: hero
                  - padding: 0
                lock:
                  - grid-area: lock
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                wake:
                  - grid-area: wake
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                charge:
                  - grid-area: charge
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                unlock:
                  - grid-area: unlock
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
            custom_fields:
              hero:
                card:
                  type: picture-elements
                  image: media-source://media_source/local/tesla-car-image-2.jpg
                  aspect_ratio: "2:1"
                  card_mod:
                    style: |
                      ha-card {
                        border-radius: 0;
                        overflow: visible;
                        background: #070708;
                        border: none;
                        box-shadow: none;
                      }
                  elements:
                    - type: custom:button-card
                      tap_action:
                        action: none
                      hold_action:
                        action: none
                      show_icon: false
                      show_name: true
                      show_label: true
                      name: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return car.charAt(0).toUpperCase() + car.slice(1);
                        ]]]
                      label: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          const awake = states['binary_sensor.vehicle_status']?.state === 'on';
                          const locked = states['lock.' + car + '_lock']?.state === 'locked';
                          const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                          const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                          const bits = [
                            awake ? 'Parked' : 'Asleep',
                            locked ? 'Locked' : 'Unlocked',
                            charging ? 'Charging' : plugged ? 'Plugged in' : '',
                          ];
                          return bits.filter(Boolean).join(' · ');
                        ]]]
                      styles:
                        card:
                          - background: none
                          - background-color: transparent
                          - box-shadow: none
                          - border: none
                          - padding: 0
                          - width: auto
                          - --ha-card-border-width: 0px
                          - --ha-card-border-color: transparent
                          - --ha-card-background: transparent
                          - --ha-card-box-shadow: none
                        name:
                          - color: "#f4f4f5"
                          - font-size: 18px
                          - font-weight: 600
                          - letter-spacing: -0.03em
                          - justify-self: start
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                        label:
                          - color: rgba(244,244,245,0.55)
                          - font-size: 12px
                          - font-weight: 500
                          - justify-self: start
                          - margin-top: 2px
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                      style:
                        top: 18px
                        left: 20px
                        transform: none
                        background: none
                        border: none
                        box-shadow: none

                    - type: custom:button-card
                      tap_action:
                        action: none
                      hold_action:
                        action: none
                      show_icon: true
                      show_name: true
                      show_label: false
                      size: 16px
                      icon: mdi:battery
                      name: |
                        [[[
                          const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                          const rawRange = String(states['sensor.vehicle_battery_range']?.state || '');
                          const rangeKm = (!rawRange || rawRange === 'unknown' || rawRange === 'unavailable')
                            ? soc * 4.1
                            : parseFloat(rawRange);
                          const adjPct = parseFloat(states['input_number.tesla_wheel_range_adjustment_pct']?.state || '0');
                          const calcKm = rangeKm * (1 - adjPct / 100);
                          const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                          const isMi = unitSys !== 'Metric (km, °C, bar)';
                          const range = Math.round(isMi ? rangeKm * 0.621371 : rangeKm);
                          const calc = Math.round(isMi ? calcKm * 0.621371 : calcKm);
                          const unit = isMi ? 'mi' : 'km';
                          return `${soc.toFixed(0)}% · ${range} (${calc}) ${unit}`;
                        ]]]
                      styles:
                        card:
                          - background: none
                          - background-color: transparent
                          - box-shadow: none
                          - border: none
                          - padding: 0
                          - width: max-content
                          - overflow: visible
                          - --ha-card-border-width: 0px
                          - --ha-card-border-color: transparent
                          - --ha-card-background: transparent
                          - --ha-card-box-shadow: none
                        grid:
                          - grid-template-areas: '"i n"'
                          - grid-template-columns: 18px max-content
                          - column-gap: 6px
                          - align-items: center
                        icon:
                          - color: |
                              [[[
                                const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                                if (soc > 70) return '#6ee7b7';
                                if (soc > 40) return '#fbbf24';
                                return '#f87171';
                              ]]]
                          - width: 16px
                          - height: 16px
                        img_cell:
                          - width: 18px
                          - height: 18px
                          - background: none
                          - border: none
                          - box-shadow: none
                        name:
                          - color: "#f4f4f5"
                          - font-size: 13px
                          - font-weight: 500
                          - justify-self: start
                          - white-space: nowrap
                          - overflow: visible
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                      style:
                        top: 18px
                        left: auto
                        right: 14px
                        width: auto
                        transform: none
                        background: none
                        border: none
                        box-shadow: none
                        overflow: visible

              lock:
                card:
                  type: custom:button-card
                  entity: script.tesla_lock_toggle
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'Locked' : 'Unlocked';
                    ]]]
                  icon: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open-variant';
                    ]]]
                  tap_action:
                    action: call-service
                    service: script.tesla_lock_toggle
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: "#f4f4f5"
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: |
                          [[[
                            const car = states['input_text.tesla_car_name']?.state || 'tesla';
                            return states['lock.' + car + '_lock']?.state === 'locked'
                              ? '1.5px solid rgba(110, 231, 183, 0.75)'
                              : '1.5px solid rgba(248, 113, 113, 0.75)';
                          ]]]
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              wake:
                card:
                  type: custom:button-card
                  entity: binary_sensor.vehicle_status
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      return states['binary_sensor.vehicle_status']?.state === 'on' ? 'Awake' : 'Asleep';
                    ]]]
                  icon: mdi:lightning-bolt
                  tap_action:
                    action: call-service
                    service: script.tesla_wake
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: |
                          [[[
                            return states['binary_sensor.vehicle_status']?.state === 'on'
                              ? '#f4f4f5'
                              : 'rgba(244,244,245,0.45)';
                          ]]]
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: 1.5px solid rgba(255,255,255,0.18)
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              charge:
                card:
                  type: custom:button-card
                  entity: binary_sensor.vehicle_charge_cable
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                      const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                      if (charging) return 'Charging';
                      if (plugged) return 'Plugged';
                      return 'Charge';
                    ]]]
                  icon: mdi:ev-plug-tesla
                  tap_action:
                    action: none
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: |
                          [[[
                            const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                            const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                            if (charging) return '#6ee7b7';
                            if (plugged) return '#7dd3fc';
                            return '#f4f4f5';
                          ]]]
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: |
                          [[[
                            const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                            const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                            if (charging) return '1.5px solid rgba(110, 231, 183, 0.75)';
                            if (plugged) return '1.5px solid rgba(125, 211, 252, 0.65)';
                            return '1.5px solid rgba(255,255,255,0.18)';
                          ]]]
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              unlock:
                card:
                  type: custom:button-card
                  entity: script.tesla_unlock_port
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: "Unlock"
                  icon: mdi:ev-station
                  tap_action:
                    action: call-service
                    service: script.tesla_unlock_port
                    confirmation:
                      text: Unlock the charge port?
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: "#f4f4f5"
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: 1.5px solid rgba(255,255,255,0.18)
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

          # 1.2 Charging Status Card (Conditional)
          - type: conditional
            conditions:
              - entity: binary_sensor.tesla_charging_active
                state: "on"
            card:
              type: custom:button-card
              entity: binary_sensor.tesla_charging_active
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: none
              custom_fields:
                row: |
                  [[[
                    const raw = String(states['sensor.vehicle_time_to_full_charge']?.state || '');
                    const amp = String(states['sensor.vehicle_charger_current']?.state || '–');
                    const maxAmp = String(states['number.vehicle_charge_current']?.state || '–');
                    const volt = String(states['sensor.vehicle_charger_voltage']?.state || '–');
                    const power = String(states['sensor.vehicle_charger_power']?.state || '–');
                    const rate = String(states['sensor.vehicle_charge_rate']?.state || '–');
                    const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                    const isMi = unitSys !== 'Metric (km, °C, bar)';
                    const rateVal = parseFloat(rate);
                    const rateDisp = isNaN(rateVal) ? rate : Math.round(isMi ? rateVal * 0.621371 : rateVal);
                    const rateUnit = isMi ? 'mi/hr' : 'km/hr';
                    let remaining;
                    if (!raw || raw === 'unknown' || raw === 'unavailable') {
                      remaining = 'Calculating…';
                    } else {
                      const endTime = new Date(raw);
                      const now = new Date();
                      const diffMs = endTime - now;
                      if (diffMs <= 0) {
                        remaining = 'Fully charged';
                      } else {
                        const diffMins = Math.round(diffMs / 60000);
                        const h = Math.floor(diffMins / 60);
                        const m = diffMins % 60;
                        const hStr = String(endTime.getHours()).padStart(2, '0');
                        const mStr = String(endTime.getMinutes()).padStart(2, '0');
                        const dur = h > 0 ? `${h}h ${m}m` : `${m}m`;
                        remaining = `${dur} · ${hStr}:${mStr}`;
                      }
                    }
                    return `<div style="display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px">
                      <span style="color:#7dd3fc;font-size:12px;font-weight:650;letter-spacing:0.12em">CHARGING</span>
                      <span style="color:#f4f4f5;font-size:13px;font-weight:500">${remaining}</span>
                    </div>
                    <div style="margin-top:8px;color:rgba(244,244,245,0.5);font-size:12px;letter-spacing:0.01em">${amp}/${maxAmp} A · ${volt} V · ${power} kW · ${rateDisp} ${rateUnit}</div>`;
                  ]]]
              styles:
                card:
                  - background: linear-gradient(90deg, rgba(56,189,248,0.16), rgba(12,12,14,0.92) 55%)
                  - border: 1px solid rgba(125,211,252,0.18)
                  - border-radius: 16px
                  - box-shadow: none
                  - padding: 14px 16px
                  - --ha-card-border-width: 0px
                grid:
                  - grid-template-areas: '"row"'
                  - grid-template-columns: 1fr
                custom_fields:
                  row:
                    - width: 100%

          # 1.3 Quick Action Row
          # Lock lives in the hero dock — omitted here to avoid a duplicate.
          - type: horizontal-stack
            cards:
              # Climate
              - type: custom:button-card
                entity: script.tesla_climate_toggle
                icon: mdi:fan
                name: "Climate"
                tap_action:
                  action: call-service
                  service: script.tesla_climate_toggle
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Frunk
              - type: custom:button-card
                entity: script.tesla_frunk_open
                icon: mdi:car-door
                name: "Frunk"
                tap_action:
                  action: call-service
                  service: script.tesla_frunk_open
                  confirmation:
                    text: Open the front trunk (frunk)?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Trunk
              - type: custom:button-card
                entity: script.tesla_trunk_open
                icon: mdi:car-back
                name: "Trunk"
                tap_action:
                  action: call-service
                  service: script.tesla_trunk_open
                  confirmation:
                    text: Open the rear trunk?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Flash Lights
              - type: custom:button-card
                entity: script.tesla_flash_lights
                icon: mdi:flashlight
                name: "Flash"
                tap_action:
                  action: call-service
                  service: script.tesla_flash_lights
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Sentry
              - type: custom:button-card
                entity: script.tesla_sentry_toggle
                icon: mdi:shield-alert
                name: "Sentry"
                tap_action:
                  action: call-service
                  service: script.tesla_sentry_toggle
                styles:
                  card:
                    - background-color: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return states['switch.' + car + '_sentry_mode']?.state === 'on'
                            ? 'rgba(248, 113, 113, 0.12)'
                            : 'rgba(255,255,255,0.05)';
                        ]]]
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return states['switch.' + car + '_sentry_mode']?.state === 'on' ? '#f87171' : '#f4f4f5';
                        ]]]
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

          # 1.4 Location Strip Card
          # NOTE: the Tesla Fleet integration's device_tracker doesn't do reverse
          # geocoding — its .state is either a configured HA zone name (e.g.
          # "home"/"work") or "not_home". There's no real street address exposed
          # by the API, so this shows the zone name rather than pretending to be
          # a geocoded address like Tessie's own app can.
          # NOTE: icon is an explicit small JS template below (home/work/away/
          # other-zone specific) rather than the card's default — without this,
          # button-card falls back to input_text.tesla_car_name's own registry
          # icon (mdi:car-electric, set in configuration.yaml), rendered at
          # full default size, which is the "gigantic icon" the user reported.
          - type: custom:button-card
            entity: input_text.tesla_car_name
            name: "Current Location"
            size: 28px
            icon: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const zone = String(states['device_tracker.' + car + '_location']?.state || '').toLowerCase();
                if (!zone || zone === 'unknown' || zone === 'unavailable') return 'mdi:map-marker-off';
                if (zone === 'not_home') return 'mdi:map-marker-question';
                if (zone === 'home') return 'mdi:home';
                if (zone.includes('work') || zone.includes('office')) return 'mdi:office-building';
                return 'mdi:map-marker';
              ]]]
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const zone = String(states['device_tracker.' + car + '_location']?.state || '');
                if (!zone || zone === 'unknown' || zone === 'unavailable') return 'Location unavailable';
                if (zone === 'not_home') return 'Away from saved zones';
                return `At ${zone.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}`;
              ]]]
            tap_action:
              action: url
              url_path: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  const lat = state_attr('device_tracker.' + car + '_location', 'latitude');
                  const lon = state_attr('device_tracker.' + car + '_location', 'longitude');
                  return lat && lon ? `https://maps.google.com/?q=${lat},${lon}` : '#';
                ]]]
            styles:
              card:
                - background-color: rgba(255,255,255,0.04)
                - border: 1px solid rgba(255,255,255,0.08)
                - border-radius: 16px
                - box-shadow: none
                - padding: 12px 16px
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 36px 1fr
                - column-gap: 10px
                - align-items: center
              icon:
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
