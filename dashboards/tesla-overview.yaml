                    if (isNaN(soc) || isNaN(capacity)) return '– kWh';
                    const currentKwh = (soc / 100 * capacity).toFixed(1);
                    return `${currentKwh} / ${capacity.toFixed(0)} kWh`;
                  ]]]
                styles:
                  card:
