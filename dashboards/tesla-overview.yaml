title: Tesla Overview
icon: mdi:car-electric

# Shared custom:button-card templates (used with `template:` + `variables:`).
button_card_templates:
  # Cost Projections tab: one card per period (variables.period = month,
  # year or five). Projections come from sensor.tesla_projected_monthly_*
  # (average cost per day over this month + last month, agents.md Section 24).
  tesla_cost_period:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    custom_fields:
      block: |
        [[[
          const st = (id) => states[id]?.state;
          const num = (id) => { const v = parseFloat(st(id)); return isNaN(v) ? 0 : v; };
          const code = st('input_select.tesla_currency') || 'HUF';
          const loc = st('sensor.tesla_currency_locale') || 'hu-HU';
          const money = (v) => {
            try {
              return new Intl.NumberFormat(loc, { style: 'currency', currency: code, maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(Math.round(v));
            } catch (e) {
              return `${Math.round(v)} ${st('sensor.tesla_currency_symbol') || ''}`;
            }
          };
          const P = {
            month: { title: 'PER MONTH', elec: 'sensor.tesla_projected_monthly_electric_cost', fuel: 'sensor.tesla_projected_monthly_fuel_cost' },
            year: { title: 'PER YEAR', elec: 'sensor.tesla_annual_electric_cost', fuel: 'sensor.tesla_annual_fuel_cost_equivalent' },
            five: { title: 'IN 5 YEARS', elec: 'sensor.tesla_5_year_electric_cost', fuel: 'sensor.tesla_5_year_fuel_cost_equivalent' },
          }[variables.period] || {};
          const elec = num(P.elec);
          const fuel = num(P.fuel);
          const save = fuel - elec;
          const sub = variables.period === 'month'
            ? `<div style="color:#999;font-size:11px;margin-top:2px">So far this month: ${money(num('sensor.tesla_monthly_electric_cost'))}</div>`
            : '';
          const row = (icon, label, value, color, size, extra = '') =>
            `<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.07)">
              <span style="font-size:20px;width:26px;text-align:center;flex-shrink:0">${icon}</span>
              <div>
                <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                <div style="color:${color};font-size:${size}px;font-weight:700">${value}</div>${extra}
              </div>
            </div>`;
          return `<div style="width:100%;text-align:left">
            <div style="color:#888;font-size:11px;font-weight:600;letter-spacing:1.5px;padding-bottom:4px">📅 ${P.title || ''}</div>
            ${row('⚡', 'CHARGING COSTS YOU', money(elec), '#fff', 20, sub)}
            ${row('⛽', 'A FUEL CAR WOULD COST', money(fuel), '#ccc', 16)}
            ${save >= 0
              ? row('💰', 'YOU SAVE', money(save), '#4CAF50', 16)
              : row('💸', 'CHARGING COSTS MORE BY', money(-save), '#F44336', 16)}
          </div>`;
        ]]]
    styles:
      card:
        - background-color: rgba(28, 28, 30, 0.95)
        - border-radius: 16px
        - padding: 16px 20px
      grid:
        - grid-template-areas: '"block"'
        - grid-template-columns: 1fr
      custom_fields:
        block:
          - width: 100%

views:
  # ========== VIEW 1: DASHBOARD (Main Hub) ==========
  - title: Dashboard
    path: dashboard
    icon: mdi:gauge
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # 1.1 Vehicle Hero (Tesla-app dock layout)
          # Car name (input_text.tesla_car_name) + range live ON the photo.
          # Lock / Wake / Charge / Unlock sit in a 4-column dock under the photo.
          - type: custom:button-card
            show_icon: false
            show_name: false
            tap_action:
              action: none
            styles:
              card:
                - padding: 0
                - background-color: "#070708"
                - border-radius: 20px
                - overflow: hidden
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: none
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"hero hero hero hero" "lock wake charge unlock"'
                - grid-template-columns: 1fr 1fr 1fr 1fr
                - grid-template-rows: auto min-content
              custom_fields:
                hero:
                  - grid-area: hero
                  - padding: 0
                lock:
                  - grid-area: lock
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                wake:
                  - grid-area: wake
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                charge:
                  - grid-area: charge
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
                unlock:
                  - grid-area: unlock
                  - justify-self: center
                  - align-self: start
                  - width: min-content
                  - padding: 12px 0 18px
            custom_fields:
              hero:
                card:
                  type: picture-elements
                  image: media-source://media_source/local/tesla-car-image-2.jpg
                  aspect_ratio: "2:1"
                  card_mod:
                    style: |
                      ha-card {
                        border-radius: 0;
                        overflow: visible;
                        background: #070708;
                        border: none;
                        box-shadow: none;
                      }
                  elements:
                    - type: custom:button-card
                      tap_action:
                        action: none
                      hold_action:
                        action: none
                      show_icon: false
                      show_name: true
                      show_label: true
                      name: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return car.charAt(0).toUpperCase() + car.slice(1);
                        ]]]
                      label: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          const awake = states['binary_sensor.vehicle_status']?.state === 'on';
                          const locked = states['lock.' + car + '_lock']?.state === 'locked';
                          const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                          const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                          const bits = [
                            awake ? 'Parked' : 'Asleep',
                            locked ? 'Locked' : 'Unlocked',
                            charging ? 'Charging' : plugged ? 'Plugged in' : '',
                          ];
                          return bits.filter(Boolean).join(' · ');
                        ]]]
                      styles:
                        card:
                          - background: none
                          - background-color: transparent
                          - box-shadow: none
                          - border: none
                          - padding: 0
                          - width: auto
                          - --ha-card-border-width: 0px
                          - --ha-card-border-color: transparent
                          - --ha-card-background: transparent
                          - --ha-card-box-shadow: none
                        name:
                          - color: "#f4f4f5"
                          - font-size: 18px
                          - font-weight: 600
                          - letter-spacing: -0.03em
                          - justify-self: start
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                        label:
                          - color: rgba(244,244,245,0.55)
                          - font-size: 12px
                          - font-weight: 500
                          - justify-self: start
                          - margin-top: 2px
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                      style:
                        top: 18px
                        left: 20px
                        transform: none
                        background: none
                        border: none
                        box-shadow: none

                    - type: custom:button-card
                      tap_action:
                        action: none
                      hold_action:
                        action: none
                      show_icon: true
                      show_name: true
                      show_label: false
                      size: 16px
                      icon: mdi:battery
                      name: |
                        [[[
                          const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                          const rawRange = String(states['sensor.vehicle_battery_range']?.state || '');
                          const estimated = !rawRange || rawRange === 'unknown' || rawRange === 'unavailable';
                          const rangeKm = estimated ? soc * 4.1 : parseFloat(rawRange);
                          const adjPct = parseFloat(states['input_number.tesla_wheel_range_adjustment_pct']?.state || '0');
                          const calcKm = rangeKm * (1 - adjPct / 100);
                          const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                          const isMi = unitSys !== 'Metric (km, °C, bar)';
                          const range = Math.round(isMi ? rangeKm * 0.621371 : rangeKm);
                          const calc = Math.round(isMi ? calcKm * 0.621371 : calcKm);
                          const unit = isMi ? 'mi' : 'km';
                          return `${soc.toFixed(0)}% · ${estimated ? '~' : ''}${range} ${unit} (≈${calc} real)`;
                        ]]]
                      styles:
                        card:
                          - background: none
                          - background-color: transparent
                          - box-shadow: none
                          - border: none
                          - padding: 0
                          - width: max-content
                          - overflow: visible
                          - --ha-card-border-width: 0px
                          - --ha-card-border-color: transparent
                          - --ha-card-background: transparent
                          - --ha-card-box-shadow: none
                        grid:
                          - grid-template-areas: '"i n"'
                          - grid-template-columns: 18px max-content
                          - column-gap: 6px
                          - align-items: center
                        icon:
                          - color: |
                              [[[
                                const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                                if (soc > 70) return '#6ee7b7';
                                if (soc > 40) return '#fbbf24';
                                return '#f87171';
                              ]]]
                          - width: 16px
                          - height: 16px
                        img_cell:
                          - width: 18px
                          - height: 18px
                          - background: none
                          - border: none
                          - box-shadow: none
                        name:
                          - color: "#f4f4f5"
                          - font-size: 13px
                          - font-weight: 500
                          - justify-self: start
                          - white-space: nowrap
                          - overflow: visible
                          - text-shadow: 0 1px 8px rgba(0,0,0,0.55)
                      style:
                        top: 18px
                        left: auto
                        right: 14px
                        width: auto
                        transform: none
                        background: none
                        border: none
                        box-shadow: none
                        overflow: visible

              lock:
                card:
                  type: custom:button-card
                  entity: script.tesla_lock_toggle
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'Locked' : 'Unlocked';
                    ]]]
                  icon: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open-variant';
                    ]]]
                  tap_action:
                    action: call-service
                    service: script.tesla_lock_toggle
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: "#f4f4f5"
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: |
                          [[[
                            const car = states['input_text.tesla_car_name']?.state || 'tesla';
                            return states['lock.' + car + '_lock']?.state === 'locked'
                              ? '1.5px solid rgba(110, 231, 183, 0.75)'
                              : '1.5px solid rgba(248, 113, 113, 0.75)';
                          ]]]
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              wake:
                card:
                  type: custom:button-card
                  entity: binary_sensor.vehicle_status
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      return states['binary_sensor.vehicle_status']?.state === 'on' ? 'Awake' : 'Asleep';
                    ]]]
                  icon: mdi:lightning-bolt
                  tap_action:
                    action: call-service
                    service: script.tesla_wake
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: |
                          [[[
                            return states['binary_sensor.vehicle_status']?.state === 'on'
                              ? '#f4f4f5'
                              : 'rgba(244,244,245,0.45)';
                          ]]]
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: 1.5px solid rgba(255,255,255,0.18)
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              charge:
                card:
                  type: custom:button-card
                  entity: binary_sensor.vehicle_charge_cable
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: |
                    [[[
                      const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                      const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                      if (charging) return 'Charging';
                      if (plugged) return 'Plugged';
                      return 'Charge';
                    ]]]
                  icon: mdi:ev-plug-tesla
                  tap_action:
                    action: none
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: |
                          [[[
                            const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                            const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                            if (charging) return '#6ee7b7';
                            if (plugged) return '#7dd3fc';
                            return '#f4f4f5';
                          ]]]
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: |
                          [[[
                            const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                            const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                            if (charging) return '1.5px solid rgba(110, 231, 183, 0.75)';
                            if (plugged) return '1.5px solid rgba(125, 211, 252, 0.65)';
                            return '1.5px solid rgba(255,255,255,0.18)';
                          ]]]
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

              unlock:
                card:
                  type: custom:button-card
                  entity: script.tesla_unlock_port
                  layout: vertical
                  show_state: false
                  show_name: true
                  show_label: false
                  size: 20px
                  name: "Unlock"
                  icon: mdi:ev-station
                  tap_action:
                    action: call-service
                    service: script.tesla_unlock_port
                    confirmation:
                      text: Unlock the charge port?
                  hold_action:
                    action: none
                  styles:
                    card:
                      - background: none
                      - background-color: transparent
                      - box-shadow: none
                      - border: none
                      - width: min-content
                      - padding: 0
                      - --ha-card-border-width: 0px
                      - --ha-card-background: transparent
                      - --ha-card-box-shadow: none
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: min-content
                      - justify-items: center
                    icon:
                      - color: "#f4f4f5"
                      - width: 20px
                      - height: 20px
                    img_cell:
                      - width: 48px
                      - height: 48px
                      - border-radius: 50%
                      - background: rgba(255,255,255,0.06)
                      - border: 1.5px solid rgba(255,255,255,0.18)
                    name:
                      - color: rgba(244,244,245,0.58)
                      - font-size: 10px
                      - font-weight: 500
                      - letter-spacing: 0.04em
                      - margin-top: 8px
                      - white-space: nowrap
                      - text-align: center

          # 1.2 Charging Status Card (Conditional)
          - type: conditional
            conditions:
              - entity: binary_sensor.tesla_charging_active
                state: "on"
            card:
              type: custom:button-card
              entity: binary_sensor.tesla_charging_active
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: none
              custom_fields:
                row: |
                  [[[
                    const raw = String(states['sensor.vehicle_time_to_full_charge']?.state || '');
                    const num = (id) => parseFloat(String(states[id]?.state ?? ''));
                    const show = (v, d = 0) => isNaN(v) ? '–' : v.toFixed(d);
                    const amp = num('sensor.vehicle_charger_current');
                    const maxAmp = num('number.vehicle_charge_current');
                    const volt = num('sensor.vehicle_charger_voltage');
                    const power = num('sensor.vehicle_charger_power');
                    const rateVal = num('sensor.vehicle_charge_rate');
                    const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                    const isMi = unitSys !== 'Metric (km, °C, bar)';
                    const rateDisp = isNaN(rateVal) ? '–' : Math.round(isMi ? rateVal * 0.621371 : rateVal);
                    const rateUnit = isMi ? 'mi/h' : 'km/h';
                    let remaining;
                    if (!raw || raw === 'unknown' || raw === 'unavailable') {
                      remaining = 'Calculating time left…';
                    } else {
                      const endTime = new Date(raw);
                      const now = new Date();
                      const diffMs = endTime - now;
                      if (diffMs <= 0) {
                        remaining = 'Almost done';
                      } else {
                        const diffMins = Math.round(diffMs / 60000);
                        const h = Math.floor(diffMins / 60);
                        const m = diffMins % 60;
                        const hStr = String(endTime.getHours()).padStart(2, '0');
                        const mStr = String(endTime.getMinutes()).padStart(2, '0');
                        const dur = h > 0 ? `${h}h ${m}m` : `${m}m`;
                        remaining = `${dur} left · done at ${hStr}:${mStr}`;
                      }
                    }
                    const ampText = isNaN(maxAmp) ? `${show(amp)} A` : `${show(amp)} of ${show(maxAmp)} A`;
                    return `<div style="display:flex;justify-content:space-between;align-items:baseline;width:100%;gap:12px">
                      <span style="color:#7dd3fc;font-size:12px;font-weight:650;letter-spacing:0.12em">CHARGING</span>
                      <span style="color:#f4f4f5;font-size:13px;font-weight:500">${remaining}</span>
                    </div>
                    <div style="margin-top:8px;color:rgba(244,244,245,0.5);font-size:12px;letter-spacing:0.01em">${show(power, 1)} kW · +${rateDisp} ${rateUnit} · ${ampText} · ${show(volt)} V</div>`;
                  ]]]
              styles:
                card:
                  - background: linear-gradient(90deg, rgba(56,189,248,0.16), rgba(12,12,14,0.92) 55%)
                  - border: 1px solid rgba(125,211,252,0.18)
                  - border-radius: 16px
                  - box-shadow: none
                  - padding: 14px 16px
                  - --ha-card-border-width: 0px
                grid:
                  - grid-template-areas: '"row"'
                  - grid-template-columns: 1fr
                custom_fields:
                  row:
                    - width: 100%

          # 1.3 Quick Action Row
          # Lock lives in the hero dock — omitted here to avoid a duplicate.
          - type: horizontal-stack
            cards:
              # Climate
              - type: custom:button-card
                entity: script.tesla_climate_toggle
                icon: mdi:fan
                name: "Climate"
                tap_action:
                  action: call-service
                  service: script.tesla_climate_toggle
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Frunk
              - type: custom:button-card
                entity: script.tesla_frunk_open
                icon: mdi:car-door
                name: "Frunk"
                tap_action:
                  action: call-service
                  service: script.tesla_frunk_open
                  confirmation:
                    text: Open the front trunk (frunk)?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Trunk
              - type: custom:button-card
                entity: script.tesla_trunk_open
                icon: mdi:car-back
                name: "Trunk"
                tap_action:
                  action: call-service
                  service: script.tesla_trunk_open
                  confirmation:
                    text: Open the rear trunk?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Flash Lights
              - type: custom:button-card
                entity: script.tesla_flash_lights
                icon: mdi:flashlight
                name: "Flash"
                tap_action:
                  action: call-service
                  service: script.tesla_flash_lights
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.05)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: "#f4f4f5"
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

              # Sentry
              - type: custom:button-card
                entity: script.tesla_sentry_toggle
                icon: mdi:shield-alert
                name: "Sentry"
                tap_action:
                  action: call-service
                  service: script.tesla_sentry_toggle
                styles:
                  card:
                    - background-color: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return states['switch.' + car + '_sentry_mode']?.state === 'on'
                            ? 'rgba(248, 113, 113, 0.12)'
                            : 'rgba(255,255,255,0.05)';
                        ]]]
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - --ha-card-border-width: 0px
                  icon:
                    - color: |
                        [[[
                          const car = states['input_text.tesla_car_name']?.state || 'tesla';
                          return states['switch.' + car + '_sentry_mode']?.state === 'on' ? '#f87171' : '#f4f4f5';
                        ]]]
                    - width: 22px
                  name:
                    - font-size: 11px
                    - color: rgba(244,244,245,0.62)
                    - font-weight: 500

          # 1.4 Location Strip Card
          # NOTE: the Tesla Fleet integration's device_tracker doesn't do reverse
          # geocoding — its .state is either a configured HA zone name (e.g.
          # "home"/"work") or "not_home". There's no real street address exposed
          # by the API, so this shows the zone name rather than pretending to be
          # a geocoded address like Tessie's own app can.
          # NOTE: icon is an explicit small JS template below (home/work/away/
          # other-zone specific) rather than the card's default — without this,
          # button-card falls back to input_text.tesla_car_name's own registry
          # icon (mdi:car-electric, set in configuration.yaml), rendered at
          # full default size, which is the "gigantic icon" the user reported.
          - type: custom:button-card
            entity: input_text.tesla_car_name
            name: "Current Location"
            size: 28px
            icon: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const zone = String(states['device_tracker.' + car + '_location']?.state || '').toLowerCase();
                if (!zone || zone === 'unknown' || zone === 'unavailable') return 'mdi:map-marker-off';
                if (zone === 'not_home') return 'mdi:map-marker-question';
                if (zone === 'home') return 'mdi:home';
                if (zone.includes('work') || zone.includes('office')) return 'mdi:office-building';
                return 'mdi:map-marker';
              ]]]
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const zone = String(states['device_tracker.' + car + '_location']?.state || '');
                if (!zone || zone === 'unknown' || zone === 'unavailable') return 'Location unavailable';
                if (zone === 'not_home') return 'Away from saved zones';
                return `At ${zone.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}`;
              ]]]
            tap_action:
              action: url
              url_path: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  const attrs = states['device_tracker.' + car + '_location']?.attributes || {};
                  const lat = attrs.latitude;
                  const lon = attrs.longitude;
                  return lat && lon ? `https://maps.google.com/?q=${lat},${lon}` : '#';
                ]]]
            styles:
              card:
                - background-color: rgba(255,255,255,0.04)
                - border: 1px solid rgba(255,255,255,0.08)
                - border-radius: 16px
                - box-shadow: none
                - padding: 12px 16px
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 36px 1fr
                - column-gap: 10px
                - align-items: center
              icon:
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      const zone = String(states['device_tracker.' + car + '_location']?.state || '').toLowerCase();
                      return zone === 'home' ? '#6ee7b7' : '#7dd3fc';
                    ]]]
                - width: 22px
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
                - color: "#f4f4f5"
              label:
                - justify-self: start
                - font-size: 12px
                - margin-top: 0
                - color: rgba(244,244,245,0.5)

      - type: grid
        cards:
          # 1.5 Information Overview Grid (9 cards, 2 columns)
          # NOTE: the original Tessie-parity spec called for a 10th "Profiler"
          # (speedometer/performance-tracking) tile, but no backing entity exists
          # for that yet in this project — omitted rather than faking it. Ask if
          # you'd like a real Profiler feature added.
          - type: grid
            columns: 2
            square: false
            cards:
              # Climate
              - type: custom:button-card
                entity: sensor.vehicle_inside_temperature
                icon: mdi:thermometer
                name: |
                  [[[
                    const car = states['input_text.tesla_car_name']?.state || 'tesla';
                    const hvac = states['climate.' + car + '_climate']?.state;
                    return !hvac || hvac === 'unavailable' || hvac === 'unknown'
                      ? 'Climate'
                      : `Climate · ${hvac === 'off' ? 'off' : 'on'}`;
                  ]]]
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const tempStr = String(states['sensor.vehicle_inside_temperature']?.state || '0');
                    const temp = parseFloat(tempStr);
                    const isF = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                    if (isNaN(temp)) return '–';
                    const disp = isF ? (temp * 9 / 5 + 32) : temp;
                    return `${disp.toFixed(1)}°${isF ? 'F' : 'C'}<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">inside</div>`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Battery
              - type: custom:button-card
                entity: sensor.vehicle_battery_range
                icon: mdi:battery
                name: |
                  [[[
                    const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || ''));
                    return isNaN(soc) ? 'Battery' : `Battery · ${soc.toFixed(0)}%`;
                  ]]]
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                    const isMi = unitSys !== 'Metric (km, °C, bar)';
                    const unit = isMi ? 'mi' : 'km';
                    const adjPct = parseFloat(states['input_number.tesla_wheel_range_adjustment_pct']?.state || '0');
                    const range = String(states['sensor.vehicle_battery_range']?.state || '');
                    let km, approx;
                    if (!range || range === 'unknown' || range === 'unavailable') {
                      const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                      if (isNaN(soc)) return `– ${unit}`;
                      km = soc * 4.1;
                      approx = true;
                    } else {
                      km = parseFloat(range);
                      approx = false;
                    }
                    const calcKm = km * (1 - adjPct / 100);
                    const est = Math.round(isMi ? km * 0.621371 : km);
                    const calc = Math.round(isMi ? calcKm * 0.621371 : calcKm);
                    return `${approx ? '~' : ''}${est} ${unit}<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">≈${calc} ${unit} real-world</div>`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Departure (input_datetime.tesla_next_departure). A date in the
              # past (or the 1970 default) means "not set" -- it used to show
              # the time part of that old date ("00:00").
              - type: custom:button-card
                entity: input_datetime.tesla_next_departure
                icon: mdi:calendar-clock
                name: "Next departure"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: more-info
                label: |
                  [[[
                    const ts = states['input_datetime.tesla_next_departure']?.attributes?.timestamp;
                    const sub = (t) => `<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">${t}</div>`;
                    if (!ts || ts * 1000 <= Date.now()) return 'Not set' + sub('tap to set');
                    const d = new Date(ts * 1000);
                    const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                    const today = new Date(); today.setHours(0, 0, 0, 0);
                    const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 86400000);
                    const day = days === 0 ? 'today' : days === 1 ? 'tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
                    return hm + sub(day);
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Tires
              - type: custom:button-card
                entity: sensor.tesla_tires_status
                icon: mdi:tire
                name: "Tires"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    return String(states['sensor.tesla_tires_status']?.state || 'Unknown');
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Drives
              - type: custom:button-card
                entity: sensor.tesla_driving_time_today_raw
                icon: mdi:map
                name: "Drives today"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: navigate
                  navigation_path: /tesla-analytics/driving
                label: |
                  [[[
                    const sessions = parseInt(states['sensor.tesla_drive_sessions_today']?.state || '0') || 0;
                    const hours = parseFloat(states['sensor.tesla_driving_time_today_raw']?.state || '0') || 0;
                    const mins = Math.round(hours * 60);
                    if (sessions === 0 && mins === 0) return 'None yet';
                    const timeStr = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
                    return `${sessions} · ${timeStr}`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Charges
              - type: custom:button-card
                entity: sensor.tesla_charging_time_today_raw
                icon: mdi:lightning-bolt
                name: "Charges today"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: navigate
                  navigation_path: /tesla-analytics/charging
                label: |
                  [[[
                    const sessions = parseInt(states['sensor.tesla_charge_sessions_today']?.state || '0') || 0;
                    const hours = parseFloat(states['sensor.tesla_charging_time_today_raw']?.state || '0') || 0;
                    const mins = Math.round(hours * 60);
                    if (sessions === 0 && mins === 0) return 'None yet';
                    const timeStr = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
                    return `${sessions} · ${timeStr}`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Parked (Tessie "Idles"): how long since the last drive ended.
              - type: custom:button-card
                entity: binary_sensor.tesla_driving_active
                icon: mdi:parking
                name: "Parked for"
                size: 18px
                show_state: false
                show_label: true
                # Re-render on any state change so the elapsed time stays fresh.
                triggers_update: all
                tap_action:
                  action: none
                label: |
                  [[[
                    const drv = states['binary_sensor.tesla_driving_active'];
                    if (!drv || ['unknown', 'unavailable'].includes(drv.state)) return '–';
                    if (drv.state === 'on') return 'Driving now';
                    const mins = Math.max(0, Math.round((Date.now() - new Date(drv.last_changed).getTime()) / 60000));
                    if (mins < 60) return `${mins}m`;
                    if (mins < 48 * 60) return `${Math.floor(mins / 60)}h ${mins % 60}m`;
                    return `${Math.floor(mins / 1440)} days`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Activity
              - type: custom:button-card
                entity: sensor.vehicle_shift_state
                icon: mdi:state-machine
                name: "Activity"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const online = states['binary_sensor.vehicle_status']?.state === 'on';
                    const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
                    const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                    const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                    if (driving) return 'Driving';
                    if (charging) return 'Charging';
                    if (!online) return 'Asleep';
                    return plugged ? 'Parked, plugged in' : 'Parked';
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Automatic charging mode. Tap opens Analytics -> Settings, where
              # Smart Charging and Full Auto Charging are set up (it used to
              # silently toggle Smart Charging).
              - type: custom:button-card
                entity: input_boolean.tesla_enable_smart_charging
                icon: mdi:wand-plus
                name: "Auto charging"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const sub = (t) => `<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">${t}</div>`;
                    if (states['input_boolean.tesla_full_auto_charging']?.state === 'on') return 'Full auto' + sub('cheapest time');
                    if (states['input_boolean.tesla_enable_smart_charging']?.state === 'on') {
                      const t = (id) => String(states[id]?.state || '').slice(0, 5);
                      return 'Time window' + sub(`${t('input_datetime.tesla_smart_charge_window_start')}–${t('input_datetime.tesla_smart_charge_window_end')}`);
                    }
                    return 'Off' + sub('car decides');
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /tesla-analytics/settings
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0



          # 1.6 Vehicle Specifications Footer
          - type: markdown
            content: |
              ---
              **{{ states('input_text.tesla_model') | default('Tesla Model X') }}** • VIN: {{ states('sensor.tesla_vin_live') | default('Unknown') }} • Plate: {{ states('input_text.tesla_plate') | default('Unknown') }}
          
              {% set car = states('input_text.tesla_car_name') %}
              {% set unit_sys = states('input_select.tesla_unit_system') %}
              {% set is_mi = unit_sys != 'Metric (km, °C, bar)' %}
              {% set odo_km = states('sensor.vehicle_odometer') | float(0) %}
              {% set odo = (odo_km * 0.621371) if is_mi else odo_km %}
              Firmware: {{ state_attr('update.' + car + '_update', 'installed_version') | default('Unknown') }}{{ ' ⬆️' if states('update.' + car + '_update') == 'on' else '' }} • Odometer: {{ odo | round(0) }} {{ 'mi' if is_mi else 'km' }} • Status: {{ 'Online' if is_state('binary_sensor.vehicle_status', 'on') else 'Offline' }}

  # ========== VIEW 2: CONTROLS ==========
  - title: Controls
    path: controls
    icon: mdi:tune
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # Vehicle Status Hero Card
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              status: |
                [[[
                  const online = states['binary_sensor.vehicle_status']?.state === 'on';
                  const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
                  const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                  const soc = parseFloat(states['sensor.vehicle_battery_level']?.state || '0');
                  const range = states['sensor.vehicle_battery_range']?.state;
                  const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                  const isMi = unitSys !== 'Metric (km, °C, bar)';
                  const rangeUnit = isMi ? 'mi' : 'km';
                  const estimated = !range || range === 'unknown' || range === 'unavailable';
                  const rangeKm = estimated ? (soc * 4.1) : parseFloat(range);
                  const adjPct = parseFloat(states['input_number.tesla_wheel_range_adjustment_pct']?.state || '0');
                  const calcKm = rangeKm * (1 - adjPct / 100);
                  const rangeStr = `${estimated ? '~' : ''}${Math.round(isMi ? rangeKm * 0.621371 : rangeKm)} ${rangeUnit} (≈${Math.round(isMi ? calcKm * 0.621371 : calcKm)} real)`;

                  let statePill, pillBg, pillFg;
                  if (!online) {
                    statePill = 'Asleep'; pillBg = 'rgba(255,255,255,0.08)'; pillFg = 'rgba(244,244,245,0.7)';
                  } else if (driving) {
                    statePill = 'Driving'; pillBg = 'rgba(125,211,252,0.18)'; pillFg = '#7dd3fc';
                  } else if (charging) {
                    statePill = 'Charging'; pillBg = 'rgba(110,231,183,0.18)'; pillFg = '#6ee7b7';
                  } else {
                    statePill = 'Parked'; pillBg = 'rgba(255,255,255,0.08)'; pillFg = 'rgba(244,244,245,0.7)';
                  }

                  const battColor = soc > 70 ? '#6ee7b7' : soc > 40 ? '#fbbf24' : '#f87171';
                  return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:16px">
                    <span style="background:${pillBg};color:${pillFg};font-size:12px;font-weight:650;letter-spacing:0.08em;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.08)">${statePill}</span>
                    <div style="text-align:right;min-width:42%">
                      <div style="color:#f4f4f5;font-size:18px;font-weight:600;letter-spacing:-0.03em">${soc.toFixed(0)}% <span style="color:rgba(244,244,245,0.45);font-size:13px;font-weight:500">${rangeStr}</span></div>
                      <div style="width:100%;background:rgba(255,255,255,0.08);border-radius:99px;height:4px;margin-top:8px">
                        <div style="width:${Math.min(100, soc)}%;background:${battColor};height:4px;border-radius:99px"></div>
                      </div>
                    </div>
                  </div>`;
                ]]]
              details: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  const online = states['binary_sensor.vehicle_status']?.state === 'on';
                  const sentry = states['switch.' + car + '_sentry_mode']?.state === 'on';
                  const lock = states['lock.' + car + '_lock']?.state;
