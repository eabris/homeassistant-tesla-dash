                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
