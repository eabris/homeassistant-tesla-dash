  # ========== VIEW 6: COST PROJECTIONS ==========
  - title: Cost Projections
    path: cost
    icon: mdi:cash-multiple
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          # 6.0 Page header with a one-line explanation of the numbers.
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              block: |
                [[[
                  return `<div style="width:100%;text-align:left">
                    <div style="color:#fff;font-size:18px;font-weight:700">Cost Projections</div>
                    <div style="color:#999;font-size:12px;margin-top:4px;line-height:1.45">
                      What charging costs you, and what the same driving would cost in a petrol/diesel car.
                      Estimated from your average cost per day this month and last month.
                      All charging is included; charging away from home is priced at your Default Electricity Rate
                      (Supercharger bills aren't available from Tesla's API).
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: rgba(28, 28, 30, 0.95)
                - border-radius: 16px
                - padding: 16px 20px
              grid:
                - grid-template-areas: '"block"'
                - grid-template-columns: 1fr
              custom_fields:
                block:
                  - width: 100%

          # 6.0a Electricity tariff status (agents.md Section 21). Tap opens
          # Analytics → Settings, where the tariff is configured.
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /tesla-analytics/settings
            custom_fields:
              block: |
                [[[
                  const mode = states['input_select.tesla_tariff_mode']?.state || 'Off';
                  const tariff = mode === 'Tariff A' || mode === 'Tariff D';
                  const active = states['sensor.tesla_active_charging_price'];
                  const price = parseFloat(active?.state);
                  const source = active?.attributes?.source || '';
                  const unit = tariff ? 'Ft' : (states['sensor.tesla_currency_symbol']?.state || 'Ft');
                  const used = parseFloat(states['sensor.tesla_quota_usage_monthly']?.state);
                  const quota = parseFloat(states['sensor.tesla_discounted_quota_monthly']?.state);
                  const quotaOn = states['input_boolean.tesla_use_discounted_quota']?.state === 'on';
                  const fullAuto = states['input_boolean.tesla_full_auto_charging']?.state === 'on';
                  const autoOwned = states['input_boolean.tesla_auto_charge_owned']?.state === 'on';
                  const autoSummary = states['sensor.tesla_auto_charge_plan']?.attributes?.summary || '';
                  const fmt = (v, digits) => isNaN(v) ? '–' : v.toLocaleString('hu-HU', { maximumFractionDigits: digits });
                  const pct = (!isNaN(used) && quota > 0) ? Math.min(100, used / quota * 100) : 0;
                  const barColor = pct >= 100 ? '#F44336' : (pct >= 80 ? '#FF9800' : '#4CAF50');
                  const quotaBlock = tariff && quotaOn
                    ? `<div style="margin-top:10px">
                        <div style="display:flex;justify-content:space-between;color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">
                          <span>DISCOUNTED QUOTA</span><span>${fmt(used, 0)} / ${fmt(quota, 0)} kWh</span>
                        </div>
                        <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.1);margin-top:4px;overflow:hidden">
                          <div style="height:100%;width:${pct}%;background:${barColor}"></div>
                        </div>
                      </div>`
                    : '';
                  const hint = tariff ? '' :
                    `<div style="color:#888;font-size:11px;margin-top:6px">Flat default rate — tap to pick Tariff A or D</div>`;
                  const dBadge = fullAuto
                    ? `<div style="color:${autoOwned ? '#4CAF50' : '#888'};font-size:11px;font-weight:600;margin-top:6px">🤖 Full auto · ${autoSummary}</div>`
                    : '';
                  return `<div style="width:100%;text-align:left">
                    <div style="color:#888;font-size:11px;font-weight:600;letter-spacing:1.5px;padding-bottom:4px">🇭🇺 TARIFF · ${mode.toUpperCase()}</div>
                    <div style="color:#fff;font-size:20px;font-weight:700">${fmt(price, 2)} ${unit}/kWh</div>
                    <div style="color:#888;font-size:11px">${source}</div>
                    ${quotaBlock}${dBadge}${hint}
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: rgba(28, 28, 30, 0.95)
                - border-radius: 16px
                - padding: 16px 20px
              grid:
                - grid-template-areas: '"block"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                block:
                  - width: 100%

      - type: grid
        cards:
          # 6.1-6.3 Projection cards (button_card_templates: tesla_cost_period)
          - type: custom:button-card
            template: tesla_cost_period
            variables:
              period: month
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_cost_period
            variables:
              period: year
      - type: grid
        cards:
          - type: custom:button-card
            template: tesla_cost_period
            variables:
              period: five
