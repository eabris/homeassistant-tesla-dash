                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Idles
              - type: custom:button-card
                entity: sensor.tesla_charging_time_3d_raw
