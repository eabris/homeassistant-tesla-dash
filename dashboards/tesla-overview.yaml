                name: "Automation"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    return states['input_boolean.tesla_enable_smart_charging']?.state === 'on' ? 'On' : 'Off';
                  ]]]
                tap_action:
                  action: call-service
                  service: input_boolean.toggle
                  service_data:
                    entity_id: input_boolean.tesla_enable_smart_charging
                styles:
