  # ========== VIEW 4: BATTERY ==========
  - title: Battery
    path: battery
    icon: mdi:battery
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # 4.1 SOC hero — the old gauge was a nameless thin bar, which
          # rendered as the empty rounded strip at the top of this tab.
          - type: custom:button-card
            entity: sensor.vehicle_battery_level
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              hero: |
                [[[
                  const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                  const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                  const plugged = states['binary_sensor.vehicle_charge_cable']?.state === 'on';
                  const limit = parseFloat(states['number.vehicle_charge_limit']?.state || '100');
                  const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                  const isMi = unitSys !== 'Metric (km, °C, bar)';
                  const unit = isMi ? 'mi' : 'km';
                  const rawRange = String(states['sensor.vehicle_battery_range']?.state || '');
                  const estimated = !rawRange || rawRange === 'unknown' || rawRange === 'unavailable';
                  const rangeKm = estimated ? soc * 4.1 : parseFloat(rawRange);
                  const adjPct = parseFloat(states['input_number.tesla_wheel_range_adjustment_pct']?.state || '0');
                  const calcKm = rangeKm * (1 - adjPct / 100);
                  const range = Math.round(isMi ? rangeKm * 0.621371 : rangeKm);
                  const calc = Math.round(isMi ? calcKm * 0.621371 : calcKm);
                  const wheel = states['input_select.tesla_wheel_size']?.state || '';
                  const color = soc > 70 ? '#6ee7b7' : soc > 40 ? '#fbbf24' : '#f87171';
                  const status = charging ? 'Charging' : plugged ? 'Plugged in' : 'Not plugged in';
                  const statusColor = charging ? '#6ee7b7' : plugged ? '#7dd3fc' : 'rgba(244,244,245,0.5)';
                  const socSafe = isNaN(soc) ? 0 : Math.min(100, Math.max(0, soc));
                  const limitSafe = isNaN(limit) ? 100 : Math.min(100, Math.max(0, limit));
                  return `<div style="width:100%">
                    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
                      <div>
                        <div style="color:rgba(244,244,245,0.48);font-size:11px;font-weight:500;letter-spacing:0.08em">BATTERY</div>
                        <div style="color:#f4f4f5;font-size:42px;font-weight:600;letter-spacing:-0.04em;line-height:1.05;margin-top:4px">${isNaN(soc) ? '–' : soc.toFixed(0)}<span style="font-size:22px;font-weight:500;color:rgba(244,244,245,0.55)">%</span></div>
                      </div>
                      <div style="text-align:right">
                        <div style="color:${statusColor};font-size:12px;font-weight:500">${status}</div>
                        <div style="color:#f4f4f5;font-size:16px;font-weight:600;margin-top:4px">${isNaN(range) ? '–' : (estimated ? '~' : '') + range} ${unit}</div>
                        <div style="color:rgba(244,244,245,0.45);font-size:11px;font-weight:500;margin-top:2px">≈${isNaN(calc) ? '–' : calc} ${unit} real-world${wheel ? ` (${wheel} wheels)` : ''}</div>
                      </div>
                    </div>
                    <div style="position:relative;width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:99px;margin-top:16px;overflow:hidden">
                      <div style="position:absolute;left:0;top:0;height:100%;width:${limitSafe}%;background:rgba(255,255,255,0.06)"></div>
                      <div style="position:absolute;left:0;top:0;height:100%;width:${socSafe}%;background:${color};border-radius:99px"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-top:8px;color:rgba(244,244,245,0.42);font-size:11px;font-weight:500">
                      <span>Charges up to ${limitSafe.toFixed(0)}% (car's charge limit)</span>
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - background-color: rgba(255,255,255,0.04)
                - border: 1px solid rgba(255,255,255,0.08)
                - border-radius: 20px
                - box-shadow: none
                - padding: 18px 18px 16px
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"hero"'
                - grid-template-columns: 1fr
              custom_fields:
                hero:
                  - width: 100%

          # 4.2 Telemetry tiles (battery % and range are in the hero above)
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.vehicle_battery_level
                icon: mdi:battery-high
                name: "In battery"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || ''));
                    const capacity = parseFloat(String(states['input_number.tesla_battery_capacity_kwh']?.state || '100'));
                    if (isNaN(soc) || isNaN(capacity)) return '– kWh';
                    return `${(soc / 100 * capacity).toFixed(1)} kWh<div style="font-size:11px;font-weight:500;color:rgba(244,244,245,0.45)">of ${capacity.toFixed(0)} kWh</div>`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              - type: custom:button-card
                entity: sensor.vehicle_charge_energy_added
                icon: mdi:battery-plus-variant
                name: |
                  [[[
                    return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'Added so far' : 'Last charge added';
                  ]]]
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const v = parseFloat(String(states['sensor.vehicle_charge_energy_added']?.state || ''));
                    return isNaN(v) ? '– kWh' : `${v.toFixed(1)} kWh`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              - type: custom:button-card
                entity: sensor.vehicle_charger_power
                icon: mdi:flash
                name: "Charging power"
                size: 18px
                show_state: false
                show_label: true
                tap_action:
                  action: none
                label: |
                  [[[
                    const charging = states['binary_sensor.tesla_charging_active']?.state === 'on';
                    if (!charging) return 'Not charging';
                    const v = parseFloat(String(states['sensor.vehicle_charger_power']?.state || ''));
                    return isNaN(v) ? '– kW' : `${v.toFixed(1)} kW`;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
