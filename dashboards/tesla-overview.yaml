              # Drives
              - type: custom:button-card
                entity: sensor.tesla_driving_time_today_raw
                icon: mdi:map
                name: "Drives"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const sessions = parseInt(states['sensor.tesla_drive_sessions_today']?.state || '0');
                    const hours = parseFloat(states['sensor.tesla_driving_time_today_raw']?.state || '0');
                    const mins = Math.round(hours * 60);
                    if (sessions === 0 && mins === 0) return 'No drives today';
                    const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                    return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
                  ]]]
                styles:
