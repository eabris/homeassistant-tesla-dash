            icon: mdi:seat
            name: "RL"
            tap_action:
              action: call-service
              service: script.tesla_seat_heater_next_rl
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const state = String(states['select.' + car + '_seat_heater_rear_left']?.state || '0');
                return state === 'unknown' ? '0' : state;
              ]]]

          - type: custom:button-card
            show_icon: false
            show_name: false
            styles:
