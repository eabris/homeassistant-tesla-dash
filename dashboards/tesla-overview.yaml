                ha-card {
                  background: rgba(255,255,255,0.04) !important;
                  border: 1px solid rgba(255,255,255,0.08) !important;
                  border-radius: 16px !important;
                  box-shadow: none !important;
                }

          # 4.4 Action Row (Start/Stop + Unlock Port)
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: script.tesla_charge_stop
                icon: mdi:lightning-bolt
                name: |
                  [[[
                    return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'Stop charging' : 'Start charging';
                  ]]]
                size: 20px
                show_state: false
                tap_action:
                  action: call-service
                  service: |
                    [[[
                      return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'script.tesla_charge_stop' : 'script.tesla_charge_start';
                    ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          return states['binary_sensor.tesla_charging_active']?.state === 'on'
                            ? 'rgba(248, 113, 113, 0.12)'
                            : 'rgba(255,255,255,0.04)';
                        ]]]
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 12px
                    - --ha-card-border-width: 0px
                  icon:
                    - width: 20px
                    - color: |
                        [[[
                          return states['binary_sensor.tesla_charging_active']?.state === 'on' ? '#f87171' : '#6ee7b7';
                        ]]]
                  name:
                    - font-size: 12px
                    - font-weight: 500
                    - color: rgba(244,244,245,0.72)

              - type: custom:button-card
                entity: script.tesla_unlock_port
                icon: mdi:ev-station
                name: "Unlock port"
                size: 20px
                show_state: false
                tap_action:
                  action: call-service
                  service: script.tesla_unlock_port
                  confirmation:
                    text: Unlock the charge port?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 12px
                    - --ha-card-border-width: 0px
                  icon:
                    - width: 20px
                    - color: "#f4f4f5"
                  name:
                    - font-size: 12px
                    - font-weight: 500
                    - color: rgba(244,244,245,0.72)

  # ========== VIEW 5: TIRES ==========
  - title: Tires
    path: tires
    icon: mdi:tire
    cards:
      - type: vertical-stack
        cards:
          # 5.1 Target Pressure Notice
          # Value comes from input_number.tesla_recommended_tire_pressure
          # (editable on the Settings tab) — Tesla's Fleet API doesn't expose a
          # placard/recommended pressure, only live per-wheel readings, and the
          # correct value depends on your specific wheel size (see your car's
          # driver-door placard). Stored in bar; converted to psi for display.
          - type: markdown
            content: >
              {% set p = states('input_number.tesla_recommended_tire_pressure') | float(2.9) %}
              {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
              {% set size = states('input_select.tesla_wheel_size') %}
              💡 **Recommended cold pressure ({{ size }} wheels): {{ (p * 14.5038) | round(0) ~ ' psi' if is_psi else p | round(2) ~ ' bar' }}**

          # 5.2 Tire Pressure Overlay (top-down car image)
          # Small thumbnail-style card (150px wide, centered) with 4 minimal
          # pressure readouts overlaid. No lock icon here, per explicit user
          # request — this tab is pressure-readouts only.
          # NOTE: assumes the image has the front of the car facing up (FL/FR
          # at top, RL/RR at bottom) — nudge the top/left % below if your
          # teslaTopDown.png is oriented differently.
          # NOTE: card-mod ("card_mod:" key) is used here, not the flat
          # `style: {border-radius: ..., overflow: ...}` mapping this file's
          # picture-elements cards used previously — that flat-mapping form
          # isn't valid card_mod syntax (card_mod expects a CSS string, or a
          # map of shadow-DOM-part-selector -> CSS string) and isn't part of
          # picture-elements' own schema either, so it was silently a no-op.
          # card-mod is already a required HACS card for this project (see
          # README's HACS card table).
          # NOTE: the 4 pressure elements below follow the user-supplied
          # card_mod pattern as closely as possible: transparent/borderless
          # ha-card (no green pill background/padding — that previous
          # attempt made the numbers unreadable), left-aligned primary/
          # secondary text sized via `ha-tile-info$`. A text-shadow was
          # added purely so white text stays legible over a busy/light car
          # photo background — remove it if you'd rather match the pasted
          # snippet exactly. Kept this project's live bar/psi unit-system
          # toggle (reading input_select.tesla_unit_system) instead of the
          # pasted snippet's static "Bar" secondary, and read the existing
          # sensor.vehicle_tyre_pressure_* Fleet Sensor Aliases directly
          # (no need to rebuild `sensor.<car>_tyre_pressure_*` via
          # input_text.tesla_car_name string concatenation — the alias layer
          # already exists for exactly this, see agents.md Section 5).
          - type: picture-elements
            image: media-source://media_source/local/teslaTopDown.png
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  overflow: hidden;
                  width: 150px;
                  margin: 0 auto;
                }
            elements:
              # FL
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_front_left') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ (p * 14.5038) | round(1) if is_psi else p | round(2) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'Bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 15%
                  left: 12%
                  width: 20%

              # FR
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_front_right') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ (p * 14.5038) | round(1) if is_psi else p | round(2) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'Bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 15%
                  left: 90%
                  width: 20%

              # RL
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_rear_left') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ (p * 14.5038) | round(1) if is_psi else p | round(2) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'Bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 78%
                  left: 12%
                  width: 20%

              # RR
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_rear_right') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ (p * 14.5038) | round(1) if is_psi else p | round(2) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'Bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 78%
                  left: 90%
                  width: 20%

          # 5.3 Historical Pressure Chart
          # Two variants (bar vs psi) because apexcharts-card's yaxis min/max and
          # axis title are static YAML — they can't follow input_select.tesla_unit_system
          # live like a JS button-card label can. Only US Imperial switches to psi;
          # UK stays on bar (matches the rest of the pressure readouts on this tab).
          - type: conditional
            conditions:
              - entity: input_select.tesla_unit_system
                state_not: "US Imperial (mi, °F, psi)"
            card:
              type: custom:apexcharts-card
              graph_span: 7d
              cache: true
              header:
                show: true
                title: "Tire Pressure History (7 days)"
              apex_config:
                chart:
                  height: 300
                yaxis:
                  - min: 1.5
                    max: 3.8
                    title:
                      text: "bar"
                colors:
                  - '#FF6B6B'
                  - '#4ECDC4'
                  - '#45B7D1'
                  - '#FFA07A'
                plotOptions:
                  area:
                    fillTo: zero
              series:
                - entity: sensor.vehicle_tyre_pressure_front_left
                  name: "Front Left"
                  type: line
                  stroke_width: 2
                - entity: sensor.vehicle_tyre_pressure_front_right
                  name: "Front Right"
                  type: line
                  stroke_width: 2
                - entity: sensor.vehicle_tyre_pressure_rear_left
                  name: "Rear Left"
                  type: line
                  stroke_width: 2
                - entity: sensor.vehicle_tyre_pressure_rear_right
                  name: "Rear Right"
                  type: line
                  stroke_width: 2

          - type: conditional
            conditions:
              - entity: input_select.tesla_unit_system
                state: "US Imperial (mi, °F, psi)"
            card:
              type: custom:apexcharts-card
              graph_span: 7d
              cache: true
              header:
                show: true
                title: "Tire Pressure History (7 days)"
              apex_config:
                chart:
                  height: 300
                yaxis:
                  - min: 21.8
                    max: 55.1
                    title:
                      text: "psi"
                colors:
                  - '#FF6B6B'
                  - '#4ECDC4'
                  - '#45B7D1'
                  - '#FFA07A'
                plotOptions:
                  area:
                    fillTo: zero
              series:
                - entity: sensor.vehicle_tyre_pressure_front_left
                  name: "Front Left"
                  type: line
                  stroke_width: 2
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_front_right
                  name: "Front Right"
                  type: line
                  stroke_width: 2
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_rear_left
                  name: "Rear Left"
                  type: line
                  stroke_width: 2
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_rear_right
                  name: "Rear Right"
                  type: line
                  stroke_width: 2
                  transform: "return x * 14.5038;"

  # ========== VIEW 6: COST PROJECTIONS ==========
  - title: Cost Projections
    path: cost
    icon: mdi:cash-multiple
    cards:
      - type: vertical-stack
        cards:
          # 6.0 Page Header (title only, no icon)
          - type: custom:button-card
            name: "Cost Projections"
            show_icon: false
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.3)

          # NOTE: Supercharger / Other Networks columns are shown as 0 — this
          # project only tracks Home electricity cost (via the Saved Location
          # Rates config). Tessie itself syncs real Supercharging costs from your
          # Tesla account; there's no equivalent automation here yet, so these
          # placeholders exist for layout parity but always read 0 until (if
          # ever) Supercharger cost tracking is implemented.
          - type: vertical-stack
            cards:
              # MONTHLY
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_state: false
                tap_action:
                  action: none
                custom_fields:
                  block: |
                    [[[
                      const monthly = parseFloat(states['sensor.tesla_monthly_electric_cost']?.state || '0') || 0;
                      const monthlyFuel = parseFloat(states['sensor.tesla_monthly_fuel_cost']?.state || '0') || 0;
                      const savings = monthlyFuel - monthly;
                      const currencySymbol = states['sensor.tesla_currency_symbol']?.state || 'Ft';
                      const currencyLocale = states['sensor.tesla_currency_locale']?.state || 'hu-HU';
                      const row = (icon, label, value) =>
                        `<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.07)">
                          <span style="font-size:22px;width:26px;text-align:center;flex-shrink:0">${icon}</span>
                          <div>
                            <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                            <div style="color:#fff;font-size:20px;font-weight:700">${value}</div>
                          </div>
                        </div>`;
                      const savingsRow = (value) =>
                        `<div style="display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.07)">
                          <span style="font-size:16px;width:26px;text-align:center;flex-shrink:0">💰</span>
                          <div>
                            <div style="color:#888;font-size:9px;font-weight:600;letter-spacing:1.2px">SAVINGS VS GAS CAR</div>
                            <div style="color:#4CAF50;font-size:13px;font-weight:600">${value}</div>
                          </div>
                        </div>`;
                      return `<div style="width:100%;text-align:left">
                        <div style="color:#888;font-size:11px;font-weight:600;letter-spacing:1.5px;padding-bottom:4px">📅 MONTHLY</div>
                        ${row('🏠', 'HOME', Math.round(monthly).toLocaleString(currencyLocale) + ' ' + currencySymbol)}
                        ${row('⚡', 'SUPERCHARGER', '0 ' + currencySymbol)}
                        ${row('🔌', 'OTHER NETWORKS', '0 ' + currencySymbol)}
                        ${savingsRow(Math.round(savings).toLocaleString(currencyLocale) + ' ' + currencySymbol + ' vs a petrol/diesel car')}
                      </div>`;
                    ]]]
                styles:
                  card:
                    - background-color: rgba(28, 28, 30, 0.95)
                    - border-radius: 16px
                    - padding: 16px 20px
                  grid:
                    - grid-template-areas: '"block"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 1fr
                  custom_fields:
                    block:
                      - width: 100%

              # ANNUAL
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_state: false
                tap_action:
                  action: none
                custom_fields:
                  block: |
                    [[[
                      const annual = parseFloat(states['sensor.tesla_annual_electric_cost']?.state || '0') || 0;
                      const annualFuel = parseFloat(states['sensor.tesla_annual_fuel_cost_equivalent']?.state || '0') || 0;
                      const savings = annualFuel - annual;
                      const currencySymbol = states['sensor.tesla_currency_symbol']?.state || 'Ft';
                      const currencyLocale = states['sensor.tesla_currency_locale']?.state || 'hu-HU';
                      const row = (icon, label, value) =>
                        `<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.07)">
                          <span style="font-size:22px;width:26px;text-align:center;flex-shrink:0">${icon}</span>
                          <div>
                            <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                            <div style="color:#fff;font-size:20px;font-weight:700">${value}</div>
                          </div>
                        </div>`;
                      const savingsRow = (value) =>
                        `<div style="display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.07)">
                          <span style="font-size:16px;width:26px;text-align:center;flex-shrink:0">💰</span>
