            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                return states['climate.' + car + '_climate']?.state !== 'off' ? 'On' : 'Off';
              ]]]
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          - type: custom:button-card
            entity: script.tesla_defrost_toggle
            icon: mdi:snowflake
            name: "Defrost"
            tap_action:
              action: call-service
              service: script.tesla_defrost_toggle
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                return String(states['switch.' + car + '_defrost']?.state || 'off') === 'on' ? 'On' : 'Off';
              ]]]
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          - type: custom:button-card
            icon: mdi:shield-thermometer
            name: "Cabin Protect"
            show_label: true
            label: "Not available in Tesla Fleet API"
            tap_action:
              action: none
            styles:
              card:
                - opacity: 0.4

  # ========== VIEW 4: BATTERY ==========
  - title: Battery
    path: battery
    icon: mdi:battery
    cards:
      # 4.1 Primary Battery Gauge
      - type: custom:button-card
        entity: sensor.vehicle_battery_level
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          bar: |
            [[[
              const soc = parseFloat(states['sensor.vehicle_battery_level']?.state || '0');
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const limit = parseFloat(states['number.' + car + '_charge_limit']?.state || '100');
              const color = soc > 70 ? '#4CAF50' : soc > 40 ? '#FFC107' : '#F44336';
              return `<div style="width:100%;background:rgba(255,255,255,0.1);border-radius:8px;height:14px;overflow:hidden;position:relative">
                <div style="width:${limit}%;background:rgba(255,255,255,0.08);height:100%;position:absolute;border-radius:8px"></div>
                <div style="width:${soc}%;background:${color};height:100%;border-radius:8px;position:relative"></div>
              </div>`;
            ]]]
        styles:
          card:
            - padding: 14px 16px
            - background-color: rgba(0, 0, 0, 0.2)
          custom_fields:
            bar:
              - width: 100%

      # 4.2 Telemetry Table (2×4 grid)
      - type: grid
        columns: 2
        cards:
          # LEVEL
          - type: custom:button-card
            entity: sensor.vehicle_battery_level
            icon: mdi:percent
            name: "LEVEL"
            show_label: true
            label: |
              [[[
                const level = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                return isNaN(level) ? '– %' : `${level.toFixed(0)}%`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # RANGE
          - type: custom:button-card
            entity: sensor.vehicle_battery_range
            icon: mdi:map-marker-distance
            name: "RANGE"
            show_label: true
            label: |
              [[[
                const unitSys = states['input_select.tesla_unit_system']?.state || 'Metric (km, °C, bar)';
                const isMi = unitSys !== 'Metric (km, °C, bar)';
                const unit = isMi ? 'mi' : 'km';
                const conv = (km) => isMi ? km * 0.621371 : km;
                const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                const rawEst = String(states['sensor.vehicle_battery_range']?.state || '');
                const estKm = (!rawEst || rawEst === 'unknown' || rawEst === 'unavailable')
                  ? soc * 4.1
                  : parseFloat(rawEst);
                const rawIdeal = String(states['sensor.vehicle_ideal_battery_range']?.state || '');
                const idealKm = (!rawIdeal || rawIdeal === 'unknown' || rawIdeal === 'unavailable')
                  ? estKm * 0.9
                  : parseFloat(rawIdeal);
                const estVal = Math.round(conv(estKm));
                const idealVal = Math.round(conv(idealKm));
                return isNaN(estVal) ? `– ${unit}` : `${estVal} ${unit} (${idealVal} ${unit})`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

          # DRAIN
          - type: custom:button-card
            entity: sensor.vehicle_battery_level
            icon: mdi:water-remove
            name: "DRAIN"
            show_label: true
            label: |
              [[[
                const charging = String(states['sensor.vehicle_charging']?.state || '').toLowerCase();
                const driving = states['binary_sensor.tesla_driving_active']?.state === 'on';
                if (charging === 'charging') return '+charging';
                if (driving) return 'Driving';
                return '–';
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # ENERGY
          - type: custom:button-card
            entity: sensor.vehicle_battery_level
            icon: mdi:lightning-bolt
            name: "ENERGY"
            show_label: true
            label: |
              [[[
                const soc = parseFloat(String(states['sensor.vehicle_battery_level']?.state || '0'));
                const capacity = parseFloat(String(states['input_number.tesla_battery_capacity_kwh']?.state || '100'));
                if (isNaN(soc) || isNaN(capacity)) return '– kWh';
                const currentKwh = (soc / 100 * capacity).toFixed(2);
                return `${currentKwh} / ${capacity.toFixed(2)} kWh`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

          # AMPERAGE
          - type: custom:button-card
            entity: sensor.vehicle_charger_current
            icon: mdi:sine-wave
            name: "AMPERAGE"
            show_label: true
            label: |
              [[[
                const ampStr = String(states['sensor.vehicle_charger_current']?.state || '0');
                const amp = parseFloat(ampStr);
                return isNaN(amp) ? '0.0 A' : `${amp.toFixed(1)} A`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # VOLTAGE
          - type: custom:button-card
            entity: sensor.vehicle_charger_voltage
            icon: mdi:flash
            name: "VOLTAGE"
            show_label: true
            label: |
              [[[
                const voltStr = String(states['sensor.vehicle_charger_voltage']?.state || '0');
                const volt = parseFloat(voltStr);
                return isNaN(volt) ? '0 V' : `${volt.toFixed(0)} V`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # ENERGY USED (Lifetime, real accumulated driving consumption)
          - type: custom:button-card
            entity: sensor.tesla_drive_energy_consumed_total
            icon: mdi:meter-gas
            name: "ENERGY USED"
            show_label: true
            label: |
              [[[
                const raw = String(states['sensor.tesla_drive_energy_consumed_total']?.state || '');
                const kwh = parseFloat(raw);
                return (!raw || raw === 'unknown' || raw === 'unavailable' || isNaN(kwh))
                  ? '– kWh'
                  : `${kwh.toLocaleString('hu-HU', {maximumFractionDigits: 2})} kWh`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

      # 4.3 Charge Limit Slider
      - type: custom:mushroom-number-card
        entity: number.vehicle_charge_limit
        name: "Charge Limit"
        icon: mdi:battery-charging-100
        display_mode: slider
        fill_container: false

      # 4.4 Action Row (Start/Stop + Unlock Port)
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: script.tesla_charge_stop
            icon: mdi:lightning-bolt
            name: |
              [[[
                return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'Stop Charging' : 'Start Charging';
              ]]]
            tap_action:
              action: call-service
              service: |
                [[[
                  return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'script.tesla_charge_stop' : 'script.tesla_charge_start';
                ]]]
            styles:
              card:
                - background-color: |
                    [[[
                      return states['binary_sensor.tesla_charging_active']?.state === 'on' ? 'rgba(244, 67, 54, 0.2)' : 'rgba(76, 175, 80, 0.2)';
                    ]]]

          - type: custom:button-card
            entity: script.tesla_unlock_port
            icon: mdi:lock-open
            name: "Unlock Port"
            tap_action:
              action: call-service
              service: script.tesla_unlock_port
              confirmation:
                text: Unlock the charge port?
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

  # ========== VIEW 5: TIRES ==========
  - title: Tires
    path: tires
    icon: mdi:tire
    cards:
      # 5.1 Target Pressure Notice
      - type: markdown
        content: >
          💡 **Recommended cold pressure:
          {{ '42 psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else '2.9 bar' }}**

      # 5.2 Wheel Pressure Matrix (2×2)
      - type: grid
        columns: 2
        cards:
          # FL
          - type: custom:button-card
            entity: sensor.vehicle_tyre_pressure_front_left
            icon: mdi:tire
            name: "FL"
            show_label: true
            label: |
              [[[
                const pressStr = String(states['sensor.vehicle_tyre_pressure_front_left']?.state || '0');
                const pressure = parseFloat(pressStr);
                const isPsi = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                if (isNaN(pressure)) return isPsi ? '0.0 psi' : '0.00 bar';
                return isPsi ? `${(pressure * 14.5038).toFixed(1)} psi` : `${pressure.toFixed(2)} bar`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # FR
          - type: custom:button-card
            entity: sensor.vehicle_tyre_pressure_front_right
            icon: mdi:tire
            name: "FR"
            show_label: true
            label: |
              [[[
                const pressStr = String(states['sensor.vehicle_tyre_pressure_front_right']?.state || '0');
                const pressure = parseFloat(pressStr);
                const isPsi = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                if (isNaN(pressure)) return isPsi ? '0.0 psi' : '0.00 bar';
                return isPsi ? `${(pressure * 14.5038).toFixed(1)} psi` : `${pressure.toFixed(2)} bar`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # RL
          - type: custom:button-card
            entity: sensor.vehicle_tyre_pressure_rear_left
            icon: mdi:tire
            name: "RL"
            show_label: true
            label: |
              [[[
                const pressStr = String(states['sensor.vehicle_tyre_pressure_rear_left']?.state || '0');
                const pressure = parseFloat(pressStr);
                const isPsi = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                if (isNaN(pressure)) return isPsi ? '0.0 psi' : '0.00 bar';
                return isPsi ? `${(pressure * 14.5038).toFixed(1)} psi` : `${pressure.toFixed(2)} bar`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # RR
          - type: custom:button-card
            entity: sensor.vehicle_tyre_pressure_rear_right
            icon: mdi:tire
            name: "RR"
            show_label: true
            label: |
              [[[
                const pressStr = String(states['sensor.vehicle_tyre_pressure_rear_right']?.state || '0');
                const pressure = parseFloat(pressStr);
                const isPsi = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                if (isNaN(pressure)) return isPsi ? '0.0 psi' : '0.00 bar';
                return isPsi ? `${(pressure * 14.5038).toFixed(1)} psi` : `${pressure.toFixed(2)} bar`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

      # 5.3 Historical Pressure Chart
      # Two variants (bar vs psi) because apexcharts-card's yaxis min/max and
      # axis title are static YAML — they can't follow input_select.tesla_unit_system
      # live like a JS button-card label can. Only US Imperial switches to psi;
      # UK stays on bar (matches the rest of the pressure readouts on this tab).
      - type: conditional
        conditions:
          - entity: input_select.tesla_unit_system
            state_not: "US Imperial (mi, °F, psi)"
        card:
          type: custom:apexcharts-card
          graph_span: 30d
          cache: true
          header:
            show: true
            title: "Tire Pressure History (30 days)"
          apex_config:
            chart:
              height: 300
            yaxis:
              - min: 1.5
                max: 3.8
                title:
                  text: "bar"
            colors:
              - '#FF6B6B'
              - '#4ECDC4'
              - '#45B7D1'
              - '#FFA07A'
            plotOptions:
              area:
                fillTo: zero
          series:
            - entity: sensor.vehicle_tyre_pressure_front_left
              name: "Front Left"
              type: line
              stroke_width: 2
            - entity: sensor.vehicle_tyre_pressure_front_right
              name: "Front Right"
              type: line
              stroke_width: 2
            - entity: sensor.vehicle_tyre_pressure_rear_left
              name: "Rear Left"
              type: line
              stroke_width: 2
            - entity: sensor.vehicle_tyre_pressure_rear_right
              name: "Rear Right"
              type: line
              stroke_width: 2

      - type: conditional
        conditions:
          - entity: input_select.tesla_unit_system
            state: "US Imperial (mi, °F, psi)"
        card:
          type: custom:apexcharts-card
          graph_span: 30d
          cache: true
          header:
            show: true
            title: "Tire Pressure History (30 days)"
          apex_config:
            chart:
              height: 300
            yaxis:
              - min: 21.8
                max: 55.1
                title:
                  text: "psi"
            colors:
              - '#FF6B6B'
              - '#4ECDC4'
              - '#45B7D1'
              - '#FFA07A'
            plotOptions:
              area:
                fillTo: zero
          series:
            - entity: sensor.vehicle_tyre_pressure_front_left
              name: "Front Left"
              type: line
              stroke_width: 2
              transform: "return x * 14.5038;"
            - entity: sensor.vehicle_tyre_pressure_front_right
              name: "Front Right"
              type: line
              stroke_width: 2
              transform: "return x * 14.5038;"
            - entity: sensor.vehicle_tyre_pressure_rear_left
              name: "Rear Left"
              type: line
              stroke_width: 2
              transform: "return x * 14.5038;"
            - entity: sensor.vehicle_tyre_pressure_rear_right
              name: "Rear Right"
              type: line
              stroke_width: 2
              transform: "return x * 14.5038;"

  # ========== VIEW 6: COST PROJECTIONS ==========
  - title: Cost Projections
    path: cost
    icon: mdi:cash-multiple
    cards:
      # NOTE: Supercharger / Other Networks columns are shown as 0 — this
      # project only tracks Home electricity cost (via the Saved Location
      # Rates config). Tessie itself syncs real Supercharging costs from your
      # Tesla account; there's no equivalent automation here yet, so these
      # placeholders exist for layout parity but always read 0 until (if
      # ever) Supercharger cost tracking is implemented.
      - type: vertical-stack
        cards:
          # MONTHLY
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              block: |
                [[[
                  const monthly = parseFloat(states['sensor.tesla_monthly_electric_cost']?.state || '0') || 0;
                  const currencySymbol = states['sensor.tesla_currency_symbol']?.state || 'Ft';
                  const currencyLocale = states['sensor.tesla_currency_locale']?.state || 'hu-HU';
                  const row = (icon, label, value) =>
                    `<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid rgba(255,255,255,0.07)">
                      <span style="font-size:22px;width:26px;text-align:center;flex-shrink:0">${icon}</span>
                      <div>
                        <div style="color:#888;font-size:10px;font-weight:600;letter-spacing:1.2px">${label}</div>
                        <div style="color:#fff;font-size:20px;font-weight:700">${value}</div>
                      </div>
                    </div>`;
                  return `<div style="width:100%;text-align:left">
                    <div style="color:#888;font-size:11px;font-weight:600;letter-spacing:1.5px;padding-bottom:4px">📅 MONTHLY</div>
                    ${row('🏠', 'HOME', Math.round(monthly).toLocaleString(currencyLocale) + ' ' + currencySymbol)}
                    ${row('⚡', 'SUPERCHARGER', '0 ' + currencySymbol)}
                    ${row('🔌', 'OTHER NETWORKS', '0 ' + currencySymbol)}
                  </div>`;
