                    - margin-top: 0

              # Charges
              - type: custom:button-card
                entity: sensor.tesla_charging_time_today_raw
                icon: mdi:lightning-bolt
                name: "Charges"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const sessions = parseInt(states['sensor.tesla_charge_sessions_today']?.state || '0');
                    const hours = parseFloat(states['sensor.tesla_charging_time_today_raw']?.state || '0');
                    const mins = Math.round(hours * 60);
                    if (sessions === 0 && mins === 0) return 'No charges today';
                    const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                    return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
