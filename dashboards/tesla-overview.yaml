                - column-gap: 10px
                - align-items: center
              icon:
                - width: 20px
                - color: "#f4f4f5"
              img_cell:
                - width: 40px
                - height: 40px
                - border-radius: 50%
                - background: rgba(255,255,255,0.06)
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
                - color: "#f4f4f5"
              label:
                - justify-self: start
                - font-size: 12px
                - margin-top: 0
                - color: rgba(244,244,245,0.5)

      - type: grid
        cards:
          # 4.3 Charge Limit Slider (the car's own limit; Smart/Full auto
          # charging set it to the Target Charge Limit from Settings)
          - type: custom:mushroom-number-card
            entity: number.vehicle_charge_limit
            name: "Charge limit (car)"
            icon: mdi:battery-charging-100
            display_mode: slider
            fill_container: false
            card_mod:
              style: |
                ha-card {
                  background: rgba(255,255,255,0.04) !important;
                  border: 1px solid rgba(255,255,255,0.08) !important;
                  border-radius: 16px !important;
                  box-shadow: none !important;
                }

          # 4.4 Full Auto Charging status (agents.md Section 22). Tap toggles
          # Full auto; hold opens the plan sensor (all its attributes).
          - type: custom:button-card
            entity: input_boolean.tesla_full_auto_charging
            icon: |
              [[[
                return entity?.state === 'on'
                  ? (states['sensor.tesla_auto_charge_plan']?.attributes?.icon || 'mdi:robot-outline')
                  : 'mdi:robot-off-outline';
              ]]]
            name: |
              [[[
                return entity?.state === 'on' ? 'Full auto charging · On' : 'Full auto charging · Off';
              ]]]
            size: 18px
            show_state: false
            show_label: true
            label: |
              [[[
                if (entity?.state !== 'on') return 'Tap to let Home Assistant pick the cheapest time (solar, prices, deadline).';
                return states['sensor.tesla_auto_charge_plan']?.attributes?.summary || 'Working out a plan…';
              ]]]
            tap_action:
              action: toggle
            hold_action:
              action: more-info
              entity: sensor.tesla_auto_charge_plan
            styles:
              card:
                - background-color: |
                    [[[
                      return entity?.state === 'on' ? 'rgba(110, 231, 183, 0.08)' : 'rgba(255,255,255,0.04)';
                    ]]]
                - border: 1px solid rgba(255,255,255,0.08)
                - border-radius: 16px
                - box-shadow: none
                - padding: 14px 16px
                - --ha-card-border-width: 0px
              grid:
                - grid-template-areas: '"i n" "i l"'
                - grid-template-columns: 40px 1fr
                - column-gap: 10px
                - align-items: center
              icon:
                - width: 20px
                - color: |
                    [[[
                      return entity?.state === 'on' ? '#6ee7b7' : 'rgba(244,244,245,0.55)';
                    ]]]
              img_cell:
                - width: 40px
                - height: 40px
                - border-radius: 50%
                - background: rgba(255,255,255,0.06)
              name:
                - justify-self: start
                - font-size: 14px
                - font-weight: 600
                - color: "#f4f4f5"
              label:
                - justify-self: start
                - text-align: left
                - white-space: normal
                - font-size: 12px
                - margin-top: 2px
                - color: rgba(244,244,245,0.6)

          # 4.5 Action Row (Start/Stop + Unlock Port). With Full auto on,
          # "Start" becomes "Charge now" (charges until unplugged, whatever
          # the price) and "Stop" also pauses Full auto until unplugged.
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: script.tesla_charge_stop_manual
                icon: mdi:lightning-bolt
                name: |
                  [[[
                    if (states['binary_sensor.tesla_charging_active']?.state === 'on') return 'Stop charging';
                    return states['input_boolean.tesla_full_auto_charging']?.state === 'on' ? 'Charge now' : 'Start charging';
                  ]]]
                size: 20px
                show_state: false
                tap_action:
                  action: call-service
                  service: |
                    [[[
                      if (states['binary_sensor.tesla_charging_active']?.state === 'on') return 'script.tesla_charge_stop_manual';
                      return states['input_boolean.tesla_full_auto_charging']?.state === 'on' ? 'script.tesla_charge_now' : 'script.tesla_charge_start';
                    ]]]
                styles:
                  card:
                    - background-color: |
                        [[[
                          return states['binary_sensor.tesla_charging_active']?.state === 'on'
                            ? 'rgba(248, 113, 113, 0.12)'
                            : 'rgba(255,255,255,0.04)';
                        ]]]
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 12px
                    - --ha-card-border-width: 0px
                  icon:
                    - width: 20px
                    - color: |
                        [[[
                          return states['binary_sensor.tesla_charging_active']?.state === 'on' ? '#f87171' : '#6ee7b7';
                        ]]]
                  name:
                    - font-size: 12px
                    - font-weight: 500
                    - color: rgba(244,244,245,0.72)

              - type: custom:button-card
                entity: script.tesla_unlock_port
                icon: mdi:ev-station
                name: "Unlock port"
                size: 20px
                show_state: false
                tap_action:
                  action: call-service
                  service: script.tesla_unlock_port
                  confirmation:
                    text: Unlock the charge port?
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 12px
                    - --ha-card-border-width: 0px
                  icon:
                    - width: 20px
                    - color: "#f4f4f5"
                  name:
                    - font-size: 12px
                    - font-weight: 500
                    - color: rgba(244,244,245,0.72)

  # ========== VIEW 5: TIRES ==========
  - title: Tires
    path: tires
    icon: mdi:tire
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # 5.1 Target Pressure Notice
          # Value comes from input_number.tesla_recommended_tire_pressure
          # (editable on the Settings tab) — Tesla's Fleet API doesn't expose a
          # placard/recommended pressure, only live per-wheel readings, and the
          # correct value depends on your specific wheel size (see your car's
          # driver-door placard). Stored in bar; converted to psi for display.
          - type: markdown
            content: >
              {% set p = states('input_number.tesla_recommended_tire_pressure') | float(2.9) %}
              {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
              {% set size = states('input_select.tesla_wheel_size') %}
              💡 **Recommended cold pressure ({{ size }} wheels): {{ (p * 14.5038) | round(0) ~ ' psi' if is_psi else p | round(2) ~ ' bar' }}**

              <sub>Readings are about {{ '3–4 psi' if is_psi else '0.2–0.3 bar' }} higher when the tires are warm after driving. Check them cold (parked for 3+ hours).</sub>

          # 5.2 Tire Pressure Overlay (top-down car image)
          # Small thumbnail-style card (150px wide, centered) with 4 minimal
          # pressure readouts overlaid. No lock icon here, per explicit user
          # request — this tab is pressure-readouts only.
          # NOTE: assumes the image has the front of the car facing up (FL/FR
          # at top, RL/RR at bottom) — nudge the top/left % below if your
          # teslaTopDown.png is oriented differently.
          # NOTE: card-mod ("card_mod:" key) is used here, not the flat
          # `style: {border-radius: ..., overflow: ...}` mapping this file's
          # picture-elements cards used previously — that flat-mapping form
          # isn't valid card_mod syntax (card_mod expects a CSS string, or a
          # map of shadow-DOM-part-selector -> CSS string) and isn't part of
          # picture-elements' own schema either, so it was silently a no-op.
          # card-mod is already a required HACS card for this project (see
          # README's HACS card table).
          # NOTE: the 4 pressure elements below follow the user-supplied
          # card_mod pattern as closely as possible: transparent/borderless
          # ha-card (no green pill background/padding — that previous
          # attempt made the numbers unreadable), left-aligned primary/
          # secondary text sized via `ha-tile-info$`. A text-shadow was
          # added purely so white text stays legible over a busy/light car
          # photo background — remove it if you'd rather match the pasted
          # snippet exactly. Kept this project's live bar/psi unit-system
          # toggle (reading input_select.tesla_unit_system) instead of the
          # pasted snippet's static "Bar" secondary, and read the existing
          # sensor.vehicle_tyre_pressure_* Fleet Sensor Aliases directly
          # (no need to rebuild `sensor.<car>_tyre_pressure_*` via
          # input_text.tesla_car_name string concatenation — the alias layer
          # already exists for exactly this, see agents.md Section 5).
          - type: picture-elements
            image: media-source://media_source/local/teslaTopDown.png
            card_mod:
              style: |
                ha-card {
                  border-radius: 12px;
                  overflow: hidden;
                  width: 150px;
                  margin: 0 auto;
                }
            elements:
              # FL
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_front_left') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ '%.0f' | format(p * 14.5038) if is_psi else '%.2f' | format(p) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 15%
                  left: 12%
                  width: 20%

              # FR
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_front_right') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ '%.0f' | format(p * 14.5038) if is_psi else '%.2f' | format(p) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 15%
                  left: 90%
                  width: 20%

              # RL
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_rear_left') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ '%.0f' | format(p * 14.5038) if is_psi else '%.2f' | format(p) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 78%
                  left: 12%
                  width: 20%

              # RR
              - type: custom:mushroom-template-card
                primary: >-
                  {% set p = states('sensor.vehicle_tyre_pressure_rear_right') | float(0) %}
                  {% set is_psi = states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' %}
                  {{ '%.0f' | format(p * 14.5038) if is_psi else '%.2f' | format(p) }}
                secondary: >-
                  {{ 'psi' if states('input_select.tesla_unit_system') == 'US Imperial (mi, °F, psi)' else 'bar' }}
                multiline_secondary: false
                fill_container: false
                card_mod:
                  style:
                    ha-tile-info$: |
                      .primary {
                        font-size: 13px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                      .secondary {
                        font-size: 9px !important;
                        position: relative;
                        overflow: visible !important;
                        text-align: left;
                        color: #fff !important;
                        text-shadow: 0 0 3px #000, 0 0 3px #000;
                      }
                    .: |
                      ha-card {
                        background-color: transparent;
                        border: none;
                        box-shadow: none;
                      }
                      .content {
                        padding: 0px !important;
                      }
                style:
                  top: 78%
                  left: 90%
                  width: 20%

      - type: grid
        cards:
          # 5.3 Historical Pressure Chart
          # Two variants (bar vs psi) because apexcharts-card's yaxis min/max and
          # axis title are static YAML — they can't follow input_select.tesla_unit_system
          # live like a JS button-card label can. Only US Imperial switches to psi;
          # UK stays on bar (matches the rest of the pressure readouts on this tab).
          - type: conditional
            conditions:
              - entity: input_select.tesla_unit_system
                state_not: "US Imperial (mi, °F, psi)"
            card:
              type: custom:apexcharts-card
              graph_span: 7d
              cache: true
              header:
                show: true
                title: "Tire pressure · last 7 days"
              apex_config:
                chart:
                  height: 300
                yaxis:
                  - min: 2
                    max: 3.6
                    tickAmount: 8
                    decimalsInFloat: 1
                    title:
                      text: "bar"
                colors:
                  - '#FF6B6B'
                  - '#4ECDC4'
                  - '#45B7D1'
                  - '#FFA07A'
                plotOptions:
                  area:
                    fillTo: zero
              series:
                - entity: sensor.vehicle_tyre_pressure_front_left
                  name: "Front Left"
                  type: line
                  stroke_width: 2
                  float_precision: 2
                - entity: sensor.vehicle_tyre_pressure_front_right
                  name: "Front Right"
                  type: line
                  stroke_width: 2
                  float_precision: 2
                - entity: sensor.vehicle_tyre_pressure_rear_left
                  name: "Rear Left"
                  type: line
                  stroke_width: 2
                  float_precision: 2
                - entity: sensor.vehicle_tyre_pressure_rear_right
                  name: "Rear Right"
                  type: line
                  stroke_width: 2
                  float_precision: 2

          - type: conditional
            conditions:
              - entity: input_select.tesla_unit_system
                state: "US Imperial (mi, °F, psi)"
            card:
              type: custom:apexcharts-card
              graph_span: 7d
              cache: true
              header:
                show: true
                title: "Tire pressure · last 7 days"
              apex_config:
                chart:
                  height: 300
                yaxis:
                  - min: 28
                    max: 52
                    tickAmount: 6
                    decimalsInFloat: 0
                    title:
                      text: "psi"
                colors:
                  - '#FF6B6B'
                  - '#4ECDC4'
                  - '#45B7D1'
                  - '#FFA07A'
                plotOptions:
                  area:
                    fillTo: zero
              series:
                - entity: sensor.vehicle_tyre_pressure_front_left
                  name: "Front Left"
                  type: line
                  stroke_width: 2
                  float_precision: 0
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_front_right
                  name: "Front Right"
                  type: line
                  stroke_width: 2
                  float_precision: 0
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_rear_left
                  name: "Rear Left"
                  type: line
                  stroke_width: 2
                  float_precision: 0
                  transform: "return x * 14.5038;"
                - entity: sensor.vehicle_tyre_pressure_rear_right
                  name: "Rear Right"
