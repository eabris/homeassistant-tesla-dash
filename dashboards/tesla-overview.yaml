          # Interior · Exterior
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              temps: |
                [[[
                  const isF = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                  const fmt = (raw) => {
                    const t = parseFloat(String(raw || ''));
                    if (isNaN(t)) return '–';
                    const d = isF ? (t * 9 / 5 + 32) : t;
                    return `${d.toFixed(0)}°`;
                  };
                  const inside = fmt(states['sensor.vehicle_inside_temperature']?.state);
                  const outside = fmt(states['sensor.vehicle_outside_temperature']?.state);
                  return `<div style="text-align:center;width:100%">
                    <div style="color:rgba(244,244,245,0.55);font-size:13px;font-weight:500">Interior ${inside} · Exterior ${outside}</div>
                  </div>`;
                ]]]
            styles:
              card:
                - background: none
                - background-color: transparent
                - box-shadow: none
                - border: none
                - padding: 4px 8px 2px
                - --ha-card-border-width: 0px
              grid:
