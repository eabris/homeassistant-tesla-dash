                - background: transparent
                - box-shadow: none

          - type: custom:button-card
            entity: script.tesla_seat_heater_next_rr
            icon: mdi:seat
            name: "RR"
            tap_action:
              action: call-service
              service: script.tesla_seat_heater_next_rr
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const state = String(states['select.' + car + '_seat_heater_rear_right']?.state || '0');
                return state === 'unknown' ? '0' : state;
              ]]]

          # Row 4: 3L | empty | 3R
          - type: custom:button-card
            entity: script.tesla_seat_heater_next_3l
            icon: mdi:seat
            name: "3L"
            tap_action:
              action: call-service
              service: script.tesla_seat_heater_next_3l
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const state = String(states['select.' + car + '_seat_heater_third_row_left']?.state || '0');
                return state === 'unknown' ? '0' : state;
              ]]]

          - type: custom:button-card
            show_icon: false
            show_name: false
            styles:
              card:
                - background: transparent
                - box-shadow: none

          - type: custom:button-card
            entity: script.tesla_seat_heater_next_3r
            icon: mdi:seat
            name: "3R"
            tap_action:
              action: call-service
              service: script.tesla_seat_heater_next_3r
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const state = String(states['select.' + car + '_seat_heater_third_row_right']?.state || '0');
                return state === 'unknown' ? '0' : state;
              ]]]

      # Temperature Setpoint Stepper
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: script.tesla_climate_temp_down
            icon: mdi:minus
            name: ""
            tap_action:
              action: call-service
              service: script.tesla_climate_temp_down
            styles:
              card:
                - background-color: rgba(244, 67, 54, 0.2)

          - type: custom:button-card
            entity: input_text.tesla_car_name
            icon: mdi:thermometer
            name: "Target Temp"
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const target = states['climate.' + car + '_climate']?.attributes?.temperature;
                const isF = states['input_select.tesla_unit_system']?.state === 'US Imperial (mi, °F, psi)';
                // The vehicle's actual set point always stays in °C internally
                // (tesla_climate_temp_up/down step it by a fixed 0.5°C) — only
                // this readout is converted for display.
                const c = target ? parseFloat(target) : 22.0;
                const disp = isF ? (c * 9 / 5 + 32) : c;
                return `${disp.toFixed(1)}°${isF ? 'F' : 'C'}`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
