                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
                    - font-size: 18px
                    - font-weight: 600
                    - color: "#f4f4f5"
                    - margin-top: 0

              # Activity
              - type: custom:button-card
                entity: sensor.vehicle_shift_state
                icon: mdi:state-machine
                name: "Activity"
                size: 18px
                show_state: false
                show_label: true
                label: |
                  [[[
                    const state = String(states['sensor.vehicle_shift_state']?.state || '');
                    if (!state || state === 'unknown' || state === 'unavailable') return 'Parked';
                    return state.toUpperCase();
                  ]]]
                styles:
                  card:
                    - background-color: rgba(255,255,255,0.04)
                    - border: 1px solid rgba(255,255,255,0.08)
                    - border-radius: 16px
                    - box-shadow: none
                    - padding: 14px 16px
                    - --ha-card-border-width: 0px
                  grid:
                    - grid-template-areas: '"i n" "l l"'
                    - grid-template-columns: 22px 1fr
                    - column-gap: 8px
                    - row-gap: 6px
                    - align-items: center
                  icon:
                    - width: 18px
                    - color: rgba(244,244,245,0.55)
                  img_cell:
                    - width: 22px
                    - height: 22px
                  name:
                    - justify-self: start
                    - font-size: 11px
                    - font-weight: 500
                    - letter-spacing: 0.06em
                    - color: rgba(244,244,245,0.48)
                  label:
                    - justify-self: start
