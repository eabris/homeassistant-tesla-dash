  # ========== VIEW 4: BATTERY ==========
  - title: Battery
    path: battery
    icon: mdi:battery
    cards:
      # 4.1 Primary Battery Gauge
      - type: custom:button-card
        entity: sensor.tesla_battery_level
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          bar: |
            [[[
              const soc = parseFloat(states['sensor.tesla_battery_level']?.state || '0');
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const limit = parseFloat(states['number.' + car + '_charge_limit']?.state || '100');
              const color = soc > 70 ? '#4CAF50' : soc > 40 ? '#FFC107' : '#F44336';
              return `<div style="width:100%;background:rgba(255,255,255,0.1);border-radius:8px;height:14px;overflow:hidden;position:relative">
                <div style="width:${limit}%;background:rgba(255,255,255,0.08);height:100%;position:absolute;border-radius:8px"></div>
                <div style="width:${soc}%;background:${color};height:100%;border-radius:8px;position:relative"></div>
              </div>`;
            ]]]
        styles:
          card:
            - padding: 14px 16px
            - background-color: rgba(0, 0, 0, 0.2)
          custom_fields:
            bar:
              - width: 100%

      # 4.2 Telemetry Table (2×4 grid)
      - type: grid
        columns: 2
        cards:
          # LEVEL
          - type: custom:button-card
            entity: sensor.tesla_battery_level
            icon: mdi:percent
            name: "LEVEL"
            show_label: true
            label: |
              [[[
                const level = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                return `${level.toFixed(0)}%`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # RANGE
          - type: custom:button-card
            entity: sensor.tesla_battery_range
            icon: mdi:map-marker-distance
            name: "RANGE"
            show_label: true
            label: |
              [[[
                const soc = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                const rawEst = String(states['sensor.tesla_battery_range']?.state || '');
                const estVal = (!rawEst || rawEst === 'unknown' || rawEst === 'unavailable')
                  ? Math.round(soc * 4.1)
                  : Math.round(parseFloat(rawEst));
                const realLife = Math.round(estVal * 0.9);
                return `${estVal} km (${realLife} km)`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

          # DRAIN
          - type: custom:button-card
            entity: sensor.tesla_battery_level
            icon: mdi:water-remove
            name: "DRAIN"
            show_label: true
            label: |
              [[[
                const charging = String(states['sensor.tesla_charging']?.state || '').toLowerCase();
                const driving = states['binary_sensor.tesla_driving_active']?.state === 'true';
                if (charging === 'charging') return '+charging';
                if (driving) return 'Driving';
                return '–';
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # ENERGY
          - type: custom:button-card
            entity: sensor.tesla_battery_level
            icon: mdi:lightning-bolt
            name: "ENERGY"
            show_label: true
            label: |
              [[[
                const soc = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                const currentKwh = (soc).toFixed(2);
                return `${currentKwh} / 100.00 kWh`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

          # AMPERAGE
          - type: custom:button-card
            entity: sensor.tesla_charger_current
            icon: mdi:sine-wave
            name: "AMPERAGE"
            show_label: true
            label: |
              [[[
                const ampStr = String(states['sensor.tesla_charger_current']?.state || '0');
                const amp = parseFloat(ampStr);
                return isNaN(amp) ? '0.0 A' : `${amp.toFixed(1)} A`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # VOLTAGE
          - type: custom:button-card
            entity: sensor.tesla_charger_voltage
            icon: mdi:flash
            name: "VOLTAGE"
            show_label: true
            label: |
              [[[
                const voltStr = String(states['sensor.tesla_charger_voltage']?.state || '0');
                const volt = parseFloat(voltStr);
                return isNaN(volt) ? '0 V' : `${volt.toFixed(0)} V`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # ENERGY USED (Lifetime estimated)
          - type: custom:button-card
            entity: sensor.tesla_odometer
            icon: mdi:meter-gas
            name: "ENERGY USED"
            show_label: true
            label: |
              [[[
                const odom = parseFloat(states['sensor.tesla_odometer']?.state || '0');
                const kwh = (odom * 0.228).toFixed(0);
                return isNaN(odom) || odom === 0 ? '– kWh' : `~${parseFloat(kwh).toLocaleString('hu-HU')} kWh`;
              ]]]
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)
                - font-size: 12px

      # 4.3 Charge Limit Slider
      - type: custom:mushroom-number-card
        entity: number.tesla_charge_limit  # ⚠️ update if car is renamed
        name: "Charge Limit"
        icon: mdi:battery-charging-100
        display_mode: slider
        fill_container: false

      # 4.4 Action Row (Start/Stop + Unlock Port)
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: script.tesla_charge_stop
            icon: mdi:lightning-bolt
            name: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                return states['binary_sensor.' + car + '_charge_cable']?.state === 'on' ? 'Stop Charging' : 'Start Charging';
              ]]]
            tap_action:
              action: call-service
              service: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  return states['binary_sensor.' + car + '_charge_cable']?.state === 'on' ? 'script.tesla_charge_stop' : 'script.tesla_charge_start';
                ]]]
            styles:
              card:
                - background-color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['binary_sensor.' + car + '_charge_cable']?.state === 'on' ? 'rgba(244, 67, 54, 0.2)' : 'rgba(76, 175, 80, 0.2)';
                    ]]]

          - type: custom:button-card
            entity: script.tesla_unlock_port
            icon: mdi:lock-open
            name: "Unlock Port"
            tap_action:
              action: call-service
              service: script.tesla_unlock_port
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

