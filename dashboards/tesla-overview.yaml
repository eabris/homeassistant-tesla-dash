title: Tesla Overview
icon: mdi:car-electric
views:
  # ========== VIEW 1: DASHBOARD (Main Hub) ==========
  - title: Dashboard
    path: dashboard
    icon: mdi:gauge
    cards:
      # 1.1 Header Status Row
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: Tesla
            icon: mdi:car-electric
            label: "🔔"
            tap_action:
              action: none
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.3)
                - height: 60px
                - padding: 8px

          - type: custom:button-card
            entity: sensor.tesla_battery_range
            icon: mdi:battery
            name: "km"
            show_label: true
            label: |
              [[[
                const soc = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                const rawRange = String(states['sensor.tesla_battery_range']?.state || '');
                const range = (!rawRange || rawRange === 'unknown' || rawRange === 'unavailable')
                  ? `~${Math.round(soc * 4.1)}`
                  : rawRange;
                return `${soc.toFixed(0)}% • ${range} km`;
              ]]]
            styles:
              card:
                - background-color: >
                    [[[
                      const soc = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                      if (soc > 70) return 'rgba(76, 175, 80, 0.3)';
                      if (soc > 40) return 'rgba(255, 193, 7, 0.3)';
                      return 'rgba(244, 67, 54, 0.3)';
                    ]]]
                - height: 60px
                - padding: 8px

      # 1.2 Charging Status Card (Conditional)
      - type: conditional
        conditions:
          - entity: binary_sensor.tesla_charge_cable
            state: "on"
        card:
          type: custom:button-card
          entity: binary_sensor.tesla_charge_cable
          name: "CHARGING >"
          show_label: true
          label: |
            [[[
              const raw = String(states['sensor.tesla_time_to_full_charge']?.state || '');
              if (!raw || raw === 'unknown' || raw === 'unavailable') return 'Calculating...';
              const endTime = new Date(raw);
              const now = new Date();
              const diffMs = endTime - now;
              if (diffMs <= 0) return 'Fully charged';
              const diffMins = Math.round(diffMs / 60000);
              const h = Math.floor(diffMins / 60);
              const m = diffMins % 60;
              const hStr = String(endTime.getHours()).padStart(2, '0');
              const mStr = String(endTime.getMinutes()).padStart(2, '0');
              const dur = h > 0 ? `${h}h ${m}m` : `${m}m`;
              return `${dur} remaining > ${hStr}:${mStr}`;
            ]]]
          show_state: false
          styles:
            card:
              - background-color: rgba(33, 150, 243, 0.2)
              - border-left: 4px solid rgb(33, 150, 243)
              - padding: 12px

      # 1.3 Quick Action Row (6 buttons)
      - type: horizontal-stack
        cards:
          # Lock/Unlock
          - type: custom:button-card
            entity: script.tesla_lock_toggle
            icon: mdi:lock
            name: "Lock"
            tap_action:
              action: call-service
              service: script.tesla_lock_toggle
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)
              icon:
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['lock.' + car + '_lock']?.state === 'locked' ? 'rgb(76, 175, 80)' : 'rgb(244, 67, 54)';
                    ]]]

          # Climate
          - type: custom:button-card
            entity: script.tesla_climate_toggle
            icon: mdi:fan
            name: "Climate"
            tap_action:
              action: call-service
              service: script.tesla_climate_toggle
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Frunk
          - type: custom:button-card
            entity: script.tesla_frunk_open
            icon: mdi:car-door
            name: "Frunk"
            tap_action:
              action: call-service
              service: script.tesla_frunk_open
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Trunk
          - type: custom:button-card
            entity: script.tesla_trunk_open
            icon: mdi:car-back
            name: "Trunk"
            tap_action:
              action: call-service
              service: script.tesla_trunk_open
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Flash Lights
          - type: custom:button-card
            entity: script.tesla_flash_lights
            icon: mdi:lightbulb-flash
            name: "Flash"
            tap_action:
              action: call-service
              service: script.tesla_flash_lights
            styles:
              card:
                - background-color: rgba(76, 175, 80, 0.2)

          # Sentry
          - type: custom:button-card
            entity: script.tesla_sentry_toggle
            icon: mdi:shield-alert
            name: "Sentry"
            tap_action:
              action: call-service
              service: script.tesla_sentry_toggle
            styles:
              card:
                - background-color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['switch.' + car + '_sentry_mode']?.state === 'on' ? 'rgba(244, 67, 54, 0.3)' : 'rgba(76, 175, 80, 0.2)';
                    ]]]

      # 1.4 Location Strip Card
      - type: custom:button-card
        entity: input_text.tesla_car_name
        name: "📍 Current Location"
        show_label: true
        label: |
          [[[
            const car = states['input_text.tesla_car_name']?.state || 'tesla';
            const addr = String(states['device_tracker.' + car + '_location']?.state || 'No location');
            return addr.startsWith('unknown') ? 'No location' : addr;
          ]]]
        tap_action:
          action: url
          url_path: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const lat = state_attr('device_tracker.' + car + '_location', 'latitude');
              const lon = state_attr('device_tracker.' + car + '_location', 'longitude');
              return lat && lon ? `https://maps.google.com/?q=${lat},${lon}` : '#';
            ]]]
        styles:
          card:
            - background-color: rgba(33, 150, 243, 0.15)
            - padding: 12px

      # 1.5 Information Overview Grid (10 cards, 2 columns)
      - type: grid
        columns: 2
        cards:
          # Climate
          - type: custom:button-card
            entity: sensor.tesla_inside_temperature
            icon: mdi:thermometer
            name: "Climate"
            show_label: true
            label: |
              [[[
                const tempStr = String(states['sensor.tesla_inside_temperature']?.state || '0');
                const temp = parseFloat(tempStr);
                return isNaN(temp) ? 'N/A' : `${temp.toFixed(1)}°`;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Battery
          - type: custom:button-card
            entity: sensor.tesla_battery_range
            icon: mdi:battery
            name: "Battery"
            show_label: true
            label: |
              [[[
                const range = String(states['sensor.tesla_battery_range']?.state || '');
                if (!range || range === 'unknown' || range === 'unavailable') {
                  const soc = parseFloat(String(states['sensor.tesla_battery_level']?.state || '0'));
                  return isNaN(soc) ? '– km' : `~${Math.round(soc * 4.1)} km`;
                }
                return `${range} km`;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Schedule
          - type: custom:button-card
            entity: input_datetime.tesla_next_departure
            icon: mdi:calendar-clock
            name: "Schedule"
            show_label: true
            label: |
              [[[
                const time = String(states['input_datetime.tesla_next_departure']?.state || 'unknown');
                if (time === 'unavailable' || time === 'unknown' || !time) return 'Not set';
                const parts = time.split(' ');
                if (parts.length > 1 && parts[1]) {
                  const timeParts = parts[1].split(':');
                  return `${timeParts[0]}:${timeParts[1] || '00'}`;
                }
                return 'Not set';
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Tires
          - type: custom:button-card
            entity: sensor.tesla_tires_status
            icon: mdi:tire
            name: "Tires"
            show_label: true
            label: |
              [[[
                return String(states['sensor.tesla_tires_status']?.state || 'Unknown');
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Drives
          - type: custom:button-card
            entity: sensor.tesla_driving_time_today_raw
            icon: mdi:map
            name: "Drives"
            show_label: true
            label: |
              [[[
                const sessions = parseInt(states['sensor.tesla_drive_sessions_today']?.state || '0');
                const hours = parseFloat(states['sensor.tesla_driving_time_today_raw']?.state || '0');
                const mins = Math.round(hours * 60);
                if (sessions === 0 && mins === 0) return 'No drives today';
                const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Charges
          - type: custom:button-card
            entity: sensor.tesla_charging_time_today_raw
            icon: mdi:lightning-bolt
            name: "Charges"
            show_label: true
            label: |
              [[[
                const sessions = parseInt(states['sensor.tesla_charge_sessions_today']?.state || '0');
                const hours = parseFloat(states['sensor.tesla_charging_time_today_raw']?.state || '0');
                const mins = Math.round(hours * 60);
                if (sessions === 0 && mins === 0) return 'No charges today';
                const timeStr = hours >= 1 ? `${Math.floor(hours)}h ${Math.round((hours % 1) * 60)}m` : `${mins}m`;
                return sessions > 0 ? `${sessions}x · ${timeStr}` : timeStr;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Idles
          - type: custom:button-card
            entity: sensor.tesla_charging_time_3d_raw
            icon: mdi:parking
            name: "Idles"
            show_label: true
            label: |
              [[[
                const shift = String(states['sensor.tesla_shift_state']?.state || '').toUpperCase();
                const charging = String(states['sensor.tesla_charging']?.state || '').toLowerCase();
                const driving = states['binary_sensor.tesla_driving_active']?.state === 'true';
                if (driving) return 'Driving';
                if (['charging','preconditioning'].includes(charging)) return 'Charging';
                if (['p','park','unknown','unavailable',''].includes(shift.toLowerCase())) return 'Parked';
                return shift || 'Parked';
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Activity
          - type: custom:button-card
            entity: sensor.tesla_shift_state
            icon: mdi:state-machine
            name: "Activity"
            show_label: true
            label: |
              [[[
                const state = String(states['sensor.tesla_shift_state']?.state || '');
                if (!state || state === 'unknown' || state === 'unavailable') return 'Parked';
                return state.toUpperCase();
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)

          # Automation
          - type: custom:button-card
            entity: input_boolean.tesla_enable_smart_charging
            icon: mdi:wand-plus
            name: "Automation"
            show_label: true
            label: |
              [[[
                return states['input_boolean.tesla_enable_smart_charging']?.state === 'on' ? 'On' : 'Off';
              ]]]
            tap_action:
              action: call-service
              service: input_boolean.toggle
              service_data:
                entity_id: input_boolean.tesla_enable_smart_charging
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.2)



      # 1.6 Vehicle Specifications Footer
      - type: markdown
        content: |
          ---
          **{{ states('input_text.tesla_model') | default('Tesla Model X') }}** • VIN: {{ states('input_text.tesla_vin') | default('Unknown') }} • Plate: {{ states('input_text.tesla_plate') | default('Unknown') }}
          
          {% set car = states('input_text.tesla_car_name') %}
          Firmware: {{ state_attr('update.' + car + '_update', 'installed_version') | default('Unknown') }}{{ ' ⬆️' if states('update.' + car + '_update') == 'on' else '' }} • Odometer: {{ states('sensor.tesla_odometer') | round(0) }} km • Status: {{ 'Online' if is_state('binary_sensor.tesla_status', 'on') else 'Offline' }}

  # ========== VIEW 2: CONTROLS ==========
  - title: Controls
    path: controls
    icon: mdi:tune
    cards:
      # Vehicle Status Hero Card
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        custom_fields:
          status: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const online = states['binary_sensor.tesla_status']?.state === 'on';
              const driving = states['binary_sensor.tesla_driving_active']?.state === 'true';
              const charging = states['binary_sensor.tesla_charging_active']?.state === 'true';
              const soc = parseFloat(states['sensor.tesla_battery_level']?.state || '0');
              const range = states['sensor.tesla_battery_range']?.state;
              const rangeStr = (!range || range === 'unknown') ? `~${Math.round(soc * 4.1)} km` : `${Math.round(parseFloat(range))} km`;

              let statePill, stateColor;
              if (!online) {
                statePill = '😴 Sleeping'; stateColor = '#555';
              } else if (driving) {
                statePill = '🚗 Driving'; stateColor = '#1E88E5';
              } else if (charging) {
                statePill = '⚡ Charging'; stateColor = '#4CAF50';
              } else {
                statePill = '🅿️ Parked'; stateColor = '#888';
              }

              const battColor = soc > 70 ? '#4CAF50' : soc > 40 ? '#FFC107' : '#F44336';
              const battBar = `<div style="width:100%;background:rgba(255,255,255,0.08);border-radius:4px;height:6px;margin-top:4px">
                <div style="width:${soc}%;background:${battColor};height:6px;border-radius:4px"></div>
              </div>`;

              return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%">
                <div>
                  <span style="background:${stateColor};color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.5px">${statePill}</span>
                </div>
                <div style="text-align:right">
                  <div style="color:#fff;font-size:18px;font-weight:700">${soc.toFixed(0)}% <span style="color:#aaa;font-size:13px;font-weight:400">${rangeStr}</span></div>
                  ${battBar}
                </div>
              </div>`;
            ]]]
          details: |
            [[[
              const car = states['input_text.tesla_car_name']?.state || 'tesla';
              const online = states['binary_sensor.tesla_status']?.state === 'on';
              const sentry = states['switch.' + car + '_sentry_mode']?.state === 'on';
              const lock = states['lock.' + car + '_lock']?.state;
              const windows = states['cover.' + car + '_windows']?.state;

              const chip = (icon, label, color) =>
                `<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:3px 10px;font-size:11px;color:${color};margin:2px">${icon} ${label}</span>`;

              const lockChip = lock === 'locked'
                ? chip('🔒', 'Locked', '#4CAF50')
                : lock === 'unlocked' ? chip('🔓', 'Unlocked', '#F44336') : chip('🔒', '–', '#666');
              const winChip = windows === 'open'
                ? chip('🪟', 'Windows open', '#FF9F0A')
                : windows === 'closed' ? chip('🪟', 'Windows closed', '#4CAF50') : chip('🪟', '–', '#666');
              const sentryChip = sentry ? chip('🛡️', 'Sentry on', '#EF5350') : chip('🛡️', 'Sentry off', '#888');
              const onlineChip = online ? chip('📡', 'Online', '#4CAF50') : chip('📡', 'Offline', '#F44336');

              return `<div style="padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);margin-top:8px">
                ${onlineChip}${lockChip}${winChip}${sentryChip}
              </div>`;
            ]]]
        styles:
          card:
            - background-color: rgba(28, 28, 30, 0.95)
            - border-radius: 16px
            - padding: 16px 20px
          grid:
            - grid-template-areas: '"status" "details"'
            - grid-template-columns: 1fr
            - grid-template-rows: auto auto
          custom_fields:
            status:
              - width: 100%
            details:
              - width: 100%

      # Wake Car
      - type: custom:button-card
        entity: script.tesla_wake
        icon: mdi:sleep-off
        name: "Wake Car"
        show_label: true
        label: |
          [[[
            const online = states['binary_sensor.tesla_status']?.state === 'on';
            return online ? '✅ Vehicle is awake' : '💤 Tap to wake from sleep';
          ]]]
        tap_action:
          action: call-service
          service: script.tesla_wake
        styles:
          card:
            - background-color: |
                [[[
                  return states['binary_sensor.tesla_status']?.state === 'on'
                    ? 'rgba(76, 175, 80, 0.15)'
                    : 'rgba(255, 193, 7, 0.2)';
                ]]]
          icon:
            - color: |
                [[[
                  return states['binary_sensor.tesla_status']?.state === 'on'
                    ? 'rgb(76, 175, 80)'
                    : 'rgb(255, 193, 7)';
                ]]]

      # Window Controls
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: script.tesla_windows_vent
            icon: mdi:window-open-variant
            name: "Vent Windows"
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const s = states['cover.' + car + '_windows']?.state;
                return s === 'open' ? '● Currently open' : s === 'closed' ? '○ Currently closed' : '–';
              ]]]
            tap_action:
              action: call-service
              service: script.tesla_windows_vent
            styles:
              card:
                - background-color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['cover.' + car + '_windows']?.state === 'open'
                        ? 'rgba(255, 159, 10, 0.25)'
                        : 'rgba(76, 175, 80, 0.2)';
                    ]]]
              label:
                - font-size: 10px
                - color: |
                    [[[
                      const car = states['input_text.tesla_car_name']?.state || 'tesla';
                      return states['cover.' + car + '_windows']?.state === 'open'
                        ? 'rgb(255, 159, 10)'
                        : 'rgb(76, 175, 80)';
                    ]]]

          - type: custom:button-card
            entity: script.tesla_windows_close
            icon: mdi:window-closed-variant
            name: "Close Windows"
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const s = states['cover.' + car + '_windows']?.state;
                return s === 'closed' ? '● Already closed' : '↓ Tap to close';
              ]]]
            tap_action:
              action: call-service
              service: script.tesla_windows_close
            styles:
              card:
                - background-color: rgba(244, 67, 54, 0.2)
              label:
                - font-size: 10px
                - color: rgba(255, 255, 255, 0.5)

      # Sentry Mode
      - type: custom:button-card
        entity: script.tesla_sentry_toggle
        icon: mdi:shield-alert
        name: "Sentry Mode"
        show_label: true
        label: |
          [[[
            const car = states['input_text.tesla_car_name']?.state || 'tesla';
            return states['switch.' + car + '_sentry_mode']?.state === 'on'
              ? '🛡️ Active — monitoring surroundings'
              : '○ Inactive — tap to enable';
          ]]]
        tap_action:
          action: call-service
          service: script.tesla_sentry_toggle
        styles:
          card:
            - background-color: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  return states['switch.' + car + '_sentry_mode']?.state === 'on'
                    ? 'rgba(239, 83, 80, 0.2)'
                    : 'rgba(76, 175, 80, 0.15)';
                ]]]
          icon:
            - color: |
                [[[
                  const car = states['input_text.tesla_car_name']?.state || 'tesla';
                  return states['switch.' + car + '_sentry_mode']?.state === 'on'
                    ? 'rgb(239, 83, 80)'
                    : 'rgb(128, 128, 128)';
                ]]]
          label:
            - font-size: 11px
            - color: rgba(255, 255, 255, 0.6)

      # Media Player
      - type: media-control
        entity: media_player.tesla_media_player  # ⚠️ update if car is renamed

      # Valet Mode (Placeholder)
      - type: custom:button-card
        icon: mdi:car-key
        name: "Valet Mode"
        show_label: true
        label: "Not available in Tesla Fleet API"
        tap_action:
          action: none
        styles:
          card:
            - opacity: 0.5


  # ========== VIEW 3: CLIMATE ==========
  - title: Climate
    path: climate
    icon: mdi:hvac
    cards:
      # Header with outdoor temp
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: "Climate"
            icon: mdi:hvac
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.3)

          - type: custom:button-card
            entity: sensor.tesla_outside_temperature
            icon: mdi:weather-sunny
            name: "Outdoor"
            show_label: true
            label: |
              [[[
                const temp = parseFloat(String(states['sensor.tesla_outside_temperature']?.state || '0'));
                return `${temp.toFixed(1)}°`;
              ]]]
            styles:
              card:
                - background-color: rgba(0, 0, 0, 0.3)

      # Interior Temp Hero
      - type: custom:button-card
        entity: sensor.tesla_inside_temperature
        name: "INTERIOR"
        show_label: true
        label: |
          [[[
            const temp = parseFloat(String(states['sensor.tesla_inside_temperature']?.state || '0'));
            return `${temp.toFixed(1)}°`;
          ]]]
        styles:
          card:
            - font-size: 24px
            - padding: 20px
            - background-color: rgba(76, 175, 80, 0.15)
            - height: 100px

      # Seat Heating Matrix - Car cabin layout: Left | Center | Right
      - type: grid
        columns: 3
        cards:
          # Row 1: empty | Steering Wheel | empty
          - type: custom:button-card
            show_icon: false
            show_name: false
            styles:
              card:
                - background: transparent
                - box-shadow: none

          - type: custom:button-card
            entity: select.tesla_steering_wheel_heater  # ⚠️ update if car is renamed
            icon: mdi:steering
            name: "Wheel"
            tap_action:
              action: call-service
              service: script.tesla_steering_heater_next
            show_label: true
            label: |
              [[[
                const car = states['input_text.tesla_car_name']?.state || 'tesla';
                const state = String(states['select.' + car + '_steering_wheel_heater']?.state || '0');
                return state === 'unknown' ? '0' : state;
              ]]]

          - type: custom:button-card
            show_icon: false
            show_name: false
            styles:
              card:
                - background: transparent
                - box-shadow: none

          # Row 2: FL | empty | FR
          - type: custom:button-card
            entity: script.tesla_seat_heater_next_fl
            icon: mdi:seat-recline-extra
            name: "FL"
            tap_action:
              action: call-service
              service: script.tesla_seat_heater_next_fl
            show_label: true
            label: |
              [[[
