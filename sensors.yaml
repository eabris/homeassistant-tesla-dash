- platform: template
  sensors:
    deye_ev_charger_power:
      friendly_name: "Deye EV Charger Power"
      unit_of_measurement: "W"
      device_class: power
      value_template: >
        {{ (states('sensor.deye_ev_charger_power_l1') | float(0)
         + states('sensor.deye_ev_charger_power_l2') | float(0)
         + states('sensor.deye_ev_charger_power_l3') | float(0)) | round(0) }}